name: KrakenEdge
options:
  bundleIdPrefix: com.michaelrobinson
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  KrakenEdge:
    type: application
    platform: iOS
    sources:
      - path: KrakenEdge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelrobinson.KrakenEdge
        PRODUCT_NAME: Kraken Edge
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kraken Edge
        SUPPORTS_MACCATALYST: NO
