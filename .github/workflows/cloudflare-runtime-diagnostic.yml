name: Cloudflare scheduler runtime diagnostic (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-runtime-diagnostic.yml'
      - 'scheduler/cloudflare/diagnostic.py'
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diagnostics/cloudflare-runtime-20261117' && github.actor == 'michaelrobinsonproduct-del'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect live Cloudflare configuration and recorded runtime events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scheduler/cloudflare/diagnostic.py
