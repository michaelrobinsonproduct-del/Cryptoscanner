name: Runtime remote readback integrity
on:
  pull_request:
    paths:
      - 'paper_pov/runtime_readback_integrity.py'
      - 'paper_pov/test_runtime_readback_integrity.py'
      - 'paper_pov/github_artifact_readback.py'
      - 'paper_pov/test_github_artifact_readback.py'
      - '.github/workflows/runtime-readback-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q paper_pov/test_runtime_readback_integrity.py paper_pov/test_github_artifact_readback.py
  real-writer-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover newest successful single-writer artifact and bind immutable run identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["REPOSITORY"]
          selected = None
          # Bound the search; never fall back to an unverified historical run.
          for page in range(1, 6):
              raw = subprocess.check_output(["gh", "api", "-X", "GET",
                  f"repos/{repo}/actions/workflows/paper-pipeline.yml/runs?branch=main&status=success&per_page=100&page={page}"], timeout=45)
              runs = json.loads(raw).get("workflow_runs", [])
              if not runs:
                  break
              for run in runs:
                  if run.get("conclusion") != "success" or run.get("status") != "completed" or run.get("event") not in ("schedule", "workflow_dispatch"):
                      continue
                  rid, sha = run.get("id"), run.get("head_sha")
                  if not isinstance(rid, int) or not isinstance(sha, str) or len(sha) != 40:
                      continue
                  listing = json.loads(subprocess.check_output(["gh", "api", "-X", "GET",
                      f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100"], timeout=45))
                  if listing.get("total_count") != len(listing.get("artifacts", [])):
                      continue
                  matching = [a for a in listing["artifacts"] if a.get("name") == f"public-paper-ledger-{rid}" and a.get("expired") is False]
                  if len(matching) == 1:
                      selected = (rid, sha)
                      break
              if selected:
                  break
          if selected is None:
              raise SystemExit("NO_SOURCE_VERIFIED_SINGLE_WRITER_ARTIFACT")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"WRITER_RUN_ID={selected[0]}\nWRITER_SOURCE_SHA={selected[1]}\n")
          print("SELECTED_SOURCE_BOUND_WRITER", selected[0], selected[1])
          PY
      - name: Independently download existing manual paper writer artifact and restore locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m paper_pov.github_artifact_readback \
            --repo "${{ github.repository }}" \
            --run-id "$WRITER_RUN_ID" \
            --artifact-name public-paper-ledger \
            --source-sha "$WRITER_SOURCE_SHA" \
            --output /tmp/real-writer-recovery.json \
            --restore-dir /tmp/real-writer-recovered \
            --ledger-ref paper-proof-ledger \
            --ledger-path paper_pov/output/ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/real-writer-recovery.json").read_text())
          assert report["status"] == "WRITER_CHECKSUM_ONLY", report
          assert report["independently_authenticated"] is False, report
          assert report["remote_downloaded"] is True, report
          assert report["persisted_paper"]["ledger_generation"] >= 1, report
          assert report["persisted_paper"]["live_replay_performed"] is False, report
          assert report["persisted_paper"]["quote_evidence_certified"] is False, report
          assert report["persisted_paper"]["outcome"] in ("ABSTAIN", "HISTORICAL_UNCLASSIFIED", "HISTORICAL_RESULT_ONLY"), report
          assert report["remote_ledger_reconciliation"]["status"] in ("MATCH", "DIVERGED", "UNAVAILABLE"), report
          if report["remote_ledger_reconciliation"]["status"] == "UNAVAILABLE":
              assert report["remote_ledger_reconciliation"]["reason"] == "REMOTE_LEDGER_QUERY_FAILED", report
          assert report["remote_ledger_reconciliation"]["independently_authenticated"] is False, report
          root=Path("/tmp/real-writer-recovered")
          for name in ("latest.json", "ledger.json", "scoreboard.json", "SHA256SUMS"):
              assert ((root / name).is_file() or (root / "paper_pov/output" / name).is_file()), name
          print("D2_REAL_WRITER_RESTORED_CHECKSUM_ONLY", json.dumps(report, sort_keys=True))
          PY
      - name: Checkout existing B delivery consumer without changing D branch
        if: ${{ success() }}
        uses: actions/checkout@v4
        with:
          ref: integration-a-b-c-d-20261103
          path: b-delivery-consumer
          persist-credentials: false
      - name: Project recovered historical writer into B delivery consumer
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/b-delivery-consumer
        run: |
          set -euo pipefail
          cd b-delivery-consumer
          python -m paper_pov.github_delivery_projection \
            --repo "${{ github.repository }}" \
            --run-id "$WRITER_RUN_ID" \
            --writer-readback /tmp/real-writer-recovery.json \
            --output /tmp/d2-b-delivery.json
          python - <<'PY'
          import json
          from pathlib import Path
          writer=json.loads(Path("/tmp/real-writer-recovery.json").read_text())
          delivery=json.loads(Path("/tmp/d2-b-delivery.json").read_text())
          assert delivery["writer_recovery"]["source_run_id"] == int(writer["run_id"])
          assert delivery["writer_recovery"]["ledger_generation"] == writer["persisted_paper"]["ledger_generation"]
          assert delivery["writer_reconciliation_status"] == writer["remote_ledger_reconciliation"]["status"]
          assert delivery["writer_recovery"]["same_scan_as_delivery"] is False
          assert delivery["live_watch_authorized"] is False
          assert delivery["single_writer_read_only"] is True
          print("D2_B_HISTORICAL_READBACK_PROJECTED",json.dumps(delivery,sort_keys=True))
          PY
      - name: Consume same-run checksummed published results through B read-only delivery
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/b-delivery-consumer
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          rid=os.environ["WRITER_RUN_ID"]
          listing=json.loads(subprocess.check_output(["gh","api","-X","GET",
              f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100"], timeout=45))
          if listing.get("total_count") != len(listing.get("artifacts",[])):
              raise SystemExit("INCOMPLETE_PUBLISHED_ARTIFACT_LIST")
          matches=[a for a in listing["artifacts"] if a.get("name")==f"public-paper-results-{rid}" and a.get("expired") is False]
          if len(matches)!=1:
              # Historical writer receipts remain useful, but do not fabricate a
              # verified published result when the paired artifact is absent.
              print("D2_B_PUBLISHED_RESULTS_ABSTAIN_NO_PAIRED_ARTIFACT")
              with open(os.environ["GITHUB_ENV"],"a") as out:
                  out.write("PUBLISHED_RESULTS_AVAILABLE=false\n")
          else:
              with open(os.environ["GITHUB_ENV"],"a") as out:
                  out.write("PUBLISHED_RESULTS_AVAILABLE=true\n")
          PY
          if [ "$PUBLISHED_RESULTS_AVAILABLE" != "true" ]; then exit 0; fi
          mkdir -p /tmp/d2-published
          gh run download "$WRITER_RUN_ID" --repo "${{ github.repository }}" --name "public-paper-results-$WRITER_RUN_ID" --dir /tmp/d2-published
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path("/tmp/d2-published")
          files=list(root.rglob("*"))
          if any(p.is_symlink() for p in files):
              raise SystemExit("UNTRUSTED_PUBLISHED_ARTIFACT_SYMLINK")
          required={"results.json","results.md","SHA256SUMS"}
          matched=[p for p in files if p.is_file()]
          if {p.name for p in matched}!=required or len(matched)!=3:
              raise SystemExit("INCOMPLETE_PUBLISHED_RESULT_ARTIFACT")
          with ZipFile("/tmp/d2-published-results.zip","w",compression=ZIP_DEFLATED) as z:
              for p in matched:
                  z.write(p,p.name)
          PY
          cd b-delivery-consumer
          python -m paper_pov.github_delivery_projection \
            --published-artifact /tmp/d2-published-results.zip \
            --expected-run-id "$WRITER_RUN_ID" \
            --expected-source-sha "$WRITER_SOURCE_SHA" \
            --writer-readback /tmp/real-writer-recovery.json \
            --output /tmp/d2-b-published-delivery.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("/tmp/d2-b-published-delivery.json").read_text())
          assert result["source_run_id"] == int(__import__("os").environ["WRITER_RUN_ID"])
          assert result["single_writer_read_only"] is True
          assert result["live_watch_authorized"] is False
          assert result["production_applied"] is False
          assert result["writer_reconciliation_status"] == "MATCH"
          print("D2_B_VERIFIED_PUBLISHED_DELIVERY",json.dumps(result,sort_keys=True))
          PY
      - name: Retain verified published B delivery
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d2-b-published-delivery-report
          path: /tmp/d2-b-published-delivery.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain B read-only projection
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d2-b-historical-delivery-report
          path: /tmp/d2-b-delivery.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain read-only recovery result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d2-real-writer-recovery-report
          path: /tmp/real-writer-recovery.json
          if-no-files-found: warn
          retention-days: 7
