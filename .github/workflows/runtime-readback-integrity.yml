name: Runtime remote readback integrity
on:
  pull_request:
    paths:
      - 'paper_pov/runtime_readback_integrity.py'
      - 'paper_pov/test_runtime_readback_integrity.py'
      - '.github/workflows/runtime-readback-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q paper_pov/test_runtime_readback_integrity.py
