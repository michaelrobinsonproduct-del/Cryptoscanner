name: Paper Ledger Learning Read Only
on:
  workflow_dispatch:
    inputs:
      paper_run_id:
        description: "Completed successful canonical writer run ID; automatically dispatched by same writer after verified publication"
        required: false
        type: string
  pull_request:
    paths:
      - 'paper_pov/public_ledger_learning.py'
      - 'paper_pov/historical_paper_cohort.py'
      - 'paper_pov/kraken_observed_candles.py'
      - 'paper_pov/observed_kraken_outcomes.py'
      - 'paper_pov/observed_shadow_handoff.py'
      - 'paper_pov/heldout_outcome_adapter.py'
      - 'paper_pov/test_historical_paper_cohort.py'
      - 'paper_pov/test_public_ledger_learning.py'
      - 'paper_pov/rolling_kraken_candles.py'
      - 'paper_pov/test_rolling_kraken_candles.py'
      - '.github/workflows/paper-ledger-learning.yml'
permissions:
  contents: read
  actions: read
jobs:
  paper-ledger-learning:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused ledger schema acceptance
        run: python -m unittest paper_pov.test_public_ledger_learning paper_pov.test_historical_paper_cohort paper_pov.test_rolling_kraken_candles -v
      - name: Select latest persisted public paper ledger
        env:
          REQUESTED_RUN: ${{ inputs.paper_run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID="$REQUESTED_RUN"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api -X GET "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("public-paper-ledger-"))) | .workflow_run.id' | head -n 1)
          fi
          test -n "$RUN_ID"
          echo "PAPER_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Read existing paper ledger artifact
        run: |
          mkdir -p evidence
          gh run download "$PAPER_RUN_ID" -n "public-paper-ledger-$PAPER_RUN_ID" -D evidence
          cd evidence
          sha256sum -c SHA256SUMS
      - name: Reconstruct real persisted paper outcome accounting
        run: python -m paper_pov.public_ledger_learning evidence/ledger.json --output evidence/learning-state.json --report evidence/learning-report.md
      - name: Select pairs with recent persisted paper predictions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          ledger = json.loads(Path("evidence/ledger.json").read_text())
          now = datetime.now(timezone.utc)
          # Kraken returns up to 720 five-minute OHLC rows (~60 hours).
          # A 48h cutoff discards every already-mature 48h prediction.
          cutoff = now - timedelta(hours=60)
          matured = now - timedelta(hours=48)
          coverage = {}
          for p in ledger.get("predictions", []):
              try:
                  stamp = datetime.fromisoformat((p.get("entry_utc") or p.get("as_of")).replace("Z", "+00:00"))
                  pair = p.get("pair")
                  if cutoff <= stamp <= now and pair:
                      values = coverage.setdefault(pair, [0, 0])
                      values[0] += int(stamp <= matured)
                      values[1] += 1
              except (ValueError, TypeError, AttributeError):
                  continue
          # Prioritize source-backed 48h-mature rows under the existing 30-pair
          # Kraken request cap, rather than selecting pairs alphabetically.
          pairs = sorted(coverage, key=lambda pair: (-coverage[pair][0], -coverage[pair][1], pair))[:30]
          Path("evidence/recent-pairs.json").write_text(json.dumps(pairs))
          PY
      - name: Carry forward observed Kraken candles from existing learning artifact
        run: |
          set -euo pipefail
          python -m paper_pov.kraken_observed_candles evidence/recent-pairs.json --output evidence/kraken-candles-fresh.json
          # Reuse existing read-only learning artifacts: this is not another writer.
          mkdir -p evidence/prior
          PRIOR_RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("public-paper-learning-"))) | .workflow_run.id] | first // empty' || true)"
          if [ -n "$PRIOR_RUN" ]; then
            if ! gh run download "$PRIOR_RUN" -n "public-paper-learning-$PRIOR_RUN" -D evidence/prior; then
              echo "::warning::ROLLING_HISTORY_PRIOR_ARTIFACT_UNAVAILABLE; proceeding with fresh observations only"
            fi
          else
            echo "::notice::ROLLING_HISTORY_FIRST_RUN_NO_PRIOR_ARTIFACT"
          fi
          python -m paper_pov.rolling_kraken_candles \
            --fresh evidence/kraken-candles-fresh.json \
            --previous evidence/prior/kraken-candles.json \
            --output evidence/kraken-candles.json
      - name: Reconstruct only authentic completed Kraken outcomes and shadow evidence
        run: |
          python -m paper_pov.observed_kraken_outcomes evidence/ledger.json evidence/kraken-candles.json --output evidence/observed-outcomes.json
          python -m paper_pov.observed_shadow_handoff evidence/ledger.json evidence/observed-outcomes.json --candles-json evidence/kraken-candles.json --output evidence/shadow-handoff.json
      - name: Publish shadow-learning decision alongside paper results
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          outcomes = json.loads(Path("evidence/observed-outcomes.json").read_text())
          state = json.loads(Path("evidence/shadow-handoff.json").read_text())
          print("## Kraken paper learning — paper scan", __import__("os").environ["PAPER_RUN_ID"])
          print("Completed forward outcomes:", outcomes["complete_5m_outcomes"])
          print("Completed 48h outcomes:", state["observed_complete_48h"])
          print("Predictions with point-in-time features:", state["feature_complete_predictions"])
          print("Shadow learning:", state["status"])
          print("Reason:", state["reason"])
          if "shadow_state" in state:
              print("Baseline versus challenger:", state["shadow_state"]["comparison"])
          print("Paper-only; no production scoring promotion.")
          PY
      - name: Retain readable learning feedback with existing paper results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads(Path("evidence/shadow-handoff.json").read_text())
          o = json.loads(Path("evidence/observed-outcomes.json").read_text())
          lines = [
              "## Paper scan learning — run " + os.environ["PAPER_RUN_ID"],
              "",
              "Forward outcomes: " + str(o["complete_5m_outcomes"]),
              "Mature 48h outcomes: " + str(x["observed_complete_48h"]),
              "Predictions with point-in-time features: " + str(x["feature_complete_predictions"]),
              "Baseline vs challenger: " + x["status"],
              "Reason: " + x["reason"],
              "Production scoring unchanged."
          ]
          if "shadow_state" in x:
              lines.append("Comparison: " + json.dumps(x["shadow_state"]["comparison"], sort_keys=True))
          Path("evidence/paper-learning-results.md").write_text(chr(10).join(lines) + chr(10))
          PY
      - name: Publish learning summary in workflow results
        run: cat evidence/learning-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain read-only learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-learning-${{ github.run_id }}
          path: |
            evidence/learning-state.json
            evidence/learning-report.md
            evidence/paper-learning-results.md
            evidence/observed-outcomes.json
            evidence/kraken-candles.json
            evidence/shadow-handoff.json
          retention-days: 30
