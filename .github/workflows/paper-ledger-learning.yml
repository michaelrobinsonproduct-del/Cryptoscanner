name: Paper Ledger Learning Read Only
on:
  workflow_dispatch:
    inputs:
      paper_run_id:
        description: "Successful paper scan run ID containing public-paper-ledger artifact"
        required: true
        type: string
  pull_request:
    paths:
      - 'paper_pov/public_ledger_learning.py'
      - '.github/workflows/paper-ledger-learning.yml'
permissions:
  contents: read
  actions: read
jobs:
  paper-ledger-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read existing paper ledger artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_ID: ${{ inputs.paper_run_id }}
        run: |
          mkdir -p evidence
          gh run download "$RUN_ID" -n "public-paper-ledger-$RUN_ID" -D evidence
          cd evidence
          sha256sum -c SHA256SUMS
      - name: Reconstruct real persisted paper outcome accounting
        if: github.event_name == 'workflow_dispatch'
        run: python -m paper_pov.public_ledger_learning evidence/ledger.json --output evidence/learning-state.json
      - name: Retain read-only learning evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-learning-${{ inputs.paper_run_id }}
          path: evidence/learning-state.json
          retention-days: 30
