            gh run download 44244545891 -n market-wide-strict-seed-44244545891 -D evidence/historical-compact
          fi
          python -c 'import json; d=json.load(open("evidence/historical-compact/strict-training-seed/manifest.json")); assert d["digest"]=="98059c9e5019a125202ccbe71dcc23cfeed60f88587a3bb4332d9c1a0e67b6e5"'
          mkdir -p evidence/historical-trades
