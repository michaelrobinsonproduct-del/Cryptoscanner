name: Paper Ledger Learning Read Only
on:
  schedule:
    - cron: '54 * * * *'
  workflow_dispatch:
    inputs:
      paper_run_id:
        description: "Successful paper scan run ID containing public-paper-ledger artifact"
        required: false
        type: string
  pull_request:
    paths:
      - 'paper_pov/public_ledger_learning.py'
      - 'paper_pov/historical_paper_cohort.py'
      - 'paper_pov/test_public_ledger_learning.py'
      - '.github/workflows/paper-ledger-learning.yml'
permissions:
  contents: read
  actions: read
jobs:
  paper-ledger-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused ledger schema acceptance
        run: python -m unittest paper_pov.test_public_ledger_learning -v
      - name: Select latest persisted public paper ledger
        env:
          REQUESTED_RUN: ${{ inputs.paper_run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID="$REQUESTED_RUN"
          if [ "${{ github.event_name }}" = "pull_request" ]; then RUN_ID=42124179171; fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api -X GET "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("public-paper-ledger-"))) | .workflow_run.id' | head -n 1)
          fi
          test -n "$RUN_ID"
          echo "PAPER_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Read existing paper ledger artifact
        run: |
          mkdir -p evidence
          gh run download "$PAPER_RUN_ID" -n "public-paper-ledger-$PAPER_RUN_ID" -D evidence
          cd evidence
          sha256sum -c SHA256SUMS
      - name: Reconstruct real persisted paper outcome accounting
        run: python -m paper_pov.public_ledger_learning evidence/ledger.json --output evidence/learning-state.json --report evidence/learning-report.md
      - name: Recover archived per-prediction outcomes from earlier paper ledgers
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p history
          gh api -X GET "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("public-paper-ledger-"))) | .workflow_run.id' | head -n 12 > history/run_ids.txt
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            mkdir -p "history/$run_id"
            gh run download "$run_id" -n "public-paper-ledger-$run_id" -D "history/$run_id"
            (cd "history/$run_id" && sha256sum -c SHA256SUMS)
          done < history/run_ids.txt
          python -m paper_pov.historical_paper_cohort history --output evidence/historical-cohort.json
      - name: Append recovered historical outcome coverage
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          x = json.load(open("evidence/historical-cohort.json"))
          print("## Recovered historical per-prediction outcomes")
          print("Distinct predictions:", x["unique_predictions"])
          print("Distinct outcome rows:", x["unique_outcomes"])
          print("Recovered mature outcome rows:", x["recovered_mature_outcomes"])
          print("Source authenticated: false; no scoring promotion.")
          PY
      - name: Publish learning summary in workflow results
        run: cat evidence/learning-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain read-only learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-learning-${{ github.run_id }}
          path: |
            evidence/learning-state.json
            evidence/learning-report.md
            evidence/historical-cohort.json
          retention-days: 30
