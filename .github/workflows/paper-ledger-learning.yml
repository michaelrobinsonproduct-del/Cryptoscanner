name: Paper Ledger Learning Read Only
on:
  workflow_dispatch:
    inputs:
      paper_run_id:
        description: "Completed successful canonical writer run ID; automatically dispatched by same writer after verified publication"
        required: false
        type: string
      market_learning_bootstrap:
        description: "Explicit one-time main shadow learning bootstrap from approved pinned research checkpoint (never a reset)"
        required: false
        default: false
        type: boolean
      market_learning_restore_asset:
        description: "Approved exact main checkpoint asset name; only used if current main artifact missing"
        required: false
        type: string
      market_learning_restore_sha256:
        description: "Expected archive SHA256 from independent readback"
        required: false
        type: string
      market_learning_restore_state_digest:
        description: "Exact last approved main learning state digest, never an implicit rollback"
        required: false
        type: string
  pull_request:
    paths:
      - 'paper_pov/public_ledger_learning.py'
      - 'paper_pov/market_wide_learning.py'
      - 'paper_pov/learning_retention.py'
      - 'paper_pov/test_learning_retention.py'
      - 'paper_pov/test_market_wide_learning.py'
      - 'paper_pov/post_q3_observed_recovery.py'
      - 'paper_pov/historical_trade_recovery.py'
      - 'paper_pov/historical_trade_batch.py'
      - 'paper_pov/historical_coarse_discovery.py'
      - 'paper_pov/test_historical_coarse_discovery.py'
      - 'paper_pov/test_historical_trade_batch.py'
      - 'paper_pov/test_historical_trade_recovery.py'
      - 'paper_pov/test_post_q3_observed_recovery.py'
      - 'paper_pov/historical_paper_cohort.py'
      - 'paper_pov/kraken_observed_candles.py'
      - 'paper_pov/observed_kraken_outcomes.py'
      - 'paper_pov/observed_shadow_handoff.py'
      - 'paper_pov/heldout_outcome_adapter.py'
      - 'paper_pov/frozen_historical_shadow.py'
      - 'paper_pov/test_frozen_historical_shadow.py'
      - 'historical/evidence/q3_2026_frozen_shadow_v1.json'
      - 'paper_pov/test_historical_paper_cohort.py'
      - 'paper_pov/test_public_ledger_learning.py'
      - 'paper_pov/rolling_learning_predictions.py'
      - 'paper_pov/test_rolling_learning_predictions.py'
      - 'paper_pov/rolling_kraken_candles.py'
      - 'paper_pov/test_rolling_kraken_candles.py'
      - '.github/workflows/paper-ledger-learning.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-ledger-learning-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false
jobs:
  paper-ledger-learning:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused ledger schema acceptance
        run: python -m unittest paper_pov.test_public_ledger_learning paper_pov.test_historical_paper_cohort paper_pov.test_rolling_kraken_candles paper_pov.test_frozen_historical_shadow paper_pov.test_rolling_learning_predictions paper_pov.test_market_wide_learning -v
      - name: Select latest persisted public paper ledger
        env:
          REQUESTED_RUN: ${{ inputs.paper_run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID="$REQUESTED_RUN"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -z "$RUN_ID" ]; then
            RUN_ID=$(python - <<'PY'
          import base64,json,os,subprocess,sys
          from pathlib import Path
          from paper_pov.market_wide_learning import select_completed_learning_publication
          repo=os.environ["GH_REPO"]
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/{path}"]))
          def publication(ref):
              return json.loads(base64.b64decode(api(f"contents/verified-results/results.json?ref={ref}")["content"]))
          selected,mode=select_completed_learning_publication(
              publication("paper-proof-ledger"),lambda r:api(f"actions/runs/{r}"),publication)
          Path("/tmp/market-canonical.json").write_text(json.dumps(selected))
          print(mode,file=sys.stderr)
          print(selected["run_id"])
          PY
            )
            test -n "$RUN_ID"
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api -X GET "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("public-paper-ledger-"))) | .workflow_run.id' | head -n 1)
          fi
          test -n "$RUN_ID"
          echo "PAPER_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Read existing paper ledger artifact
        run: |
          mkdir -p evidence
          gh run download "$PAPER_RUN_ID" -n "public-paper-ledger-$PAPER_RUN_ID" -D evidence
          cd evidence
          sha256sum -c SHA256SUMS
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -f /tmp/market-canonical.json ]; then
            python -c 'import json; a=json.load(open("/tmp/market-canonical.json")); b=json.load(open("ledger.json")); assert a["ledger_generation"]==b["generation"], "Canonical artifact generation mismatch"'
          fi
      - name: Reconstruct real persisted paper outcome accounting
        run: python -m paper_pov.public_ledger_learning evidence/ledger.json --output evidence/learning-state.json --report evidence/learning-report.md
      - name: Select pairs with recent persisted paper predictions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          ledger = json.loads(Path("evidence/ledger.json").read_text())
          now = datetime.now(timezone.utc)
          # Kraken returns up to 720 five-minute OHLC rows (~60 hours).
          # A 48h cutoff discards every already-mature 48h prediction.
          cutoff = now - timedelta(hours=60)
          matured = now - timedelta(hours=48)
          coverage = {}
          for p in ledger.get("predictions", []):
              try:
                  stamp = datetime.fromisoformat((p.get("entry_utc") or p.get("as_of")).replace("Z", "+00:00"))
                  pair = p.get("pair")
                  if cutoff <= stamp <= now and pair:
                      values = coverage.setdefault(pair, [0, 0])
                      values[0] += int(stamp <= matured)
                      values[1] += 1
              except (ValueError, TypeError, AttributeError):
                  continue
          # Prioritize source-backed 48h-mature rows under the existing 30-pair
          # Kraken request cap, rather than selecting pairs alphabetically.
          pairs = sorted(coverage, key=lambda pair: (-coverage[pair][0], -coverage[pair][1], pair))[:30]
          Path("evidence/recent-pairs.json").write_text(json.dumps(pairs))
          PY
      - name: Carry forward observed Kraken candles from existing learning artifact
        run: |
          set -euo pipefail
          python -m paper_pov.kraken_observed_candles evidence/recent-pairs.json --output evidence/kraken-candles-fresh.json
          # Reuse existing read-only learning artifacts: this is not another writer.
          mkdir -p evidence/prior
          # Only durable main-branch learning may extend the production
          # history; PR/test artifacts are never authoritative ancestors.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # The isolated ledger may be older than main's newest learning
            # artifact by the time this step executes. Do not import future
            # prediction state or reset the cohort to hide a rollback.
            ledger_at=$(python -c 'import json; from paper_pov.shadow_learning_evidence import utc_time; print(utc_time(json.load(open("evidence/ledger.json"))["runs"][-1]["as_of"]).strftime("%Y-%m-%dT%H:%M:%SZ"))')
            PRIOR_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("public-paper-learning-")) and .workflow_run.head_branch == "main") | [.created_at,.workflow_run.id] | @tsv' | awk -v cutoff="$ledger_at" '$1 <= cutoff' | sort -r | head -n 1 | cut -f2)
            test -n "$PRIOR_RUN" || { echo "No temporally compatible main learning ancestor"; exit 1; }
          else
            PRIOR_RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("public-paper-learning-")) and .workflow_run.head_branch == "main") | .workflow_run.id] | first // empty')"
          fi
          if [ -n "$PRIOR_RUN" ]; then
            # Once continuity exists, a missing ancestor is an error: silently
            # replacing it with fresh 60h candles would erase mature cohorts.
            gh run download "$PRIOR_RUN" -n "public-paper-learning-$PRIOR_RUN" -D evidence/prior
            test -s evidence/prior/kraken-candles.json
          else
            echo "::notice::ROLLING_HISTORY_FIRST_RUN_NO_PRIOR_ARTIFACT"
          fi
          python -m paper_pov.rolling_kraken_candles \
            --fresh evidence/kraken-candles-fresh.json \
            --previous evidence/prior/kraken-candles.json \
            --output evidence/kraken-candles.json
      - name: Retain immutable prediction cohort alongside existing candle history
        run: |
          set -euo pipefail
          python -m paper_pov.rolling_learning_predictions --ledger evidence/ledger.json \
            --previous evidence/prior/learning-predictions.json --output evidence/learning-predictions.json
      - name: Reconstruct only authentic completed Kraken outcomes and shadow evidence
        run: |
          python -m paper_pov.observed_kraken_outcomes evidence/learning-predictions.json evidence/kraken-candles.json --output evidence/observed-outcomes.json
          python -m paper_pov.observed_shadow_handoff evidence/learning-predictions.json evidence/observed-outcomes.json --candles-json evidence/kraken-candles.json --output evidence/shadow-handoff.json
      - name: Evaluate frozen historical Q3 model on genuinely later WATCHs (read only)
        run: |
          python -m paper_pov.frozen_historical_shadow \
            evidence/ledger.json evidence/kraken-candles.json \
            historical/evidence/q3_2026_frozen_shadow_v1.json \
            --output evidence/frozen-q3-prospective.json
      - name: Publish shadow-learning decision alongside paper results
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          outcomes = json.loads(Path("evidence/observed-outcomes.json").read_text())
          state = json.loads(Path("evidence/shadow-handoff.json").read_text())
          print("## Kraken paper learning — paper scan", __import__("os").environ["PAPER_RUN_ID"])
          print("Completed forward outcomes:", outcomes["complete_5m_outcomes"])
          print("Completed 48h outcomes:", state["observed_complete_48h"])
          print("Predictions with point-in-time features:", state["feature_complete_predictions"])
          print("Shadow learning:", state["status"])
          frozen = json.loads(Path("evidence/frozen-q3-prospective.json").read_text())
          print("Frozen Q3 model prospective evidence:",
                json.dumps({k: frozen[k] for k in (
                    "eligible_scored_watchs", "paired_complete_scan_count",
                    "baseline_hits30", "shadow_hits30", "excluded")}, sort_keys=True))
          print("Frozen Q3 model is shadow-only; no scoring changes or verified lift.")
          print("Reason:", state["reason"])
          if "shadow_state" in state:
              print("Baseline versus challenger:", state["shadow_state"]["comparison"])
          print("Paper-only; no production scoring promotion.")
          PY
      - name: Retain readable learning feedback with existing paper results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads(Path("evidence/shadow-handoff.json").read_text())
          o = json.loads(Path("evidence/observed-outcomes.json").read_text())
          lines = [
              "## Paper scan learning — run " + os.environ["PAPER_RUN_ID"],
              "",
              "Forward outcomes: " + str(o["complete_5m_outcomes"]),
              "Mature 48h outcomes: " + str(x["observed_complete_48h"]),
              "Predictions with point-in-time features: " + str(x["feature_complete_predictions"]),
              "Baseline vs challenger: " + x["status"],
              "Reason: " + x["reason"],
              "Production scoring unchanged."
          ]
          if "shadow_state" in x:
              lines.append("Comparison: " + json.dumps(x["shadow_state"]["comparison"], sort_keys=True))
          Path("evidence/paper-learning-results.md").write_text(chr(10).join(lines) + chr(10))
          PY
      - name: Publish learning summary in workflow results
        run: cat evidence/learning-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain read-only learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-learning-${{ github.run_id }}
          path: |
            evidence/learning-predictions.json
            evidence/learning-state.json
            evidence/learning-report.md
            evidence/paper-learning-results.md
            evidence/observed-outcomes.json
            evidence/kraken-candles.json
            evidence/shadow-handoff.json
            evidence/frozen-q3-prospective.json
            evidence/market-wide-observed.json
          retention-days: 30

  market-wide-shadow-learning:
    # Merge does not activate the new job. First establish a verified checkpoint.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (vars.MARKET_WIDE_LEARNING_ENABLED == 'true' || inputs.market_learning_bootstrap == true || inputs.market_learning_restore_asset != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: market-wide-shadow-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused market learning acceptance
        run: python -m unittest paper_pov.test_market_wide_learning paper_pov.test_learning_retention -v
      - name: Select latest persisted public paper ledger
        env:
          REQUESTED_RUN: ${{ inputs.paper_run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Resolve the latest completed publication independently of the trigger.
          RUN_ID=$(python - <<'PY'
          import base64,json,os,subprocess,sys
          from pathlib import Path
          from paper_pov.market_wide_learning import select_completed_learning_publication
          repo=os.environ["GH_REPO"]
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/{path}"]))
          def publication(ref):
              return json.loads(base64.b64decode(api(f"contents/verified-results/results.json?ref={ref}")["content"]))
          selected,mode=select_completed_learning_publication(
              publication("paper-proof-ledger"),lambda r:api(f"actions/runs/{r}"),publication)
          Path("/tmp/market-canonical.json").write_text(json.dumps(selected))
          print(mode,file=sys.stderr)
          print(selected["run_id"])
          PY
          )
          test -n "$RUN_ID"
          echo "PAPER_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Read existing paper ledger artifact
        run: |
          mkdir -p evidence
          gh run download "$PAPER_RUN_ID" -n "public-paper-ledger-$PAPER_RUN_ID" -D evidence
          (cd evidence && sha256sum -c SHA256SUMS)
          python -c 'import json; from paper_pov.ledger import verify; a=json.load(open("/tmp/market-canonical.json")); b=json.load(open("evidence/ledger.json")); verify(b); assert a["ledger_generation"]==b["generation"] and a["ledger_sha256"]==b["sha256"] and a["source_sha"]==b["runs"][-1]["source_sha"], "Canonical artifact provenance mismatch"'
      - name: Score and retain independent market-wide shadow shard
        env:
          LEARNING_BRANCH: ${{ github.head_ref || github.ref_name }}
          LEARNING_SCOPE: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          ALLOW_MAIN_BOOTSTRAP: ${{ inputs.market_learning_bootstrap || false }}
          RESTORE_ASSET: ${{ inputs.market_learning_restore_asset }}
          RESTORE_SHA: ${{ inputs.market_learning_restore_sha256 }}
          RESTORE_STATE: ${{ inputs.market_learning_restore_state_digest }}
          CHECKPOINT_RELEASE: ${{ vars.MARKET_WIDE_CHECKPOINT_RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p evidence/market-prior
          # Normal ancestry is branch-isolated. Main has one explicit research
          # bootstrap receipt; it never searches arbitrary PR artifacts.
          prior_run=""
          prior_prefix="market-wide-learning-continuity-$LEARNING_SCOPE-"
          prior_branch="$LEARNING_BRANCH"
          while read -r candidate; do
            test -n "$candidate" || continue
            # A completed market-wide job owns the checkpoint. Other parallel
            # research jobs may still be running; don't lose this state.
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs?per_page=100")
            owner=$(jq -r '[.jobs[] | select(.name=="market-wide-shadow-learning") | .status+":"+(.conclusion//"")] | first // empty' <<< "$jobs")
            if [ "$owner" = "completed:success" ]; then
              prior_run="$candidate"
              break
            fi
            # Old-format PR artifacts predate extraction into the separate job.
            if [ -z "$owner" ] && [ "$LEARNING_SCOPE" = "pr" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate" --jq '.status + ":" + (.conclusion // "")')" = "completed:success" ]; then
              prior_run="$candidate"
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("market-wide-learning-continuity-"))) | [.workflow_run.head_branch,.workflow_run.id,.name] | @tsv' | awk -v branch="$LEARNING_BRANCH" -v prefix="$prior_prefix" '$1 == branch && index($3,prefix)==1 {print $2}' | sort -unr)
          restored=false
          if [ -z "$prior_run" ] && [ "$LEARNING_SCOPE" = "main" ] && [ -n "$RESTORE_ASSET" ]; then
            test "$ALLOW_MAIN_BOOTSTRAP" != "true"
            [[ "$RESTORE_ASSET" =~ ^market-wide-checkpoint-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+-[0-9]+\.tar\.gz$ ]]
            [[ "$RESTORE_SHA" =~ ^[0-9a-f]{64}$ ]]
            [[ "$RESTORE_STATE" =~ ^[0-9a-f]{64}$ ]]
            test -n "$CHECKPOINT_RELEASE"
            mkdir -p evidence/market-restore
            gh release download "$CHECKPOINT_RELEASE" --pattern "$RESTORE_ASSET" --dir evidence/market-restore
            python -m paper_pov.learning_retention unpack-durable-checkpoint --archive "evidence/market-restore/$RESTORE_ASSET" --directory evidence/market-prior --scope main --sha256 "$RESTORE_SHA" --state-digest "$RESTORE_STATE"
            prior_run=$(jq -r .source_run_id evidence/market-prior/checkpoint-manifest.json)
            [[ "$prior_run" =~ ^[0-9]+$ ]]
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior_run" --jq .head_branch)" = "main"
            restored=true
            echo "EXPLICIT_MAIN_CHECKPOINT_RESTORED=$prior_run"
          fi
          if [ -z "$prior_run" ] && [ "$LEARNING_SCOPE" = "main" ]; then
            # Never silently reset learning to a research snapshot when a main
            # checkpoint is missing, expired or deleted. Bootstrap is explicit.
            test "$ALLOW_MAIN_BOOTSTRAP" = "true" || { echo "::error::MAIN_LEARNING_CHECKPOINT_UNAVAILABLE; explicit first bootstrap or approved restore required"; exit 1; }
            existing=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.workflow_run.head_branch=="main" and (.name|startswith("market-wide-learning-continuity-main-"))) | .id' | sed -n '1p')
            test -z "$existing" || { echo "::error::Main checkpoint history exists; bootstrap cannot replace it"; exit 1; }
            prior_run=44253116626
            prior_prefix=market-wide-learning-continuity-pr-
            prior_branch=learning-market-wide-20261117
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/134628375708" --jq '.status + ":" + (.conclusion // "") + ":" + (.run_id|tostring) + ":" + .head_sha')" = "completed:success:44253116626:3160830000f63005daef5e55e8377fe0298750ef"
            echo "MAIN_RESEARCH_BOOTSTRAP_PINNED=$prior_run"
          fi
          prior_args=()
          model_path=historical/evidence/q3_2026_frozen_shadow_v1.json
          model_ready=2026-11-11T03:27:00Z
          if [ -n "$prior_run" ]; then
            if [ "$restored" != "true" ]; then
              gh run download "$prior_run" -n "$prior_prefix$prior_run" -D evidence/market-prior
            fi
            if [ ! -s evidence/market-prior/market-wide-state.json ]; then
              python -m paper_pov.learning_retention restore --directory evidence/market-prior/market-state-checkpoint --state evidence/market-prior/market-wide-state.json
            fi
            test -s evidence/market-prior/market-wide-state.json
            if [ "$LEARNING_SCOPE" = "main" ] && [ "$prior_prefix" = "market-wide-learning-continuity-pr-" ]; then
              test "$(jq -r .digest evidence/market-prior/market-wide-state.json)" = "5b52b7578d54f5bd70e8c217d0c53eb00826aa3348f9a225efcd7a1e0c7912db"
            fi
            echo "MARKET_LEARNING_PRIOR_RUN=$prior_run"
            echo "$prior_run" > evidence/market-prior-run.txt
            # Known incident checkpoint: recover evidence lost by unordered prior discovery.
            if [ "$LEARNING_SCOPE" = "pr" ] && [ "$prior_run" -ge 44221452274 ] && ! python -c 'import json; d=json.load(open("evidence/market-prior/market-wide-state.json")); raise SystemExit(not d.get("continuity_recovery_44220533486"))'; then
              mkdir -p evidence/market-recovery
              gh run download 44220533486 -n market-wide-learning-continuity-pr-44220533486 -D evidence/market-recovery
              python -c 'import json; from pathlib import Path; from paper_pov.market_wide_learning import recover_market_state; from paper_pov.shadow_learning_evidence import canonical_digest; p=Path("evidence/market-prior/market-wide-state.json"); d=recover_market_state(json.loads(p.read_text()),json.load(open("evidence/market-recovery/market-wide-state.json"))); d["continuity_recovery_44220533486"]=True; d["digest"]=canonical_digest({k:v for k,v in d.items() if k!="digest"}); p.write_text(json.dumps(d)); print("MARKET_LEARNING_RECOVERED",len(d["anchors"]),len(d["shadow_predictions"]))'
            fi
            prior_args=(--prior-state evidence/market-prior/market-wide-state.json)
            # Preserve the prior active model when scanning the same writer generation.
            if [ -s evidence/market-prior/market-wide-scoring-model.json ] && [ -s evidence/market-prior/market-wide-scoring-model-available.txt ]; then
              ready=$(python -c 'from pathlib import Path; print(Path("evidence/market-prior/market-wide-scoring-model-available.txt").read_text().strip().removesuffix(chr(92)+"n"))')
              if python -c 'import json,sys; from paper_pov.market_wide_learning import eligible_scoring_model; a=json.load(open("evidence/ledger.json")); m=json.load(open(sys.argv[1])); sys.exit(not eligible_scoring_model(m,sys.argv[2],a["runs"][-1]["as_of"]))' evidence/market-prior/market-wide-scoring-model.json "$ready"; then
                model_path=evidence/market-prior/market-wide-scoring-model.json
                model_ready="$ready"
              fi
            fi
            if [ -s evidence/market-prior/market-wide-model.json ]; then
              origin="$prior_run"
              if [ -s evidence/market-prior/market-wide-model-origin-run.txt ]; then
                origin=$(cat evidence/market-prior/market-wide-model-origin-run.txt)
              fi
              [[ "$origin" =~ ^[0-9]+$ ]]
              test "$origin" -le "$prior_run"
              origin_branch=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$origin" --jq '.head_branch')
              if [ "$origin_branch" != "$LEARNING_BRANCH" ]; then
                test "$LEARNING_SCOPE" = "main"
                test "$origin" = "44252782983"
                test "$origin_branch" = "learning-market-wide-20261117"
              fi
              origin_jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$origin/jobs?per_page=100")
              origin_owner=$(jq -r '[.jobs[]|select(.name=="market-wide-shadow-learning")]|first // empty' <<< "$origin_jobs")
              if [ -n "$origin_owner" ]; then
                test "$(jq -r '.status+":"+(.conclusion//"")' <<< "$origin_owner")" = "completed:success"
                completed=$(jq -r '.completed_at' <<< "$origin_owner")
              else
                test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$origin" --jq '.status + ":" + (.conclusion // "")')" = "completed:success"
