          d=build_learning_receipt(load("market-wide-observed.json"),load("market-wide-training-report.json"),
               load("market-wide-model.json"),writer=json.loads(Path("/tmp/market-canonical.json").read_text()),
               learning_scope=os.environ["LEARNING_SCOPE"])
          Path("evidence/market-wide-learning-receipt.json").write_text(json.dumps(d,sort_keys=True)+chr(10))
          print("MARKET_WIDE_LEARNING_RECEIPT",json.dumps(d,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write("## Independent market-wide shadow learning"+chr(10))
              summary.write(f"Writer {d['writer_run_id']}, generation {d['ledger_generation']}; training {d['training_count']} examples / {d['positive_count']} positives; observed current markets {d['cumulative_observed_current_markets']}/{d['eligible_markets']}. Shadow only; verified lift unavailable."+chr(10))
          PY
      - name: Verify partitioned learning checkpoint round trip
