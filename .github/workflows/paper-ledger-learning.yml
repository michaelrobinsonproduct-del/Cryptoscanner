          set -euo pipefail
          day=$(date -u +%F)
          prefix="market-wide-checkpoint-$day-"
          assets=$(gh release view "$CHECKPOINT_RELEASE" --json assets --jq '.assets[].name')
          existing=$(printf '%s\n' "$assets" | awk -v p="$prefix" 'index($0,p)==1 && /\.tar\.gz\.sha256$/ {print}')
          if [ -n "$existing" ]; then
            echo "Daily durable research checkpoint already has a readback receipt: $existing"
            exit 0
          fi
          mkdir -p evidence/checkpoint evidence/publish evidence/readback
          pending=$(printf '%s\n' "$assets" | awk -v p="$prefix" 'index($0,p)==1 && /\.tar\.gz$/ {print}')
          if [ -n "$pending" ]; then
            test "$(printf '%s\n' "$pending" | wc -l)" -eq 1
            name="$pending"
            gh release download "$CHECKPOINT_RELEASE" --pattern "$name" --dir evidence/readback
          else
            gh run download "$GITHUB_RUN_ID" -n "market-wide-learning-continuity-main-$GITHUB_RUN_ID" -D evidence/checkpoint
            generation=$(jq -r .ledger_generation evidence/checkpoint/market-wide-learning-receipt.json)
            [[ "$generation" =~ ^[0-9]+$ ]]
            name="$prefix$generation-$GITHUB_RUN_ID.tar.gz"
            python -m paper_pov.learning_retention pack-durable-checkpoint --directory evidence/checkpoint --archive "evidence/publish/$name" --scope main --run-id "$GITHUB_RUN_ID"
            gh release upload "$CHECKPOINT_RELEASE" "evidence/publish/$name"
            gh release download "$CHECKPOINT_RELEASE" --pattern "$name" --dir evidence/readback
            cmp "evidence/publish/$name" "evidence/readback/$name"
          fi
          digest=$(sha256sum "evidence/readback/$name" | cut -d' ' -f1)
          python -m paper_pov.learning_retention unpack-durable-checkpoint --archive "evidence/readback/$name" --directory evidence/restored --scope main --sha256 "$digest"
          printf '%s  %s\n' "$digest" "$name" > "evidence/readback/$name.sha256"
          gh release upload "$CHECKPOINT_RELEASE" "evidence/readback/$name.sha256"
          gh release download "$CHECKPOINT_RELEASE" --pattern "$name.sha256" --dir evidence/publish
          cmp "evidence/readback/$name.sha256" "evidence/publish/$name.sha256"
          echo "DURABLE_MAIN_CHECKPOINT_READBACK_VERIFIED=$name sha256=$digest"
