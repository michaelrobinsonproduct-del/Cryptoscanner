          python -m paper_pov.market_wide_learning evidence/historical-seed/market-wide-cohorts.jsonl.gz \
            "${trade_args[@]}" \
            --cumulative-state evidence/market-wide-state.json \
            --cold-state-directory evidence/market-cold-history \
            --cumulative-archive-sha256 96daae63c7b3acb522892e1f602f9c564d1a3fb659089d9b0699282f30d41226 \
            --additional-archive evidence/historical-q2/q2-market-wide-cohorts.jsonl.gz fc81b54cba6e12af3e9422dde9416179e6ef76af4831d48d839fbdb43018eaa4 \
            --retained-observed evidence/historical-recovered/post-q3-cohorts.jsonl.gz b532ac5eb892e931c096d0c3885d80f2838581a023b8dc9bc64118cb9027faef \
            --compact-seed evidence/historical-compact/strict-training-seed \
            --original-cohort-hash 5d883b8252b7a0a3186296801c3293060198481a13c67d0a384e9a41818241e5 \
            --original-cohort-hash 8c4d7e86d170b17a7a6a3d4ebf9fae1d5cd5f4844f5b1c33a1605f0650823d63 \
            --original-cohort-hash 287a405ba7f99c61df3075737e24e3f24e30137a9c45fbcee1671f257b35474c \
            --output evidence/market-wide-training-report.json
          export PRIOR_MARKET_RUN=""
          if [ -s evidence/market-prior/market-wide-model-origin-run.txt ]; then
            PRIOR_MARKET_RUN=$(cat evidence/market-prior/market-wide-model-origin-run.txt)
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          from paper_pov.market_wide_learning import choose_fitted_candidate
          current=json.loads(Path("evidence/market-wide-training-report.json").read_text())
          prior=Path("evidence/market-prior/market-wide-model.json")
          chosen,reused=choose_fitted_candidate(current,json.loads(prior.read_text()) if prior.is_file() else None)
          origin=os.environ["GITHUB_RUN_ID"]
          if reused:
              origin=os.environ.get("PRIOR_MARKET_RUN") or Path("evidence/market-prior-run.txt").read_text().strip()
          if not origin.isdigit():
