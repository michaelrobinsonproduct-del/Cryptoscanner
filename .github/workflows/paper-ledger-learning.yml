      - name: Recover bounded historical windows using verified observed universe and retained cursor state
        run: |
          set -euo pipefail
          mkdir -p evidence/trades-ledger evidence/trades-prior evidence/trades-seed
          RUN_ID=$(python - <<'PY'
          import base64,json,os,subprocess
          from paper_pov.market_wide_learning import select_completed_learning_publication
          repo=os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/{path}"]))
          def publication(ref):
              return json.loads(base64.b64decode(api(f"contents/verified-results/results.json?ref={ref}")["content"]))
          chosen,_=select_completed_learning_publication(publication("paper-proof-ledger"),lambda r:api(f"actions/runs/{r}"),publication)
          print(chosen["run_id"])
          PY
          )
          gh run download "$RUN_ID" -n "public-paper-ledger-$RUN_ID" -D evidence/trades-ledger
          (cd evidence/trades-ledger && sha256sum -c SHA256SUMS)
          prior=""
          while read -r candidate; do
            owner=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs?per_page=100" --jq '.jobs[]|select(.name=="historical-trade-recovery-pilot")|.status+":"+(.conclusion//"")')
            if [ "$owner" = "completed:success" ]; then
              prior="$candidate"
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.expired==false and (.name|startswith("historical-trade-batch-"))) | [.workflow_run.head_branch,.workflow_run.id] | @tsv' | awk -v branch="$PR_BRANCH" '$1 == branch {print $2}' | sort -unr)
          if [ -n "$prior" ]; then
            gh run download "$prior" -n "historical-trade-batch-$prior" -D evidence/trades-prior
            args=(--prior evidence/trades-prior)
          elif [ "$LEARNING_SCOPE" = "main" ]; then
            test "$ALLOW_MAIN_BOOTSTRAP" = "true" || { echo "::error::Main historical cursor checkpoint unavailable; explicit recovery required"; exit 1; }
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/134627815685" --jq '.status+":"+(.conclusion//"")+":"+(.run_id|tostring)+":"+.head_sha')" = "completed:success:44252876362:df8a7f6397cf0fff4e3929d5709fcbbdb60bcf57"
            gh run download 44252876362 -n historical-trade-batch-44252876362 -D evidence/trades-prior
            args=(--prior evidence/trades-prior)
          else
            gh run download 44228386331 -n historical-trade-recovery-pilot-44228386331 -D evidence/trades-seed
            (cd evidence/trades-seed && sha256sum -c SHA256SUMS)
            args=(--seed evidence/trades-seed)
          fi
          python -m paper_pov.historical_trade_batch --ledger evidence/trades-ledger/ledger.json \
            "${args[@]}" --output-dir evidence/october-trades
      - name: Retain cumulative source cursor checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: historical-trade-batch-${{ github.run_id }}
          path: evidence/october-trades/
          if-no-files-found: error
          retention-days: 90

