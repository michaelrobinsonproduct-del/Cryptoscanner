name: GitHub-native PAPER scanner continuity watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '4,34 * * * *'
permissions:
  actions: read
  contents: read
concurrency:
  group: paper-continuity-watchdog
  cancel-in-progress: false
jobs:
  verify-unattended-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check actual scheduled scanner execution independently of ChatGPT
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          now=dt.datetime.now(dt.timezone.utc)
          repo=os.environ["GH_REPO"]
          url=f"https://api.github.com/repos/{repo}/actions/workflows/paper-pipeline.yml/runs?per_page=100"
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=25) as response:
              runs=json.load(response)["workflow_runs"]
          scheduled=[r for r in runs if r["event"]=="schedule" and r["head_branch"]=="main"]
          succeeded=[r for r in scheduled if r["conclusion"]=="success"]
          active=[r for r in scheduled if r["status"] in ("queued","in_progress","waiting","pending")]
          latest=max(succeeded,key=lambda r:r["created_at"]) if succeeded else None
          def age(r):
              return (now-dt.datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))).total_seconds()/60
          summary=os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary,"a") as f:
              f.write("## GitHub-native PAPER scanner continuity\n\n")
              f.write(f"Checked UTC: {now.isoformat()}\n\n")
              f.write(f"Recent native scheduled runs: {len(scheduled)}; active: {len(active)}\n\n")
              if latest:
                  f.write(f"Last successful native scheduled run: [#{latest['id']}]({latest['html_url']}) — {age(latest):.1f} minutes ago\n\n")
              else:
                  f.write("No successful native scheduled run in the returned history.\n\n")
          # A currently running native job may legitimately finish after this check.
          # Do not mistake manual dispatches or ChatGPT automation for native schedule success.
          healthy=bool(latest and age(latest)<=75)
          if not healthy:
              print("::error::PAPER_NATIVE_CADENCE_MISSING: no successful scheduled scanner run in 75 minutes")
              print("Check the canonical paper-pipeline.yml schedule and ledger writer; do not start a second writer.")
              raise SystemExit(1)
          print("PAPER_NATIVE_CADENCE_OK",latest["id"],round(age(latest),1))
          PY
