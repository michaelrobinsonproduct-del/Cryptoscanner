name: Independent Paper Forward Outcome Audit
on:
  push:
    branches: [main, proof-outcome-main-integration-20261031, proof-ledger-continuity-roleb-20261031]
    paths:
      - 'paper_eval/**'
      - 'paper_pov/git_ledger_fetch.py'
      - 'paper_pov/test_git_ledger_fetch.py'
      - '.github/workflows/paper-forward-audit.yml'
  pull_request:
    paths:
      - 'paper_eval/**'
      - '.github/workflows/paper-forward-audit.yml'
  workflow_dispatch:
  # Independent evidence collection, not a second scanner or ledger writer.
  schedule:
    - cron: '21 * * * *'
permissions:
  contents: read
concurrency:
  group: paper-forward-audit-ci
  cancel-in-progress: false
jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checks must execute the immutable PR head, not a synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact checkout and independently audited synthetic contracts
        run: |
          set -euo pipefail
          echo "PAPER_FORWARD_AUDIT_SHA=$(git rev-parse HEAD)"
          python -m unittest discover -s paper_eval -p 'test_*.py' -v
          python -m unittest discover -s paper_pov -p 'test_*.py' -v
      - name: Fail closed on production or order execution imports
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          code=Path("paper_eval/audit.py").read_text()
          assert "independent_held_out_lift" in code
          assert '"production_applied": False' in code
          for forbidden in ("api.kraken.com/0/private/", "AddOrder", "railway", "subprocess"):
              assert forbidden not in code, forbidden
          print("PAPER_FORWARD_AUDIT_STATIC_SAFETY_OK")
          PY
      - name: Independently fetch and audit current public ledger (read-only)
        run: |
          set -euo pipefail
          python -m paper_pov.git_ledger_fetch
          LEDGER_COMMIT="$(git rev-parse refs/remotes/origin/paper-proof-ledger)"
          python -m paper_pov.segmented_repository export-git --repository . --commit "${LEDGER_COMMIT}" --output /tmp/public-paper-ledger.json
          BEFORE_COMMIT="$(git rev-parse "${LEDGER_COMMIT}^")"
          python -m paper_pov.segmented_repository export-git --repository . --commit "${BEFORE_COMMIT}" --output /tmp/public-paper-ledger-before.json
          mkdir -p paper_eval/output
          python -m paper_eval.report \
            --ledger /tmp/public-paper-ledger.json \
            --ledger-commit "${LEDGER_COMMIT}" \
            --output paper_eval/output/independent-audit.json
          python -m paper_eval.continuity \
            --before /tmp/public-paper-ledger-before.json \
            --after /tmp/public-paper-ledger.json \
            --before-commit "${BEFORE_COMMIT}" \
            --after-commit "${LEDGER_COMMIT}" \
            --output paper_eval/output/transition-audit.json
          # Check up to 16 adjacent Git first-parent transitions, not merely
          # the newest one. Missing ancestors fail closed unless the bound is hit.
          mkdir -p /tmp/paper-chain
          git rev-list --first-parent --max-count=17 "${LEDGER_COMMIT}" > /tmp/paper-chain/commits.txt
          : > /tmp/paper-chain/manifest.tsv
          while IFS= read -r COMMIT; do
            if ! git cat-file -e "${COMMIT}:paper-ledger.json" 2>/dev/null && ! git cat-file -e "${COMMIT}:paper-segment-manifest.json" 2>/dev/null; then
              break
            fi
            python -m paper_pov.segmented_repository export-git --repository . --commit "${COMMIT}" --output "/tmp/paper-chain/${COMMIT}.json"
            printf '%s\t%s\n' "${COMMIT}" "/tmp/paper-chain/${COMMIT}.json" >> /tmp/paper-chain/manifest.tsv
          done < /tmp/paper-chain/commits.txt
          python -m paper_eval.chain \
            --manifest /tmp/paper-chain/manifest.tsv \
            --tip "${LEDGER_COMMIT}" \
            --output paper_eval/output/chain-audit.json
          (cd paper_eval/output && sha256sum independent-audit.json transition-audit.json chain-audit.json > SHA256SUMS)
          echo "PAPER_AUDIT_LEDGER_COMMIT=${LEDGER_COMMIT}"
      - name: Preserve checked independent read-only audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: independent-paper-audit-${{ github.run_id }}
          path: |
            paper_eval/output/independent-audit.json
            paper_eval/output/transition-audit.json
            paper_eval/output/chain-audit.json
            paper_eval/output/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
