name: C2 retired workflow caller contract
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'paper_pov/test_retired_workflow_contract.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest paper_pov.test_retired_workflow_contract -v
