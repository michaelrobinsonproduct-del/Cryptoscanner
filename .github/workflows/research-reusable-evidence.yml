name: Kraken Reusable Research Evidence (isolated)
# Verified lease released: rerun bounded retained-evidence audit; production untouched.
on:
  workflow_dispatch:
    inputs:
      reacquire_source:
        description: 'Explicitly permit 9GB archive reacquisition only for documented evidence loss'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/research-reusable-evidence.yml'
  schedule:
    - cron: '13 3 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: consolidated-kraken-research
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ae16a8f430de922f3af34f8e9f4bfa6c34285d6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable research code and at least 383 offline tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '6ae16a8f430de922f3af34f8e9f4bfa6c34285d6'
          test -z "$(git status --porcelain)"
          python -m compileall -q research
          python -m unittest discover -s research -p 'test_*.py' -v 2>&1 | tee /tmp/research-tests.log
          python -c 'import re; from pathlib import Path; s=Path("/tmp/research-tests.log").read_text(); m=re.search(r"^Ran (\d+) tests", s, re.M); assert m and int(m.group(1))               >= 383, "expected at least 383 pinned offline tests"; print("EXACT_PINNED_TEST_COUNT", m.group(1))'
          grep -q '^OK$' /tmp/research-tests.log
      - name: Check cooperative research lease, active runs, and cached source evidence
        id: cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An owner string alone is not an active lease. Expired leases must not
          # permanently suppress research; malformed timestamps fail closed.
          # Bounded retry allows the committing worker to release its lease.
          # Never override an occupied lease or a competing live research job.
          for attempt in $(seq 1 12); do
            lease_active=$(gh api "repos/$GITHUB_REPOSITORY/contents/research/learning_progress.json?ref=research-learning-program-20261027" --jq '.content' | base64 -d | python -c '
          import datetime as dt, json, sys
          state = json.load(sys.stdin)["concurrency"]
          owner = state.get("owner")
          expiry = state.get("lease_expires_at")
          if not owner:
              print("false")
          elif not expiry:
              print("true")
          else:
              try:
                  deadline = dt.datetime.fromisoformat(expiry.replace("Z", "+00:00"))
                  if deadline.tzinfo is None:
                      raise ValueError("timezone required")
                  print("true" if deadline > dt.datetime.now(dt.timezone.utc) else "false")
              except (ValueError, TypeError):
                  print("true")
          ')
            other_active=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.status != "completed" and (.id | tostring) != env.GITHUB_RUN_ID and (.name | test("Research|Learning|Historical"; "i")))] | length')
            if [[ "$lease_active" == 'false' && "$other_active" == '0' ]]; then
              break
            fi
            if [[ "$attempt" == '12' ]]; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              echo 'Research lease or another research workflow remains active; bounded skip.'
              exit 0
            fi
            sleep 10
          done
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          cached_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=kraken-reusable-ohlc-evidence&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [[ -n "$cached_run" ]]; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
            echo "cached_run=$cached_run" >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.reacquire_source }}" != 'true' ]]; then
              echo 'No retained artifact: source reacquisition requires explicit opt-in and documented evidence gap.' >&2
              exit 1
            fi
          fi
      - name: Reuse retained source evidence (zero archive downloads)
        if: steps.cache.outputs.reuse == 'true' && steps.cache.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHED_RUN: ${{ steps.cache.outputs.cached_run }}
        run: |
          set -euo pipefail
          mkdir -p research/output
          gh run download "$CACHED_RUN" -R "$GITHUB_REPOSITORY" -n kraken-reusable-ohlc-evidence -D research/output
          test -s research/output/reusable_ohlc_evidence.zip
      - name: Acquire verified source ONCE and retain 48-market bounded evidence
        if: steps.cache.outputs.reuse == 'false' && steps.cache.outputs.skip == 'false' && inputs.reacquire_source == true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/output
          PYTHONPATH=research python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from inventory_kraken_archive import download_verified, resource_gate, EXPECTED_SHA256
          from build_reusable_ohlc_evidence import build
          with tempfile.TemporaryDirectory(prefix='kraken-reusable-source-') as temp:
              archive = Path(temp) / 'verified_ohlc.zip'
              verification = download_verified(archive, resources=resource_gate(Path(temp)))
              if verification['sha256'] != EXPECTED_SHA256:
                  raise RuntimeError('archive identity gate failed')
              cohort = json.loads(Path('research/kraken_reusable_market_selection.json').read_text())
              manifest = build(archive, cohort, 'research/output/reusable_ohlc_evidence.zip',
                               expected_archive_sha256=EXPECTED_SHA256)
              print(json.dumps({'source_verified': True, 'retained_markets': len(manifest['markets']),
                                'real_labels': 0, 'production_modified': False}, sort_keys=True))
          PY
      - name: Verify and summarize retained evidence without labels
        if: steps.cache.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research python - <<'PY'
          import json
          from pathlib import Path
          from build_reusable_ohlc_evidence import inspect
          from inventory_kraken_archive import EXPECTED_SHA256
          report = inspect('research/output/reusable_ohlc_evidence.zip', expected_archive_sha256=EXPECTED_SHA256)
          report['archive_downloads_this_run'] = 0 if '${{ steps.cache.outputs.reuse }}' == 'true' else 1
          report['production_modified'] = False
          Path('research/output/reusable_coverage_report.json').write_text(json.dumps(report, sort_keys=True) + '\n')
          print(json.dumps({'markets': report['markets'], 'real_labels': report['real_labels'],
                            'archive_downloads_this_run': report['archive_downloads_this_run']}, sort_keys=True))
          PY
      - name: Reuse bounded trade evidence or capture it once if absent
        if: steps.cache.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHED_RUN: ${{ steps.cache.outputs.cached_run }}
        run: |
          set -euo pipefail
          if [[ -n "$CACHED_RUN" ]]; then
            trade_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CACHED_RUN/artifacts" --jq '[.artifacts[] | select(.name == "kraken-bounded-independent-trade-members" and .expired == false)] | length')
            if [[ "$trade_count" == '1' ]]; then
              gh run download "$CACHED_RUN" -R "$GITHUB_REPOSITORY" -n kraken-bounded-independent-trade-members -D research/output
            elif [[ "$trade_count" != '0' ]]; then
              echo 'Ambiguous cached trade evidence' >&2
              exit 1
            fi
          fi
          # Legacy cached trade evidence predates strong revision validators.
          # Re-capture only bounded official trade members when the retained
          # source identity cannot be tied to the official manifest probe.
          if [[ -s research/output/bounded_independent_trade_members.zip ]]; then
            if ! python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/output/bounded_trade_probe_summary.json')
          r=json.loads(p.read_text()) if p.is_file() else {}
          v=r.get('source_revision_validator') or {}
          assert isinstance(v.get('strong_etag'), str) and v['strong_etag'] and not v['strong_etag'].startswith('W/')
          PY
            then
              echo 'Cached bounded trade evidence lacks strong source revision; refresh only bounded trade members.'
              rm -f research/output/bounded_independent_trade_members.zip research/output/bounded_trade_probe_summary.json
            fi
          fi
          if [[ ! -s research/output/bounded_independent_trade_members.zip ]]; then
            PYTHONPATH=research python research/probe_bounded_trade_members.py \
              --selection research/kraken_reusable_market_selection.json \
              --output research/output/bounded_independent_trade_members.zip \
              | tee research/output/bounded_trade_probe_summary.json
          fi
          test -s research/output/bounded_trade_probe_summary.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("research/output/bounded_trade_probe_summary.json").read_text()); assert r["real_labels"] == 0 and r["source_archive_full_sha256_verified"] is False and r["range_bytes_transferred"] <= 24*1024*1024; print("bounded trade evidence verified; no labels authorized")'
      - name: Corroborate one retained historical trade bucket via bounded independent Kraken REST (no labels)
        if: steps.cache.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/probe_historical_rest_interval.py \
            --retained-trades research/output/bounded_independent_trade_members.zip \
            --ohlc research/output/reusable_ohlc_evidence.zip \
            --output research/output/historical_rest_bucket_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/output/historical_rest_bucket_report.json').read_text())
          assert r['real_labels'] == 0 and r.get('independent_quarterly_completeness_verified') is not True
          assert r.get('independent_complete_historical_intervals', 0) == 0
          assert r.get('three_way_candle_correspondence') in (True, False)
          assert r.get('status') != 'independent_rest_bucket_correlated', 'REST-only match is not a three-way check'
          assert r.get('production_modified') is not True
          print('HISTORICAL_REST_PROBE_FAIL_CLOSED', json.dumps(r, sort_keys=True))
          PY
      - name: Independently corroborate contiguous observed 1h trade buckets (no labels)
        if: steps.cache.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/probe_historical_rest_window.py \
            --retained-trades research/output/bounded_independent_trade_members.zip \
            --ohlc research/output/reusable_ohlc_evidence.zip \
            --delay-seconds 1 \
            --output research/output/historical_rest_observed_window_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/output/historical_rest_observed_window_report.json').read_text())
          assert r['real_labels'] == 0 and r['held_out_lift'] is None
          assert r['independent_complete_historical_intervals'] == 0
          assert r['independent_quarterly_completeness_verified'] is False
          assert r['no_trade_intervals_verified'] == 0
          assert r['production_modified'] is False
          assert 0 <= r['observed_buckets_correlated'] <= 12
          assert r.get('rest_bytes_transferred', 0) <= 24*1024*1024
          print('CONTIGUOUS_OBSERVED_WINDOW_NOT_PREDICTIVE_LABELS',json.dumps(r,sort_keys=True))
          PY
      - name: Upload bounded independent observed-window corroboration
        if: steps.cache.outputs.skip == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-historical-rest-observed-window-corroboration
          path: research/output/historical_rest_observed_window_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded independent REST bucket corroboration
        if: steps.cache.outputs.skip == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-historical-rest-bucket-corroboration
          path: research/output/historical_rest_bucket_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Reconcile retained trades and audit closed-candle early-mover candidates (no labels)
        if: steps.cache.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/reconcile_retained_trade_evidence.py \
            --ohlc research/output/reusable_ohlc_evidence.zip \
            --trades research/output/bounded_independent_trade_members.zip \
            > research/output/trade_ohlc_reconciliation.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("research/output/trade_ohlc_reconciliation.json").read_text()); assert r["real_labels"] == 0 and r["held_out_evaluation"] == "not_authorized" and not r["source_trade_archive_sha256_verified"]; assert all(v["candidate_outcome_audit"]["real_labels"] == 0 and v["candidate_outcome_audit"]["held_out_evaluation"] == "not_authorized" for v in r["markets"].values()); assert all(v["retained_source_tail_contract_verified"] and v["ohlc_gap_semantics_authorize_labels"] is False for v in r["markets"].values()); assert all(v["retained_ohlc_structure_validated"] and v["retained_ohlc_gap_floor_verified"] for v in r["markets"].values()); print(json.dumps({k: {"exact_candidates": v["exact_trade_ohlc_candidate_intervals"], "interior_ohlc_missing_no_trade_candidates": v["ohlc_retained_missing_no_trade_candidate_intervals"], "candidate_outcomes": {h: {"windows": x["candidate_full_future_windows"], "descriptive_peak_30": x["descriptive_peak_30"], "beyond_retained_end": x["excluded_beyond_retained_end"], "missing": x["excluded_missing_exact_future"]} for h,x in v["candidate_outcome_audit"]["horizons"].items()}} for k,v in r["markets"].items()}, sort_keys=True))'
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/output/trade_ohlc_reconciliation.json").read_text())
          summary={}
          for market, record in sorted(r["markets"].items()):
              census=record["trade_ohlc_coverage_census"]
              assert census["verified_predictive_labels"] == 0
              assert census["independent_trade_source_completeness_verified"] is False
              assert census["no_trade_inference"] == "not_authorized_for_unobserved_intervals"
              assert census["overlap"]["exact_candidate_intervals"] == record["exact_trade_ohlc_candidate_intervals"]
              for h, counts in census["horizons"].items():
                  assert counts["verified_predictive_labels"] == 0
                  assert counts["complete_descriptive_windows"] == record["candidate_contiguous_horizon_windows"][h]
                  assert sum(v for k,v in counts.items() if k.startswith("excluded_") or k == "complete_descriptive_windows") == counts["candidate_entries"]
              summary[market] = {"overlap":census["overlap"], "horizon_exclusions":census["horizons"]}
          print("SOURCE_COVERAGE_UNAUTHENTICATED", json.dumps(summary, sort_keys=True))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/output/trade_ohlc_reconciliation.json").read_text())
          summary={}
          for market, row in sorted(r["markets"].items()):
              f=row["point_in_time_feature_audit"]
              assert f["real_labels"] == 0 and f["held_out_evaluation"] == "not_authorized"
              assert f["features_use_future_candles"] is False
              assert f["executable_fill_verified"] is False
              assert all(h["real_labels"] == 0 for h in f["horizons"].values())
              summary[market]={"feature_ready":f["feature_ready_entries"],
                  "one_hour_full_future":f["horizons"]["1"]["descriptive_complete_future_windows"],
                  "one_hour_early_peak30":f["horizons"]["1"]["descriptive_peak_30_with_prior_return_below_10pct"],
                  "real_labels":0}
          print("POINT_IN_TIME_DESCRIPTIVE_ONLY",json.dumps(summary,sort_keys=True))
          PY
      - name: Inspect official quarterly trade MANIFEST via bounded HTTPS ranges (not source authentication)
        if: steps.cache.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/inspect_kraken_trade_manifest.py \
            --selection research/kraken_reusable_market_selection.json \
            --retained-trades research/output/bounded_independent_trade_members.zip \
            --output research/output/official_trade_manifest_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/output/official_trade_manifest_report.json').read_text())
          assert r['real_labels'] == 0 and r['held_out_evaluation'] == 'not_authorized'
          assert r['source_archive_full_sha256_verified'] is False
          assert r['independent_trade_interval_completeness_verified'] is False
          assert r['range_bytes_transferred'] <= 8*1024*1024
          print(json.dumps({'status':r['status'],'manifest_sha256':r['manifest_sha256'],
                            'manifest_top_level_keys':r['manifest_top_level_keys'],
                            'manifest_schema_summary':r['manifest_schema_summary'],
                            'source_revision_validator':r['source_revision_validator'],
                            'range_bytes_transferred':r['range_bytes_transferred']},sort_keys=True))
          PY
      - name: Bounded one-time trade-only recapture on matching ETag metadata drift
        if: steps.cache.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          decision=$(PYTHONPATH=research python - <<'PY'
          import json
          from pathlib import Path
          from verify_trade_revision_binding import bounded_reuse_decision
          trade=json.loads(Path('research/output/bounded_trade_probe_summary.json').read_text())
          official=json.loads(Path('research/output/official_trade_manifest_report.json').read_text())
          print(bounded_reuse_decision(trade,official))
          PY
          )
          echo "BOUNDED_TRADE_CACHE_DECISION=$decision"
          if [[ "$decision" == 'refresh_bounded_trade_once' ]]; then
            cp research/output/bounded_trade_probe_summary.json /tmp/kraken-trade-before-refresh.json
            rm -f research/output/bounded_independent_trade_members.zip research/output/bounded_trade_probe_summary.json
            PYTHONPATH=research python research/probe_bounded_trade_members.py \
              --selection research/kraken_reusable_market_selection.json \
              --output research/output/bounded_independent_trade_members.zip \
              | tee research/output/bounded_trade_probe_summary.json
            python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/kraken-trade-before-refresh.json').read_text())
          after=json.loads(Path('research/output/bounded_trade_probe_summary.json').read_text())
          assert sorted(before['markets']) == sorted(after['markets']), 'trade market cohort changed during recapture'
          assert after['range_bytes_transferred'] <= 24*1024*1024
          assert after['source_archive_full_sha256_verified'] is False
          PY
            rm -f research/output/official_trade_manifest_report.json
            PYTHONPATH=research python research/inspect_kraken_trade_manifest.py \
              --selection research/kraken_reusable_market_selection.json \
              --retained-trades research/output/bounded_independent_trade_members.zip \
              --output research/output/official_trade_manifest_report.json
            PYTHONPATH=research python research/reconcile_retained_trade_evidence.py \
              --ohlc research/output/reusable_ohlc_evidence.zip \
              --trades research/output/bounded_independent_trade_members.zip \
              > research/output/trade_ohlc_reconciliation.json
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/output/trade_ohlc_reconciliation.json').read_text())
          assert r['real_labels'] == 0 and r['held_out_evaluation'] == 'not_authorized'
          assert all(x['point_in_time_feature_audit']['real_labels'] == 0 for x in r['markets'].values())
          print('BOUNDED_TRADE_REFRESH_RECONCILED_NO_LABELS', sorted(r['markets']))
          PY
          elif [[ "$decision" != 'reuse' ]]; then
            echo "Source revision conflict; fail closed: $decision" >&2
            exit 1
          fi
      - name: Verify same official source revision and actual retained market identities (not complete labels)
        if: steps.cache.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research python research/verify_trade_revision_binding.py \
            --trades research/output/bounded_trade_probe_summary.json \
            --official research/output/official_trade_manifest_report.json \
            --output research/output/trade_revision_binding.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/output/trade_revision_binding.json').read_text())
          assert r['real_labels'] == 0 and r['complete_trade_intervals_verified'] == 0
          assert r['source_trade_archive_sha256_verified'] is False
          if not r['same_source_revision']:
              raise RuntimeError('trade/manifest source revision not consistent: ' + r['status'])
          print('BOUND_REVISION_CONSISTENT_NOT_SOURCE_AUTHENTICATED')
          PY
      - name: Upload bounded source revision binding report
        if: steps.cache.outputs.skip == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-trade-revision-binding
          path: research/output/trade_revision_binding.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded official trade manifest inspection
        if: steps.cache.outputs.skip == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-official-trade-manifest-inspection
          path: research/output/official_trade_manifest_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload retained trade-to-OHLC reconciliation report
        if: steps.cache.outputs.skip == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-trade-ohlc-reconciliation
          path: research/output/trade_ohlc_reconciliation.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded independent trade evidence and manifest
        if: steps.cache.outputs.skip == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-bounded-independent-trade-members
          path: |
            research/output/bounded_independent_trade_members.zip
            research/output/bounded_trade_probe_summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Refresh reusable evidence artifact for future unattended runs
        if: steps.cache.outputs.skip == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-reusable-ohlc-evidence
          path: research/output/reusable_ohlc_evidence.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded research coverage report
        if: steps.cache.outputs.skip == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-reusable-coverage-report
          path: research/output/reusable_coverage_report.json
          if-no-files-found: error
          retention-days: 30
