name: Public Kraken Paper POV (scheduled, isolated ledger)
on:
  workflow_dispatch:
  schedule:
    - cron: '20,50 * * * *'
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: public-paper-proof-ledger-single-writer
  cancel-in-progress: false
jobs:
  public-paper:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed originating schedule provenance (no ledger writes)
        env:
          PAPER_GITHUB_EVENT: ${{ github.event_name }}
          PAPER_COMMENT_BODY: ${{ github.event.comment.body }}
          PAPER_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PAPER_ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAPER_CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "$PAPER_GITHUB_EVENT" in
            schedule)
              case "$PAPER_CRON_EXPRESSION" in
                '20,50 * * * *') ;;
                *) echo "PAPER_UNRECOGNIZED_ORIGINATING_CRON"; exit 1 ;;
              esac
              ;;
            issue_comment)
              test "$PAPER_ISSUE_NUMBER" = "34" &&
              test "$PAPER_COMMENT_BODY" = "/paper-cadence-heartbeat" &&
              test "$PAPER_COMMENT_AUTHOR" = "michaelrobinsonproduct-del" || {
                echo "PAPER_UNAUTHORIZED_CADENCE_COMMENT"; exit 1;
              }
              ;;
            workflow_dispatch)
              test -z "$PAPER_CRON_EXPRESSION" || {
                echo "PAPER_MANUAL_WITH_SCHEDULE_PAYLOAD"; exit 1;
              }
              ;;
            *) echo "PAPER_UNRECOGNIZED_GITHUB_EVENT"; exit 1 ;;
          esac
          echo "PAPER_VERIFIED_GITHUB_EVENT=$PAPER_GITHUB_EVENT"
          echo "PAPER_VERIFIED_ORIGINATING_CRON=${PAPER_CRON_EXPRESSION:-MANUAL_DISPATCH}"
      - name: Exact commit tests before any ledger mutation
        run: |
          set -euo pipefail
          echo "PAPER_PIPELINE_SOURCE_SHA=$(git rev-parse HEAD)"
          # Full repository suite runs on pull requests; do not repeat 660 tests
          # before every market snapshot. Retain direct writer/ledger/cadence gates.
          python -m unittest paper_pov.test_workflow_trigger_guard paper_pov.test_cadence_wake paper_pov.test_ledger paper_pov.test_segmented_live_writer paper_pov.test_scanner
      - name: Restore checksum-sealed existing ledger (never silently bootstrap)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=4096 origin refs/heads/paper-proof-ledger:refs/remotes/origin/paper-proof-ledger
          git rev-parse refs/remotes/origin/paper-proof-ledger > /tmp/paper-base.sha
          # For segmented ledgers, fetch the exact immutable legacy checkpoint.
          BASE="$(cat /tmp/paper-base.sha)"
          if git cat-file -e "${BASE}:paper-segment-manifest.json" 2>/dev/null; then
            CHECKPOINT="$(git show "${BASE}:paper-segment-manifest.json" | python -c 'import json,sys;print(json.load(sys.stdin)["checkpoint"]["git_commit"])')"
            git cat-file -e "${CHECKPOINT}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$CHECKPOINT"
          fi
          python -m paper_pov.segmented_repository export-git \
            --repository . --commit "$BASE" --output /tmp/paper-ledger-input.json --full-replay
          python - <<'PY'
          import json
          from pathlib import Path
          from paper_pov.ledger import verify
          from paper_pov.segmented_storage import MAX_RAW_BYTES
          state=verify(json.loads(Path("/tmp/paper-ledger-input.json").read_text()),MAX_RAW_BYTES)
          print("PAPER_RESTORED",state["generation"],len(state["runs"]),state["sha256"])
          PY
      - name: Real bounded public Kraken scan (paper only)
        run: |
          set -euo pipefail
          python -m paper_pov.scanner
      - name: Append immutable as-of records and only matured observed outcomes
        run: |
          set -euo pipefail
          python -m paper_pov.segmented_live_writer stage \
            --repository . --base "$(cat /tmp/paper-base.sha)" \
            --report paper_pov/output/latest.json --source-sha "$GITHUB_SHA" \
            --staged /tmp/paper-staged --next-ledger /tmp/paper-ledger-next.json \
            --scoreboard paper_pov/output/scoreboard.json
          echo "PAPER_LEDGER_SCOREBOARD $(cat paper_pov/output/scoreboard.json)"
          cp /tmp/paper-ledger-next.json paper_pov/output/ledger.json
          (cd paper_pov/output && sha256sum latest.json scoreboard.json ledger.json > SHA256SUMS)
          cp paper_pov/output/scoreboard.json /tmp/paper-scoreboard.json
      - name: Cross-run nonregression and provenance acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from paper_pov.ledger import verify,scoreboard
          from paper_pov.segmented_storage import MAX_RAW_BYTES
          before=verify(json.loads(Path("/tmp/paper-ledger-input.json").read_text()),MAX_RAW_BYTES)
          after=verify(json.loads(Path("/tmp/paper-ledger-next.json").read_text()),MAX_RAW_BYTES)
          score=scoreboard(after,MAX_RAW_BYTES)
          import os
          from paper_pov.retention_acceptance import verify_transition
          report=json.loads(Path("paper_pov/output/latest.json").read_text())
          retention=verify_transition(before,after,report,os.environ["GITHUB_SHA"])
          assert score["actual_scans"]==after["generation"]
          assert score["immutable_predictions"]>=len(before["predictions"])
          assert score["market_observations"]>=len(before["observations"])
          assert after["runs"][-1]["source_sha"]==os.environ["GITHUB_SHA"]
          assert score["held_out_lift"] is None and score["production_applied"] is False
          print("PAPER_CROSS_RUN_VERIFIED",before["generation"],after["generation"],score["ledger_sha256"],retention)
          PY
      - name: Preserve independently downloadable checked artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-ledger-${{ github.run_id }}
          path: |
            paper_pov/output/latest.json
            paper_pov/output/ledger.json
            paper_pov/output/scoreboard.json
            paper_pov/output/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
      - name: Non-force, single-writer ledger push and remote readback
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/paper-proof-ledger:refs/remotes/origin/paper-proof-ledger
          test "$(git rev-parse refs/remotes/origin/paper-proof-ledger)" = "$(cat /tmp/paper-base.sha)" || {
            echo "LEDGER_CONCURRENT_UPDATE_ABORT"; exit 1;
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Save exact tested source and generated results outside Git checkout.
          mkdir -p /tmp/paper-source-root
          cp -a paper_pov /tmp/paper-source-root/paper_pov
          cp -a paper_pov/output /tmp/paper-output
          git clean -fdx
          git checkout -B paper-proof-ledger refs/remotes/origin/paper-proof-ledger
          PYTHONPATH=/tmp/paper-source-root python -m paper_pov.segmented_live_writer apply \
            --repository . --base "$(cat /tmp/paper-base.sha)" --staged /tmp/paper-staged
          git diff --cached --check
          git commit -m "paper: atomic packed scan ${{ github.run_id }} source ${{ github.sha }}"
          git push origin HEAD:refs/heads/paper-proof-ledger
          git fetch --no-tags origin +refs/heads/paper-proof-ledger:refs/remotes/origin/paper-proof-ledger
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/paper-proof-ledger)"
          PYTHONPATH=/tmp/paper-source-root python -m paper_pov.segmented_live_writer verify-remote \
            --repository . --base "$(cat /tmp/paper-base.sha)" \
            --commit "$(git rev-parse HEAD)" --staged /tmp/paper-staged
          echo "PAPER_LEDGER_REMOTE_READBACK_VERIFIED $(git rev-parse HEAD)"
      - name: Render verified UTC results after ledger remote readback
        env:
          PAPER_ORIGINATING_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          LEDGER_COMMIT="$(git rev-parse refs/remotes/origin/paper-proof-ledger)"
          # Restore immutable scanner source locally; do not touch remote ledger.
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p paper_pov/output
          cp -a /tmp/paper-output/. paper_pov/output/
          python -m paper_pov.results_report \
            --scan paper_pov/output/latest.json \
            --scoreboard paper_pov/output/scoreboard.json \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$GITHUB_SHA" \
            --ledger-commit "$LEDGER_COMMIT" \
            --event "$GITHUB_EVENT_NAME" \
            --originating-cron "$PAPER_ORIGINATING_CRON" \
            --output-dir paper_pov/output/results
          (cd paper_pov/output/results && sha256sum -c SHA256SUMS)
          cat paper_pov/output/results/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Persist one canonical verified result on existing ledger branch
        run: |
          set -euo pipefail
          # The sole writer has already pushed and read back the immutable ledger.
          # Publish the exact checksummed render at a stable path, in that same branch.
          LEDGER_COMMIT="$(python -c 'import json;print(json.load(open("paper_pov/output/results/results.json"))["ledger_commit"])')"
          test "$(git rev-parse refs/remotes/origin/paper-proof-ledger)" = "$LEDGER_COMMIT"
          git fetch --no-tags origin +refs/heads/paper-proof-ledger:refs/remotes/origin/paper-proof-ledger
          test "$(git rev-parse refs/remotes/origin/paper-proof-ledger)" = "$LEDGER_COMMIT" || {
            echo "CANONICAL_RESULTS_CONCURRENT_UPDATE_ABORT"; exit 1;
          }
          mkdir -p /tmp/paper-canonical-results
          cp paper_pov/output/results/results.json /tmp/paper-canonical-results/results.json
          cp paper_pov/output/results/results.md /tmp/paper-canonical-results/results.md
          cp paper_pov/output/results/SHA256SUMS /tmp/paper-canonical-results/SHA256SUMS
          git checkout -B paper-proof-ledger "$LEDGER_COMMIT"
          mkdir -p verified-results
          cp /tmp/paper-canonical-results/* verified-results/
          (cd verified-results && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("verified-results/results.json").read_text())
          assert p["status"]=="SUCCESS_PAPER_ONLY"
          assert p["run_id"]==os.environ["GITHUB_RUN_ID"]
          assert p["source_sha"]==os.environ["GITHUB_SHA"]
          assert p["remote_readback_verified"] is True
          assert p["ledger_commit"]==os.popen("git rev-parse HEAD").read().strip()
          PY
          git add verified-results/results.json verified-results/results.md verified-results/SHA256SUMS
          git diff --cached --check
          git commit -m "paper: publish verified results ${GITHUB_RUN_ID} source ${GITHUB_SHA}"
          git push origin HEAD:refs/heads/paper-proof-ledger
          git fetch --no-tags origin +refs/heads/paper-proof-ledger:refs/remotes/origin/paper-proof-ledger
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/paper-proof-ledger)"
          git show HEAD:verified-results/results.json > /tmp/paper-results-readback.json
          cmp /tmp/paper-results-readback.json /tmp/paper-canonical-results/results.json
          echo "PAPER_CANONICAL_RESULTS_REMOTE_READBACK_VERIFIED"
          # Restore exact scanner source and rendered outputs for artifact upload;
          # verified results remain published on the ledger branch.
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p paper_pov/output/results
          cp /tmp/paper-canonical-results/* paper_pov/output/results/
          (cd paper_pov/output/results && sha256sum -c SHA256SUMS)
      - name: Preserve public human-readable paper results
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-results-${{ github.run_id }}
          path: |
            paper_pov/output/results/results.md
            paper_pov/output/results/results.json
            paper_pov/output/results/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
      - name: Request existing read-only learning job for exact verified writer run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The canonical ledger and published results are already committed
          # and independently read back. Learning must never cause a healthy
          # paper scan to be reclassified as failed or trigger a second scan.
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/paper-ledger-learning.yml/dispatches" \
              -f ref=main -f "inputs[paper_run_id]=${GITHUB_RUN_ID}"; then
            echo "PAPER_READ_ONLY_LEARNING_DISPATCH_ACCEPTED run=${GITHUB_RUN_ID}"
            echo "Read-only learning dispatched for verified writer ${GITHUB_RUN_ID}; its independent outcome remains to be verified." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::PAPER_READ_ONLY_LEARNING_DISPATCH_FAILED run=${GITHUB_RUN_ID}; scan and ledger remain successful."
            echo "Read-only learning dispatch FAILED for verified writer ${GITHUB_RUN_ID}; no learning claim." >> "${GITHUB_STEP_SUMMARY}"
          fi
          # Existing independent legacy-inspired strategy (read only); the same
          # writer run ID binds its artifact to these canonical WATCH results.
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/paper-legacy-shadow.yml/dispatches" \
              -f ref=main -f "inputs[paper_run_id]=${GITHUB_RUN_ID}"; then
            echo "PAPER_READ_ONLY_LEGACY_DISPATCH_ACCEPTED run=${GITHUB_RUN_ID}"
            echo "Independent legacy shadow dispatched for verified writer ${GITHUB_RUN_ID}; independently verify its artifact before overlap stars." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::PAPER_READ_ONLY_LEGACY_DISPATCH_FAILED run=${GITHUB_RUN_ID}; canonical result remains valid."
            echo "Independent legacy shadow dispatch FAILED for verified writer ${GITHUB_RUN_ID}; no overlap claim." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Publish explicit failed-run paper results
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          # A failed ledger-push step can leave checkout on the ledger branch.
          # Recover the exact source SHA's reporting script, never execute ledger code.
          # Always load the immutable exact-source script even if checkout is on the ledger branch.
          git show "${GITHUB_SHA}:paper_pov/failure_report.py" > /tmp/paper-failure-report.py
          python /tmp/paper-failure-report.py \
            --run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA" \
            --output-dir /tmp/paper-failure-results
          (cd /tmp/paper-failure-results && sha256sum -c SHA256SUMS)
          cat /tmp/paper-failure-results/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failed-run report artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-failure-${{ github.run_id }}
          path: |
            /tmp/paper-failure-results/results.md
            /tmp/paper-failure-results/results.json
            /tmp/paper-failure-results/SHA256SUMS
          retention-days: 90
          if-no-files-found: warn
