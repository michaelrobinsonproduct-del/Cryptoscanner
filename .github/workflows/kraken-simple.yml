name: Simplified Kraken Scan (isolated)
on:
  pull_request:
    paths:
      - 'simple_scanner/**'
      - '.github/workflows/kraken-simple.yml'
  workflow_dispatch:
  schedule:
    - cron: '3,33 * * * *'
permissions:
  contents: write
concurrency:
  group: kraken-simple-history
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline ledger regression tests
        run: python -m unittest discover -s simple_scanner -p 'test_*.py' -v
      - name: Restore existing history from dedicated branch
        run: |
          set -euo pipefail
          mkdir -p simple_scanner/output
          set +e
          git ls-remote --exit-code --heads origin simple-history >/dev/null
          remote_status=$?
          set -e
          if [ "$remote_status" -eq 0 ]; then
            git fetch origin refs/heads/simple-history:refs/remotes/origin/simple-history
            git show origin/simple-history:history.sqlite3 > simple_scanner/output/history.sqlite3
            python - <<'PY'
          import sqlite3
          c=sqlite3.connect("simple_scanner/output/history.sqlite3")
          assert c.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          print("RESTORED_SNAPSHOTS",c.execute("SELECT COUNT(*) FROM snapshots").fetchone()[0])
          PY
          elif [ "$remote_status" -eq 2 ]; then
            echo "NO_SIMPLE_HISTORY: first run starts a new paper-only ledger"
          else
            echo "HISTORY_REMOTE_CHECK_FAILED: status=$remote_status" >&2
            exit 1
          fi
      - name: Run fresh public Kraken scan
        run: python simple_scanner/scan.py
      - name: Record paper-only snapshot and validate SQLite
        run: python simple_scanner/history.py
      - name: Validate freshness and result shape
        run: |
          python - <<'PY'
          import datetime as dt,json
          r=json.load(open("simple_scanner/output/latest.json"))
          age=(dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(r["completed_at"])).total_seconds()
          assert 0<=age<180 and r["matched_tickers"]>=max(50,int(r["universe"]*.8)) and r["validated_watch"]>0
          assert r["buy_approved"] is False
          import json as _json
          h=_json.load(open("simple_scanner/output/learning.json"))
          assert h["snapshots"]>=r["validated_watch"] and h["buy_approved"] is False
          print("FRESH_SCAN_VERIFIED",r["ticker_pairs"],r["universe"],r["status"])
          PY
      - name: Publish durable history after successful scan
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/simplified-scanner-recovery-20261011')
        run: |
          set -euo pipefail
          cp simple_scanner/output/history.sqlite3 /tmp/simple-history.sqlite3
          cp simple_scanner/output/latest.json /tmp/simple-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/simple-history; then
            git checkout -B simple-history origin/simple-history
          else
            git checkout --orphan simple-history
            git rm -rf --ignore-unmatch . >/dev/null || true
          fi
          cp /tmp/simple-history.sqlite3 history.sqlite3
          cp /tmp/simple-latest.json latest.json
          git add history.sqlite3 latest.json
          git commit -m "Update paper-only scan history" || echo "No history changes"
          git push origin HEAD:refs/heads/simple-history
          git fetch origin refs/heads/simple-history:refs/remotes/origin/simple-history
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/simple-history)"
          echo "DURABLE_HISTORY_PUSH_CONFIRMED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-simple-result
          path: |
            simple_scanner/output/latest.json
            simple_scanner/output/learning.json
            simple_scanner/output/history.sqlite3
          if-no-files-found: warn
