name: Simplified Kraken Scan (isolated)
on:
  pull_request:
    paths:
      - 'simple_scanner/**'
      - '.github/workflows/kraken-simple.yml'
  workflow_dispatch:
  schedule:
    - cron: '3,33 * * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fresh public Kraken scan
        run: python simple_scanner/scan.py
      - name: Validate freshness and result shape
        run: |
          python - <<'PY'
          import datetime as dt,json
          r=json.load(open("simple_scanner/output/latest.json"))
          age=(dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(r["completed_at"])).total_seconds()
          assert 0<=age<180 and r["matched_tickers"]>=max(50,int(r["universe"]*.8)) and r["validated_watch"]>0
          assert r["buy_approved"] is False
          print("FRESH_SCAN_VERIFIED",r["ticker_pairs"],r["universe"],r["status"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-simple-result
          path: simple_scanner/output/latest.json
          if-no-files-found: warn
