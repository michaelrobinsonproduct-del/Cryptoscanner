name: Shadow Learning Evidence
on:
  pull_request:
    paths:
      - 'paper_pov/shadow_learning_evidence.py'
      - 'paper_pov/test_shadow_learning_evidence.py'
      - 'paper_pov/heldout_outcome_adapter.py'
      - 'paper_pov/test_heldout_outcome_adapter.py'
      - 'paper_pov/historical_execution_learning_bridge.py'
      - 'paper_pov/test_historical_execution_learning_bridge.py'
      - 'paper_pov/test_e1_b_historical_integration.py'
      - 'paper_pov/historical_e1_b_pipeline.py'
      - 'paper_pov/historical_preselection_binding.py'
      - 'paper_pov/a2_historical_artifact_learning.py'
      - '.github/workflows/shadow-learning-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest paper_pov.test_shadow_learning_evidence paper_pov.test_heldout_outcome_adapter paper_pov.test_historical_execution_learning_bridge -v

  historical-e1-b-integration:
    needs: real-a2-historical-universe
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: historical-outcome-execution-20261103
          path: upstream-e1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: integration-a-b-c-d-20261103
          path: upstream-b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download receipt-bound A2 full-universe evidence from verified run
        uses: actions/download-artifact@v4
        with:
          name: e-real-a2-historical-preselection
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-e-a2
      - name: Exercise E1 pinned trade CSV through E handoff and B's real consumer
        working-directory: workspace
        run: |
          set -euo pipefail
          echo "E_HEAD=$(git rev-parse HEAD)"
          echo "E1_SOURCE_SHA=$(git -C ../upstream-e1 rev-parse HEAD)"
          echo "B_SOURCE_SHA=$(git -C ../upstream-b rev-parse HEAD)"
          for name in historical_outcome_execution historical_outcome_bridge historical_learning_cohort_gate qualified_ohlc_outcomes kraken_trade_csv_adapter verified_trade_bars archive_partition_gate test_historical_outcome_execution; do
            cp "../upstream-e1/paper_pov/$name.py" "paper_pov/$name.py"
          done
          for name in github_delivery_projection preselection_universe candidate_snapshot; do
            cp "../upstream-b/paper_pov/$name.py" "paper_pov/$name.py"
          done
          python -m unittest paper_pov.test_historical_outcome_execution paper_pov.test_e1_b_historical_integration -v

      - name: Consume real A2 frozen identities through E1 input gate
        working-directory: workspace
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from paper_pov.historical_e1_b_pipeline import bind_a2_projection
          path = Path('../downloaded-e-a2/a2-historical-evidence.json')
          p = json.loads(path.read_text())
          b = bind_a2_projection(p, p['e1_watch_predictions'])
          assert b['preselection_observation_count'] == p['frozen_observation_count']
          assert b['unobserved_nonwatch_count'] == p['nonwatch_without_outcomes']
          assert not b['unbiased_learning_qualified']
          assert len(p['frozen_observations']) == b['preselection_observation_count']
          assert sum(x['selection_status'] == 'WATCH' for x in p['frozen_observations']) == b['watch_outcome_input_count']
          print('REAL_A2_INPUT_GATE', json.dumps({
              'receipt_sha256': b['a_receipt_sha256'],
              'frozen_observations': b['preselection_observation_count'],
              'watch_predictions': b['watch_outcome_input_count'],
              'unobserved_nonwatch': b['unobserved_nonwatch_count'],
              'qualified_trade_outcomes': 0,
              'source_authenticated': False}, sort_keys=True))
          PY

  real-a2-historical-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: integration-a-b-c-d-20261103
          path: upstream-b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble existing A receipt verification modules
        run: |
          cp upstream-b/paper_pov/preselection_universe.py paper_pov/preselection_universe.py
          cp upstream-b/paper_pov/candidate_snapshot.py paper_pov/candidate_snapshot.py
      - uses: actions/download-artifact@v4
        with:
          name: a2-live-consumer-evidence
          run-id: 41766615485
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-a2
      - name: Verify genuine sealed A2 receipt and export full historical universe
        run: |
          (cd downloaded-a2 && zip -q -r ../a2-historical-evidence.zip .)
          python -m paper_pov.a2_historical_artifact_learning --a2-artifact a2-historical-evidence.zip --output a2-historical-evidence.json
          python - <<'PY'
          import json
          r = json.load(open('a2-historical-evidence.json'))
          assert r['frozen_observation_count'] == r['watch_count'] + r['nonwatch_without_outcomes']
          assert r['status'] == 'NO_QUALIFIED_RULE'
          assert r['source_authenticated'] is False
          print('REAL_A2_RECEIPT', r['a_receipt_sha256'], 'OBSERVATIONS', r['frozen_observation_count'], 'WATCH', r['watch_count'])
          PY
      - name: Retain authenticated A receipt-bound E historical preselection for B/E1
        uses: actions/upload-artifact@v4
        with:
          name: e-real-a2-historical-preselection
          path: a2-historical-evidence.json
          if-no-files-found: error
          retention-days: 14
