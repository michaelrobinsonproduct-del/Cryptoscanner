name: Role V one-shot exact merged-main paper acceptance (read-only)
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/proof-role-v-merged-main-acceptance.yml
permissions:
  contents: read
concurrency:
  group: role-v-exact-merged-main-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  exact-main:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05730d0d3f39f1898770c29c58973b37900b2398
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact merged-main independent and scanner tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "05730d0d3f39f1898770c29c58973b37900b2398"
          python -m unittest discover -s paper_pov -p 'test_*.py' -v
          python -m unittest discover -s paper_eval -p 'test_*.py' -v
          python - <<'PY'
          from pathlib import Path
          scanner = Path('paper_pov/scanner.py').read_text()
          chain = Path('paper_eval/chain.py').read_text()
          assert 'def scan(' in scanner and 'def verify_chain(' in chain
          assert 'paper-proof-ledger' not in scanner
          print('ROLE_V_EXACT_MERGED_MAIN_STATIC_PAPER_ONLY_OK')
          PY
      - name: Independently verify latest remote ledger and bounded first-parent chain without writing
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=40 origin refs/heads/paper-proof-ledger
          LEDGER_COMMIT="$(git rev-parse FETCH_HEAD)"
          export LEDGER_COMMIT
          mkdir -p /tmp/role-v-main
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from paper_eval.chain import verify_chain
          from paper_pov import ledger
          tip = os.environ['LEDGER_COMMIT']
          commits = subprocess.check_output(
              ['git','rev-list','--first-parent','--max-count=17',tip],text=True).splitlines()
          entries = []
          for sha in commits:
              exists = subprocess.run(['git','cat-file','-e',f'{sha}:paper-ledger.json'],
                                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if exists.returncode:
                  break
              data = subprocess.check_output(['git','show',f'{sha}:paper-ledger.json'],text=True)
              entries.append({'commit':sha,'state':json.loads(data)})
          result = verify_chain(entries,tip)
          assert result['tip_generation'] >= 7
          assert result['production_applied'] is False
          assert result['transitions_checked'] >= 7
          state = entries[0]['state']
          assert len(state['predictions']) >= 84
          assert not any(x['status']=='MATURED_OBSERVED' for x in state['outcomes'])
          Path('/tmp/role-v-main/chain-report.json').write_bytes(ledger.canonical(result))
          print('ROLE_V_EXACT_MERGED_MAIN_CHAIN',json.dumps({
              'main_sha':'05730d0d3f39f1898770c29c58973b37900b2398',
              'tip_commit':tip,
              'generation':result['tip_generation'],
              'transitions_checked':result['transitions_checked'],
              'verified_to_genesis':result['verified_to_genesis'],
              'predictions':len(state['predictions']),
              'matured_labels':0,
              'production_applied':False
          },sort_keys=True))
          PY
          (cd /tmp/role-v-main && sha256sum chain-report.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: role-v-exact-main-${{ github.run_id }}
          path: |
            /tmp/role-v-main/chain-report.json
            /tmp/role-v-main/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
