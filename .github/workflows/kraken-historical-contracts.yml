name: Kraken Historical Fast Contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'historical/backfill.py'
      - 'historical/compact.py'
      - 'historical/test_backfill_contract.py'
      - 'historical/test_gap_equivalence.py'
      - 'historical/test_dedupe_equivalence.py'
      - 'historical/verify_manifest.py'
      - 'historical/test_compact_integration.py'
      - '.github/workflows/kraken-historical-contracts.yml'
jobs:
  fast-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile historical scripts
        run: python -m py_compile historical/backfill.py historical/compact.py historical/test_backfill_contract.py historical/test_gap_equivalence.py historical/test_dedupe_equivalence.py historical/verify_manifest.py historical/test_compact_integration.py
      - name: Verify historical labeling contracts
        run: python historical/test_backfill_contract.py
      - name: Verify optimized gap logic against original on 100 sequences
        run: |
          python historical/test_gap_equivalence.py
          python -O historical/test_gap_equivalence.py
      - name: Verify production deduplication against first-observation reference
        run: python historical/test_dedupe_equivalence.py
      - name: Exercise synthetic historical compaction and integrity checks
        run: python historical/test_compact_integration.py
