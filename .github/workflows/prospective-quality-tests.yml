name: Prospective Holdout Evaluation Tests
on:
  workflow_dispatch:
  push:
    branches: [production-source-recovery-20261010]
    paths:
      - 'evaluation/prospective-quality.ts'
      - 'evaluation/prospective-quality.test.ts'
      - 'evaluation/prospective-report.ts'
      - '.github/workflows/prospective-quality-tests.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test holdout evaluation and promotion gates
        run: bun test evaluation/prospective-quality.test.ts
      - name: Validate report runner on empty holdout
        run: |
          printf '[]\n' > /tmp/prospective-empty.json
          bun run evaluation/prospective-report.ts /tmp/prospective-empty.json /tmp/prospective-report.json
          grep -q '"promotion_eligible": false' /tmp/prospective-report.json
