name: Cryptoscanner Autonomous Repair and Completion
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
concurrency:
  group: cryptoscanner-autonomous-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resume isolated durable implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if gh api "repos/$REPO/git/ref/heads/cryptoscanner-autonomous-repair" --silent >/dev/null 2>&1; then
            git fetch origin cryptoscanner-autonomous-repair
            git checkout -B cryptoscanner-autonomous-repair FETCH_HEAD
          else
            git checkout -B cryptoscanner-autonomous-repair
          fi
          mkdir -p .autonomous
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install and authenticate autonomous coding agent
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "::error::Missing OPENAI_API_KEY; autonomous repair cannot operate"; exit 1; }
          npm install -g @openai/codex
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
          codex login status
      - name: Autonomous implement-diagnose-repair loop with checkpoints
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .autonomous
          cat > /tmp/repair-objective.txt <<'OBJECTIVE'
          You are the Cryptoscanner autonomous implementation and repair engineer.
          Read issue #34 and existing repository implementation before modifying code.
          Finish the existing scanner, not another wrapper. Inspect actual latest failed
          GitHub jobs and logs using gh CLI, and inspect actual exact-run artifacts.
          Diagnose and FIX functional failures in code and workflows, including:
          ledger MATURED_OBSERVED schema parity; sampled-outcome failures; learning
          watchdog failures; real authenticated 1/6/24/48h outcomes; chronological
          held-out shadow learning; same-run baseline and legacy-inspired ranked
          candidates; overlap stars; price, 15m move, volume acceleration, scores,
          risk and freshness; and real end-to-end ChatGPT result delivery.
          GitHub issue publication is NOT ChatGPT delivery; never claim equivalence.
          Keep existing single paper writer; never trade, force push, create second
          writer, fabricate source data or performance, or promote unverified scoring.
          Implement multiple substantive fixes per session, run focused tests for
          changed behavior, inspect failures, iterate. No cosmetic-only changes,
          no repetitive audit loops, no new architecture when existing code suffices.
          Keep .autonomous/progress.md with actual code changes, test output,
          unresolved defects and next concrete actions. Do not create COMPLETE until
          actual unattended scan, learning and ChatGPT delivery are evidenced.
          If an external integration cannot be verified, report it explicitly.
          OBJECTIVE
          deadline=$((SECONDS + 17100))
          iteration=0
          while (( SECONDS < deadline )); do
            iteration=$((iteration+1))
            echo "### Repair iteration $iteration" >> "$GITHUB_STEP_SUMMARY"
            remaining=$((deadline-SECONDS))
            (( remaining > 180 )) || break
            window=$((remaining > 2400 ? 2400 : remaining-90))
            timeout --signal=INT --kill-after=30s "${window}s" codex exec --sandbox workspace-write --skip-git-repo-check - < /tmp/repair-objective.txt
            agent_rc=$?
            git add -A
            if ! git diff --cached --quiet; then
              git diff --cached --check || exit 1
              git commit -m "repair: autonomous functional checkpoint $GITHUB_RUN_ID iteration $iteration" || exit 1
            fi
            gh auth setup-git
            git push origin HEAD:refs/heads/cryptoscanner-autonomous-repair || exit 1
            if [[ -f .autonomous/COMPLETE ]]; then
              echo "Agent marked COMPLETE; requires independently verified end-to-end evidence." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if (( agent_rc != 0 )); then
              echo "::error::Coding agent exit $agent_rc. Checkpoint preserved; no false completion."
              exit "$agent_rc"
            fi
            if ! git diff --quiet origin/main...HEAD; then
              gh pr list --head cryptoscanner-autonomous-repair --state open --json number --jq '.[0].number' | grep -q '[0-9]' ||
                gh pr create --base main --head cryptoscanner-autonomous-repair --title "Autonomous Cryptoscanner functional repair" --body "Checkpointed code repairs; require genuine end-to-end acceptance. No production trading."
            fi
            # Continue working on unfinished requirements, rather than stopping at a passing test.
          done
          if [[ ! -f .autonomous/COMPLETE ]]; then
            echo "UNFINISHED: checkpointed for next scheduled or manual continuation" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve progress and diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-repair-evidence-${{ github.run_id }}
          path: .autonomous/
          retention-days: 30
          if-no-files-found: warn
