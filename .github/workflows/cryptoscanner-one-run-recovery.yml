name: Cryptoscanner Autonomous Repair and Completion
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
concurrency:
  group: cryptoscanner-autonomous-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resume isolated durable implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if gh api "repos/$REPO/git/ref/heads/cryptoscanner-autonomous-repair" --silent >/dev/null 2>&1; then
            git fetch origin cryptoscanner-autonomous-repair
            git checkout -B cryptoscanner-autonomous-repair FETCH_HEAD
          else
            git checkout -B cryptoscanner-autonomous-repair
          fi
          mkdir -p .autonomous
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install and authenticate autonomous coding agent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$OPENAI_API_KEY" ]]; then
            npm install -g @openai/codex
            printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
            codex login status
          fi
          if [[ -n "$COPILOT_GITHUB_TOKEN" ]]; then
            npm install -g @github/copilot
            copilot --help >/dev/null
          fi
          [[ -n "$OPENAI_API_KEY" || -n "$COPILOT_GITHUB_TOKEN" ]] || {
            echo "::error::Neither coding-agent credential is configured"; exit 1;
          }
      - name: Autonomous implement-diagnose-repair loop with checkpoints
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .autonomous
          cat > /tmp/repair-objective.txt <<'OBJECTIVE'
          You are the Cryptoscanner autonomous implementation and repair engineer.
          Read issue #34 and existing repository implementation before modifying code.
          Finish the existing scanner, not another wrapper. Inspect actual latest failed
          GitHub jobs and logs using gh CLI, and inspect actual exact-run artifacts.
          Diagnose and FIX functional failures in code and workflows, including:
          ledger MATURED_OBSERVED schema parity; sampled-outcome failures; learning
          watchdog failures; real authenticated 1/6/24/48h outcomes; chronological
          held-out shadow learning; same-run baseline and legacy-inspired ranked
          candidates; overlap stars; price, 15m move, volume acceleration, scores,
          risk and freshness; and real end-to-end ChatGPT result delivery.
          GitHub issue publication is NOT ChatGPT delivery; never claim equivalence.
          Keep existing single paper writer; never trade, force push, create second
          writer, fabricate source data or performance, or promote unverified scoring.
          Implement multiple substantive fixes per session, run focused tests for
          changed behavior, inspect failures, iterate. No cosmetic-only changes,
          no repetitive audit loops, no new architecture when existing code suffices.
          Keep .autonomous/progress.md with actual code changes, test output,
          unresolved defects and next concrete actions. Do not create COMPLETE until
          actual unattended scan, learning and ChatGPT delivery are evidenced.
          If an external integration cannot be verified, report it explicitly.
          OBJECTIVE
          deadline=$((SECONDS + 18000))
          original_gh_token="$GH_TOKEN"
          last_error=0
          iteration=0
          while (( SECONDS < deadline )); do
            iteration=$((iteration+1))
            echo "### Repair iteration $iteration" >> "$GITHUB_STEP_SUMMARY"
            remaining=$((deadline-SECONDS))
            (( remaining > 180 )) || break
            window=$((remaining > 2400 ? 2400 : remaining-90))
            agent_log="/tmp/agent-iteration-$iteration.log"
            agent_rc=1
            if [[ -n "$OPENAI_API_KEY" ]]; then
              timeout --signal=INT --kill-after=30s "${window}s" codex exec --sandbox workspace-write --skip-git-repo-check - < /tmp/repair-objective.txt > >(tee "$agent_log") 2>&1
              agent_rc=$?
            fi
            if (( agent_rc != 0 )) && [[ -n "$COPILOT_GITHUB_TOKEN" ]]; then
              echo "Primary agent unavailable (exit $agent_rc); trying independent Copilot credential" >> "$GITHUB_STEP_SUMMARY"
              export GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN"
              export GH_TOKEN="$COPILOT_GITHUB_TOKEN"
              timeout --signal=INT --kill-after=30s "${window}s" copilot -p "$(cat /tmp/repair-objective.txt)" -s --allow-tool='shell(python:*)' --allow-tool='shell(git:*)' --allow-tool='shell(gh:*)' > >(tee -a "$agent_log") 2>&1
              agent_rc=$?
              unset GITHUB_TOKEN
              export GH_TOKEN="$original_gh_token"
            fi
            # Never commit credentials, generated archives, or unexpected binary files.
            git add -A
            git reset -q -- .env .env.local .env.production 2>/dev/null || true
            if git diff --cached --name-only | grep -E '(^|/)(\.env($|\.)|credentials\.json$|id_rsa$|\.pem$|\.key$)'; then
              echo "::error::Agent staged a credential file"; exit 1
            fi
            if ! git diff --cached --quiet; then
              git diff --cached --check || exit 1
              git commit -m "repair: autonomous functional checkpoint $GITHUB_RUN_ID iteration $iteration" || exit 1
            fi
            gh auth setup-git
            git push origin HEAD:refs/heads/cryptoscanner-autonomous-repair || exit 1
            if [[ -f .autonomous/COMPLETE ]]; then
              echo "Agent marked COMPLETE; independently verify required acceptance before treating as complete." >> "$GITHUB_STEP_SUMMARY"
              # A marker alone is never proof of successful delivery or learning.
              rm -f .autonomous/COMPLETE
            fi
            if (( agent_rc != 0 )); then
              echo "::warning::Agent exit $agent_rc; checkpoint preserved. Inspect failure before next retry." >> "$GITHUB_STEP_SUMMARY"
              last_error=$agent_rc
              if grep -Eiq "quota exceeded|insufficient_quota|billing details|rate limit" "$agent_log"; then
                echo "::error::All available agents exhausted or unavailable; stopping rather than burning 5 hours of GitHub minutes."
                break
              fi
              if (( iteration >= 3 )); then break; fi
            else
              last_error=0
            fi
            if ! git diff --quiet origin/main...HEAD; then
              gh pr list --head cryptoscanner-autonomous-repair --state open --json number --jq '.[0].number' | grep -q '[0-9]' ||
                gh pr create --base main --head cryptoscanner-autonomous-repair --title "Autonomous Cryptoscanner functional repair" --body "Checkpointed code repairs; require genuine end-to-end acceptance. No production trading."
            fi
            # Continue working on unfinished requirements, rather than stopping at a passing test.
          done
          echo "UNFINISHED: implementation checkpointed; do not claim completed integration or ChatGPT delivery" >> "$GITHUB_STEP_SUMMARY"
          if (( last_error != 0 )); then exit "$last_error"; fi
      - name: Preserve progress and diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-repair-evidence-${{ github.run_id }}
          path: .autonomous/
          retention-days: 30
          if-no-files-found: warn
