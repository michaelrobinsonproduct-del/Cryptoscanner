name: Autonomous Codex development loop
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: cryptoscanner-autonomous-development
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check credential and initialize persistent work branch
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          set -euo pipefail
          test "$CODEX_KEY_PRESENT" = true || { echo "::error::Missing OPENAI_API_KEY"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/autonomous-learning-work" --silent >/dev/null 2>&1; then
            git fetch origin autonomous-learning-work
            git checkout -B autonomous-learning-work FETCH_HEAD
          else
            git checkout -B autonomous-learning-work
          fi
          mkdir -p .autonomous
          if test -f .autonomous/COMPLETE; then
            echo "Project marked complete; no more coding required." >> "$GITHUB_STEP_SUMMARY"
            echo "complete=true" >> "$GITHUB_ENV"
          fi
      - name: Install coding agent
        if: env.complete != 'true'
        run: npm install --global @openai/codex
      - name: Implement next unfinished scanner and learning work
        if: env.complete != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          cat > /tmp/agent-task.txt <<'PROMPT'
          You are continuing a persistent autonomous Cryptoscanner implementation.
          Work directly in this checkout. Inspect .autonomous/progress.md and issue #34
          requirements. Do NOT redo already completed work. Spend this execution
          implementing the highest-impact unfinished work, not planning or rerunning
          redundant test suites. Focus on a working fresh Kraken paper scanner,
          historical source-authenticated features and 1/6/24/48h outcomes,
          chronological holdouts, measurable +30% hit/miss improvement, and real
          continuous learning from each subsequent scan. Use targeted tests for
          changed behavior and fix actual failures. Never invent data or lift.
          Maintain single-writer production ledger, no trading, no deployment, no
          secrets edits, no unvalidated promotion. Keep all changes reviewable.
          Before exit, update .autonomous/progress.md with concrete implementation,
          measured evidence, unfinished work and the NEXT specific implementation step.
          ONLY create .autonomous/COMPLETE when all requested functionality is
          genuinely implemented, tested as appropriate, integrated and supported
          by real evidence. Do not mark completion merely because blocked.
          PROMPT
          timeout --signal=INT --kill-after=30s 30m codex exec --full-auto --skip-git-repo-check - < /tmp/agent-task.txt
          result=$?
          echo "Codex exit code: $result" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Persist checkpoint and update development PR
        if: always() && env.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .autonomous
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "autonomous: implementation checkpoint run ${GITHUB_RUN_ID}"
          fi
          gh auth setup-git
          git push origin HEAD:refs/heads/autonomous-learning-work
          if ! gh pr list --head autonomous-learning-work --base main --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            if ! git diff --quiet origin/main...HEAD; then
              gh pr create --base main --head autonomous-learning-work --title "Autonomous scanner implementation and historical learning" --body "Persistent development checkpoints. Review real learning metrics and normal CI before merging; no automatic production promotion."
            fi
          fi
          echo "Checkpoint saved on autonomous-learning-work" >> "$GITHUB_STEP_SUMMARY"
          if test -f .autonomous/COMPLETE; then
            echo "Agent reports completion; review evidence and PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unfinished work: next scheduled run resumes this branch." >> "$GITHUB_STEP_SUMMARY"
          fi
