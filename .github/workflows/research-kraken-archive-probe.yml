name: Isolated Kraken Archive Probe (Research Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-kraken-archive-probe
  cancel-in-progress: false

jobs:
  bounded-archive-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout fixed research branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: research-learning-program-20261027
          persist-credentials: false
      - name: Run offline research tests
        run: python -m unittest discover -s research -p 'test_*.py' -v
      - name: Bounded 64 KiB archive range probe
        run: python research/probe_kraken_archive.py --part 0
