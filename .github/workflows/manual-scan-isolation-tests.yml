name: Manual scan isolation tests
on:
  push:
    branches:
      - manual-scan-isolation-20261015
  pull_request:
    branches:
      - simplified-scanner-recovery-20261011
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scanner modules
        run: python -m compileall -q simple_scanner
      - name: Run offline tests
        run: python -m unittest discover -s simple_scanner -p 'test_*.py' -v
