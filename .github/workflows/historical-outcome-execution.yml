name: Historical Outcome Execution (read only)
on:
  pull_request:
    paths:
      - 'paper_pov/historical_outcome_execution.py'
      - 'paper_pov/test_historical_outcome_execution.py'
      - 'paper_pov/qualified_ohlc_outcomes.py'
      - 'paper_pov/historical_learning_cohort_gate.py'
      - '.github/workflows/historical-outcome-execution.yml'
permissions:
  contents: read
jobs:
  outcome-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real-file read-only historical outcome integration tests
        run: python -m unittest paper_pov.test_historical_outcome_execution -v
