name: Project Pulse - one-run project briefing
on:
  workflow_dispatch:
    inputs:
      analysis_minutes:
        description: 'Maximum GitHub analysis budget (1-10 minutes)'
        required: false
        default: '3'
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  project-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate project briefing
        run: python3 .github/scripts/project_pulse.py --out project-pulse-output
      - name: Inspect live GitHub workflows and project backlog
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_MINUTES: ${{ inputs.analysis_minutes }}
        run: python3 .github/scripts/project_pulse_github.py
      - name: Show briefing in run summary
        if: always()
        run: |
          if [ -f project-pulse-output/pulse.md ]; then
            cat project-pulse-output/pulse.md >> "$GITHUB_STEP_SUMMARY"
            printf "\\n---\\n" >> "$GITHUB_STEP_SUMMARY"
            cat project-pulse-output/github-status.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reusable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-pulse-${{ github.run_id }}
          path: project-pulse-output/
          if-no-files-found: error
