name: Learning promotion safety validation
on:
  pull_request:
    paths:
      - 'simple_scanner/promotion_gate.py'
      - 'simple_scanner/learning_evidence.py'
      - 'simple_scanner/test_learning_evidence.py'
      - 'simple_scanner/test_promotion_gate.py'
      - 'simple_scanner/test_promotion_gate_edge_cases.py'
      - '.github/workflows/learning-promotion-isolated.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety and scanner regression tests
        run: |
          python -m compileall -q simple_scanner
          python -m unittest discover -s simple_scanner -p 'test_*.py' -v
