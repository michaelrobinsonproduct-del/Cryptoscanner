name: Unified read-only paper scan report
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read latest published writer and independent legacy artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/unified_paper_report.py
      - name: Publish authenticated report artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-paper-report-${{ github.run_id }}
          path: verified-report.json
          retention-days: 30
          if-no-files-found: error
      - name: Add source identity to run summary
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('verified-report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Unified paper report\n\n')
              f.write('Status: **'+r['status']+'**  \n')
              f.write('Writer: '+r['paper_run_url']+'  \n')
              f.write('Ledger generation: '+str(r['ledger_generation'])+'  \n')
              f.write('Independent legacy: '+str(r['legacy_independent'])+'  \n')
              f.write('Verified overlaps: '+', '.join(r['verified_independent_overlaps'])+'\n')
          PY
