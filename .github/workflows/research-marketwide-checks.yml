name: Research market-wide outcome evaluator checks
on:
  pull_request:
    paths:
      - 'research/marketwide_paper_outcomes.py'
      - 'research/test_marketwide_paper_outcomes.py'
      - '.github/workflows/research-marketwide-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marketwide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert immutable exact-head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "VERIFIED_RESEARCH_HEAD=$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact-head evaluator tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m unittest research.test_marketwide_paper_outcomes -v
          python -m compileall -q research/marketwide_paper_outcomes.py
      - name: Verify existing segmented PAPER ledger read-only and evaluate authentic observations
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=4096 origin refs/heads/paper-proof-ledger:refs/remotes/origin/paper-proof-ledger
          BASE="$(git rev-parse refs/remotes/origin/paper-proof-ledger)"
          if git cat-file -e "${BASE}:paper-segment-manifest.json" 2>/dev/null; then
            CHECKPOINT="$(git show "${BASE}:paper-segment-manifest.json" | python -c 'import json,sys;print(json.load(sys.stdin)["checkpoint"]["git_commit"])')"
            git cat-file -e "${CHECKPOINT}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$CHECKPOINT"
          fi
          python -m paper_pov.segmented_repository export-git --repository . --commit "$BASE" --output /tmp/verified-paper-ledger.json --full-replay
          python -m research.marketwide_paper_outcomes --verified-ledger /tmp/verified-paper-ledger.json --output /tmp/marketwide-outcomes.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/marketwide-outcomes.json'))
          for horizon, row in d['horizons'].items():
              print('MARKETWIDE_OUTCOME',horizon,json.dumps(row,sort_keys=True))
              assert row['eligible']==row['matured']+row['abstain_gap']+row['immature']
              assert row['eligible']==d['observed_entry_count']
              assert row['watch_eligible']==d['watched_prediction_count']
              assert row['watch_eligible']==row['watch_matured']+row['watch_abstain_gap']+row['watch_immature']
              assert row['abstain_conflicting_quote'] <= row['abstain_gap']
              assert row['watch_abstain_conflicting_quote'] <= row['watch_abstain_gap']
              assert row['watch_20']+row['watch_false_positive_20']==row['watch_matured']
              assert row['watch_30']+row['watch_false_positive_30']==row['watch_matured']
              assert row['movers_20']==row['watch_20']+row['missed_20']
              assert row['movers_30']==row['watch_30']+row['missed_30']
          assert d['source_authenticated'] is False
          assert d['complete_market_history'] is False
          assert d['eligible_for_model_promotion'] is False
          print('RESEARCH_EVIDENCE_FAIL_CLOSED',d['observed_run_count'],d['observed_pair_count'],d['observed_entry_count'],d['watched_prediction_count'])
          PY
      - name: Bind report to exact source and read-only ledger snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()
          def rev(ref):
              return subprocess.check_output(['git','rev-parse',ref],text=True).strip()
          report=json.loads(pathlib.Path('/tmp/marketwide-outcomes.json').read_text())
          assert report['source_authenticated'] is False
          assert report['complete_market_history'] is False
          assert report['eligible_for_model_promotion'] is False
          evidence={
              'schema':1,
              'research_source_commit':rev('HEAD'),
              'paper_ledger_branch_commit':rev('refs/remotes/origin/paper-proof-ledger'),
              'verified_ledger_export_sha256':sha256('/tmp/verified-paper-ledger.json'),
              'outcome_report_sha256':sha256('/tmp/marketwide-outcomes.json'),
              'observed_run_count':report['observed_run_count'],
              'observed_entry_count':report['observed_entry_count'],
              'source_authenticated':False,
              'complete_market_history':False,
              'eligible_for_model_promotion':False,
          }
          pathlib.Path('/tmp/marketwide-provenance.json').write_text(json.dumps(evidence,sort_keys=True,indent=2)+'\n')
          print('RESEARCH_PROVENANCE',json.dumps(evidence,sort_keys=True))
          PY
          (cd /tmp && sha256sum marketwide-outcomes.json marketwide-provenance.json > marketwide-SHA256SUMS && sha256sum -c marketwide-SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketwide-outcome-validation-${{ github.run_id }}
          path: |
            /tmp/marketwide-outcomes.json
            /tmp/marketwide-provenance.json
            /tmp/marketwide-SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
