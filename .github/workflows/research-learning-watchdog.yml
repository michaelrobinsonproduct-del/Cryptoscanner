name: Independent Kraken Learning Watchdog (current paper learning, read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-learning-watchdog.yml'
      - 'paper_pov/learning_health.py'
      - 'paper_pov/test_learning_health.py'
  pull_request:
    paths:
      - '.github/workflows/research-learning-watchdog.yml'
      - 'paper_pov/learning_health.py'
      - 'paper_pov/test_learning_health.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: independent-kraken-paper-learning-health
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact learning-health code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify independent read-only learning health contracts
        run: python -m unittest paper_pov.test_learning_health -v
      - name: Inspect actual current paper learning and verified artifacts
        run: python -m paper_pov.learning_health
