name: Isolated Kraken Reconstruction Tests (Manual, Research Only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-reconstruction-tests.yml'
permissions:
  contents: read
concurrency:
  group: isolated-kraken-reconstruction-tests
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e652ce70b8157f3a465e697fbb624670d978e38a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on exact research SHA and test presence
        run: |
          test "$(git rev-parse HEAD)" = "e652ce70b8157f3a465e697fbb624670d978e38a"
          test -f research/reconstruct_forward_outcomes.py
          test -f research/test_reconstruct_forward_outcomes.py
          test -f research/test_inventory_kraken_archive.py
          test -f research/test_audit_point_in_time_candidates.py
          test -z "$(git status --porcelain)"
      - name: Run all offline research fixtures
        run: |
          python -m compileall -q research
          python -m unittest discover -s research -p 'test_*.py' -v 2>&1 | tee /tmp/research-tests.log
          grep -q 'Ran 294 tests' /tmp/research-tests.log
          grep -q '^OK
 /tmp/research-tests.log
