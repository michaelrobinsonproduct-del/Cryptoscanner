name: Isolated Kraken Reconstruction Tests (Manual, Research Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-kraken-reconstruction-tests
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8aec95ce9a5468e1a4284d15211b94d4d6bc2e33
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on exact research SHA and test presence
        run: |
          test "$(git rev-parse HEAD)" = "8aec95ce9a5468e1a4284d15211b94d4d6bc2e33"
          test -f research/reconstruct_forward_outcomes.py
          test -f research/test_reconstruct_forward_outcomes.py
          test -f research/test_inventory_kraken_archive.py
          test -z "$(git status --porcelain)"
      - name: Run all offline research fixtures
        run: |
          python -m unittest discover -s research -p 'test_*.py' -v
