name: Kraken Q3 Historical +30% 48h Shadow (read only)
on:
  pull_request:
    paths:
      - 'historical/kraken_q3_48h_shadow.py'
      - 'historical/test_kraken_q3_48h_shadow.py'
      - 'historical/market_wide_sparse_research.py'
      - 'historical/test_market_wide_sparse_research.py'
      - '.github/workflows/historical-q3-48h-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-q3-shadow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-48h-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact-source leak, gap, eligibility and 48-hour embargo contracts
        run: python -m unittest historical.test_kraken_q3_48h_shadow historical.test_market_wide_sparse_research -v
      - name: Reuse completed identical historical research rather than redownload raw archive
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run=44227214122
          source_head=ceda9e65bf17edbdea7b973b1080659e3a6be154
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run" --jq '.status + ":" + (.conclusion // "") + ":" + .head_sha')" != "completed:success:$source_head" ]; then
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$source_head"
          if python - <<'PY'
          import ast,subprocess
          from pathlib import Path
          ref="ceda9e65bf17edbdea7b973b1080659e3a6be154"
          deps=("historical/kraken_q3_48h_shadow.py","historical/market_wide_sparse_research.py",
                "paper_pov/frozen_historical_shadow.py","paper_pov/heldout_outcome_adapter.py",
                "paper_pov/shadow_learning_evidence.py")
          for path in deps:
              assert Path(path).read_bytes()==subprocess.check_output(["git","show",ref+":"+path]),path
          path="paper_pov/market_wide_learning.py"
          required={"run_archive_market_cohorts","build_market_cohort","describe_observed_crossings","crossing_summary","train_archive_shadow"}
          def extract(source):
              functions={n.name:ast.dump(n,include_attributes=False) for n in ast.parse(source).body
                         if isinstance(n,ast.FunctionDef) and n.name in required}
              assert set(functions)==required
              return functions
          assert extract(Path(path).read_text())==extract(subprocess.check_output(["git","show",ref+":"+path]).decode())
          PY
          then
            mkdir -p historical/output
            gh run download "$source_run" -n "kraken-q3-frozen-48h-shadow-$source_run" -D historical/output
            (cd historical/output && sha256sum -c MARKET-WIDE-SHA256SUMS)
            python - <<'PY'
          import json
          from paper_pov.shadow_learning_evidence import canonical_digest
          d=json.load(open("historical/output/market-wide-sparse-research.json"))
          assert d["digest"]==canonical_digest({k:v for k,v in d.items() if k!="digest"})
          assert d["strict_training_unchanged"] is True and d["production_applied"] is False
          assert d["archive_sha256"]=="96daae63c7b3acb522892e1f602f9c564d1a3fb659089d9b0699282f30d41226"
          print("Q3_REUSED_EXACT_RESEARCH",d["comparison"]["comparable_timestamps"])
          PY
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download official Kraken Q3 incremental OHLCVT archive
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/kraken-archive historical/output
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 30 --max-time 2400 \
            'https://assets.kraken.com/marketing/institutions/Kraken_OHLCVT_2026Q3.zip' \
            -o /tmp/kraken-archive/q3.zip
          test "$(stat -c %s /tmp/kraken-archive/q3.zip)" -gt 1000000
          python - <<'PY'
          import zipfile
          path='/tmp/kraken-archive/q3.zip'
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              assert any(name.endswith('_5.csv') for name in names)
              print('OFFICIAL_KRAKEN_Q3_CSV_FILES',len(names))
          PY
          sha256sum /tmp/kraken-archive/q3.zip | tee historical/output/source-archive-SHA256SUMS
          # Freeze the exact official-download bytes observed on the first
          # successful archive replay; never silently train on changed source.
          echo '96daae63c7b3acb522892e1f602f9c564d1a3fb659089d9b0699282f30d41226  /tmp/kraken-archive/q3.zip' | sha256sum -c -
      - name: Frozen chronological 48h plus 1 6 24h labels, training and blind holdout
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          python -m historical.kraken_q3_48h_shadow \
            /tmp/kraken-archive/q3.zip \
            --output historical/output/q3-shadow-48h.json
          python - <<'PY'
          import json
          d=json.load(open('historical/output/q3-shadow-48h.json'))
          assert d['source_authenticated'] is False
          assert d['promotion_authorized'] is False
          assert d['production_applied'] is False
          assert d['rows_in_asof_universe'] > 0
          assert d['training']['train_complete'] > 0
          print('SHADOW_HISTORICAL_48H_REPLAY', d['training']['status'])
          print('TEST_SAME_UNIVERSE_RESULTS',json.dumps(d['evaluation']['test'],sort_keys=True))
          PY
      - name: Market-wide independent historical replay on same verified archive
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          python -m paper_pov.market_wide_learning /tmp/kraken-archive/q3.zip \
            --archive-sha256 96daae63c7b3acb522892e1f602f9c564d1a3fb659089d9b0699282f30d41226 \
            --archive-start 2026-07-01T00:00:00Z --archive-end 2026-10-01T00:00:00Z \
            --archive-cohort-output historical/output/market-wide-cohorts.jsonl.gz \
            --output historical/output/market-wide-summary.json
      - name: Fit market-wide shadow model and compare on purged blind holdout
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          python -m paper_pov.market_wide_learning historical/output/market-wide-cohorts.jsonl.gz \
            --train-cohorts --training-end 2026-09-07T00:00:00Z \
            --holdout-start 2026-09-09T00:00:00Z --evaluation-asof 2026-09-15T00:00:00Z \
            --output historical/output/market-wide-shadow.json
      - name: Compare observed-positive sensitivity on the same frozen archive holdout
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          python -m paper_pov.market_wide_learning historical/output/market-wide-cohorts.jsonl.gz \
            --train-cohorts --observed-positive-sensitivity --training-end 2026-09-07T00:00:00Z \
            --holdout-start 2026-09-09T00:00:00Z --evaluation-asof 2026-09-15T00:00:00Z \
            --output historical/output/market-wide-positive-sensitivity.json
      - name: Evaluate documented archive no-trade intervals separately from strict training
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          python -m historical.market_wide_sparse_research /tmp/kraken-archive/q3.zip \
            historical/output/market-wide-cohorts.jsonl.gz \
            --sha256 96daae63c7b3acb522892e1f602f9c564d1a3fb659089d9b0699282f30d41226 \
            --output historical/output/market-wide-sparse-research.json
      - name: Checksum reusable historical cohort and model outputs
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          cd historical/output
          sha256sum market-wide-cohorts.jsonl.gz market-wide-summary.json market-wide-shadow.json market-wide-positive-sensitivity.json > MARKET-WIDE-SHA256SUMS
      - name: Retain reusable read-only source and comparison evidence
        if: success() && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kraken-q3-frozen-48h-shadow-${{ github.run_id }}
          path: |
            historical/output/q3-shadow-48h.json
            historical/output/source-archive-SHA256SUMS
            historical/output/market-wide-summary.json
            historical/output/market-wide-cohorts.jsonl.gz
            historical/output/market-wide-shadow.json
            historical/output/market-wide-positive-sensitivity.json
            historical/output/MARKET-WIDE-SHA256SUMS
            historical/output/market-wide-sparse-research.json
          retention-days: 90
