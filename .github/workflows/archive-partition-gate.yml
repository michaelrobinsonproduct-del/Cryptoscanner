name: Kraken Archive Partition Gate (read only)
on:
  pull_request:
    paths:
      - 'paper_pov/archive_partition_gate.py'
      - 'paper_pov/test_archive_partition_gate.py'
      - 'paper_pov/verified_trade_bars.py'
      - 'paper_pov/test_verified_trade_bars.py'
      - 'paper_pov/kraken_trade_csv_adapter.py'
      - 'paper_pov/test_kraken_trade_csv_adapter.py'
      - 'paper_pov/historical_outcome_bridge.py'
      - 'paper_pov/test_historical_outcome_bridge.py'
      - '.github/workflows/archive-partition-gate.yml'
permissions:
  contents: read
jobs:
  partition-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned partition gate behavior
        run: python -m unittest paper_pov.test_archive_partition_gate paper_pov.test_verified_trade_bars paper_pov.test_kraken_trade_csv_adapter paper_pov.test_historical_outcome_bridge -v
