name: Kraken Archive Partition Gate (read only)
on:
  pull_request:
    paths:
      - 'paper_pov/archive_partition_gate.py'
      - 'paper_pov/test_archive_partition_gate.py'
      - '.github/workflows/archive-partition-gate.yml'
permissions:
  contents: read
jobs:
  partition-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned partition gate behavior
        run: python -m unittest paper_pov.test_archive_partition_gate -v
