name: Challenger Forward Outcomes
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  measure:
    if: github.ref == 'refs/heads/production-source-recovery-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-source-recovery-20261010
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Measure matured challenger outcomes
        env:
          CHALLENGER_SUPABASE_URL: ${{ secrets.CHALLENGER_SUPABASE_URL }}
          CHALLENGER_SUPABASE_SERVICE_KEY: ${{ secrets.CHALLENGER_SUPABASE_SERVICE_KEY }}
        run: bun run evaluation/measure-forward.ts
