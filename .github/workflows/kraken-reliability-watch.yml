name: Kraken Reliability Watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kraken-reliability-watch.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production scanner and durable scan acceptance
        env:
          RUNNER_URL: https://kraken-autonomous-runner-production.up.railway.app
        run: |
          python - <<'PY'
          import json, os, math, time, urllib.request, urllib.error
          base = os.environ["RUNNER_URL"].rstrip("/")
          def read(path):
              req = urllib.request.Request(base + path, headers={"Accept":"application/json","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req, timeout=18) as response:
                  return json.load(response)
          health = read("/health")
          print("health", json.dumps(health, default=str)[:1500])
          if health.get("last_error"):
              raise SystemExit("FAIL: scanner reported a run error")
          result = None
          for attempt in range(3):
              try:
                  result = read("/verified-results")
                  break
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")[:1000]
                  if exc.code == 503 and '"status":"RUNNING"' in body and attempt < 2:
                      print(f"NOTICE: active scan; retrying verified results ({attempt+1}/2)")
                      time.sleep(15)
                      continue
                  raise SystemExit(f"FAIL: verified-results HTTP {exc.code}: {body}")
          print("verification", json.dumps(result, default=str)[:2000])
          if result.get("status") != "VERIFIED_FRESH":
              raise SystemExit("FAIL: no verified fresh completed scan")
          if result.get("persistence_verified") is not True:
              raise SystemExit("FAIL: scan persistence unverified")
          if not result.get("run_id"):
              raise SystemExit("FAIL: missing durable run identifier")
          age = result.get("report_age_seconds")
          if isinstance(age, bool) or not isinstance(age, (int, float)) or not math.isfinite(age) or age < 0 or age > 900:
              raise SystemExit("FAIL: invalid or stale scan age")
          if not result.get("generated_at") or not result.get("checked_at"):
              raise SystemExit("FAIL: missing scan timestamps")
          # In-memory health may reset on restart; durable verified results are authoritative.
          health_run_id = health.get("last_run_id")
          if health_run_id and health_run_id != result["run_id"]:
              print("NOTICE: health run ID differs from durable verified run")
          elif not health_run_id:
              print("NOTICE: health run ID empty; durable verification passed")
          print("PASS: fresh completed scan, verified persistence, valid run identifier")
          PY

  shadow-schedule-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect missing shadow cycle and dispatch recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, urllib.request
          now = dt.datetime.now(dt.timezone.utc)
          base = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
          headers = {"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def api(path, data=None):
              request = urllib.request.Request(base+path, headers=headers, data=data, method="POST" if data is not None else "GET")
              with urllib.request.urlopen(request, timeout=20) as response:
                  body=response.read()
                  return json.loads(body) if body else None
          # Wait at least seven minutes after a nominal 15-minute boundary for GitHub schedule latency.
          minute = now.minute
          boundary = now.replace(minute=(minute//15)*15, second=0, microsecond=0)
          if (now-boundary).total_seconds() < 420:
              print("PENDING: grace period for scheduled trigger")
              raise SystemExit(0)
          runs = api("/actions/workflows/kraken-rebuild-shadow.yml/runs?per_page=20")["workflow_runs"]
          matching = []
          for run in runs:
              started = dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
              if started >= boundary:
                  matching.append(run)
          if matching:
              print("PRESENT: shadow workflow triggered for cycle", boundary.isoformat(), [(r["id"],r["status"],r.get("conclusion")) for r in matching])
              raise SystemExit(0)
          # Cross-check a second time to reduce race with a delayed scheduled trigger.
          runs = api("/actions/workflows/kraken-rebuild-shadow.yml/runs?per_page=20")["workflow_runs"]
          if any(dt.datetime.fromisoformat(r["created_at"].replace("Z","+00:00")) >= boundary for r in runs):
              print("PRESENT: shadow workflow appeared on recheck")
              raise SystemExit(0)
          print("MISSING: dispatching shadow recovery for",boundary.isoformat())
          api("/actions/workflows/kraken-rebuild-shadow.yml/dispatches", json.dumps({"ref":"main"}).encode())
          print("RECOVERY_DISPATCH_ACCEPTED: completion and acceptance still require independent verification")
          PY
