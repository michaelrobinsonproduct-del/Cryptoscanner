name: Kraken Reliability Watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kraken-reliability-watch.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: kraken-reliability-watch
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production scanner and durable scan acceptance
        env:
          RUNNER_URL: https://kraken-autonomous-runner-production.up.railway.app
        run: |
          python - <<'PY'
          import json, os, math, time, urllib.request, urllib.error
          base = os.environ["RUNNER_URL"].rstrip("/")
          def read(path):
              req = urllib.request.Request(base + path, headers={"Accept":"application/json","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req, timeout=18) as response:
                  return json.load(response)
          health = read("/health")
          print("health", json.dumps(health, default=str)[:1500])
          if health.get("last_error"):
              raise SystemExit("FAIL: scanner reported a run error")
          result = None
          for attempt in range(3):
              try:
                  result = read("/verified-results")
                  break
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")[:1000]
                  if exc.code == 503 and '"status":"RUNNING"' in body and attempt < 2:
                      print(f"NOTICE: active scan; retrying verified results ({attempt+1}/2)")
                      time.sleep(15)
                      continue
                  raise SystemExit(f"FAIL: verified-results HTTP {exc.code}: {body}")
          print("verification", json.dumps(result, default=str)[:2000])
          if result.get("status") != "VERIFIED_FRESH":
              raise SystemExit("FAIL: no verified fresh completed scan")
          if result.get("persistence_verified") is not True:
              raise SystemExit("FAIL: scan persistence unverified")
          if not result.get("run_id"):
              raise SystemExit("FAIL: missing durable run identifier")
          age = result.get("report_age_seconds")
          if isinstance(age, bool) or not isinstance(age, (int, float)) or not math.isfinite(age) or age < 0 or age > 900:
              raise SystemExit("FAIL: invalid or stale scan age")
          if not result.get("generated_at") or not result.get("checked_at"):
              raise SystemExit("FAIL: missing scan timestamps")
          # In-memory health may reset on restart; durable verified results are authoritative.
          health_run_id = health.get("last_run_id")
          if health_run_id and health_run_id != result["run_id"]:
              print("NOTICE: health run ID differs from durable verified run")
          elif not health_run_id:
              print("NOTICE: health run ID empty; durable verification passed")
          print("PASS: fresh completed scan, verified persistence, valid run identifier")
          PY

  shadow-schedule-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect missing shadow cycle and dispatch recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, urllib.request
          now = dt.datetime.now(dt.timezone.utc)
          base = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
          headers = {"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def api(path, data=None):
              request = urllib.request.Request(base+path, headers=headers, data=data, method="POST" if data is not None else "GET")
              with urllib.request.urlopen(request, timeout=20) as response:
                  body=response.read()
                  return json.loads(body) if body else None
          # Wait at least seven minutes after a nominal 15-minute boundary for GitHub schedule latency.
          # Audit marker: watchdog regression and recovery tests are triggered by this workflow-file push.
          minute = now.minute
          def eligible_boundary(timestamp):
              boundary = timestamp.replace(minute=(timestamp.minute//15)*15, second=0, microsecond=0)
              if (timestamp-boundary).total_seconds() < 420:
                  boundary -= dt.timedelta(minutes=15)
              return boundary
          # Verify quarter-hour offsets, grace edges, and hour rollover.
          for test_minute in range(60):
              for test_second in (0, 59):
                  sample_time=now.replace(minute=test_minute,second=test_second,microsecond=0)
                  selected=eligible_boundary(sample_time)
                  assert selected.minute % 15 == 0 and selected.second == 0
                  assert 420 <= (sample_time-selected).total_seconds() < 1320
          boundary = eligible_boundary(now)
          print("ELIGIBLE_CYCLE",boundary.isoformat())
          print("WATCHDOG_COMMIT",os.environ.get("GITHUB_SHA","unknown"))
          runs = api("/actions/workflows/kraken-rebuild-shadow.yml/runs?per_page=40")["workflow_runs"]
          def classify(items):
              # Recovery must not treat failed/cancelled runs as healthy.
              cycle = []
              for run in items:
                  created = dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
                  # Push-triggered development scans must not mask a missing scheduled cycle.
                  # A recovered dispatch is tied to its explicit cycle ID; dispatches
                  # without a cycle ID are not proof that the scheduler ran.
                  if run.get("event") == "schedule" and boundary <= created < boundary + dt.timedelta(minutes=15):
                      cycle.append(run)
                  elif run.get("event") == "workflow_dispatch":
                      # Match the requested cycle, not the dispatch creation window:
                      # delayed recovery may start in the following quarter-hour.
                      cycle_id=boundary.strftime("%Y-%m-%dT%H:%M:%SZ")
                      if run.get("display_title","") == f"Shadow workflow_dispatch {cycle_id}":
                          cycle.append(run)
              if any(r["status"] != "completed" or r.get("conclusion") == "success" for r in cycle):
                  return "PRESENT"
              if cycle:
                  return "FAILED"
              return "MISSING"
          # Deterministic regression checks: pushes must never satisfy a missing schedule.
          synthetic_time=boundary.isoformat().replace("+00:00","Z")
          def sample(event,status,conclusion):
              return {"event":event,"status":status,"conclusion":conclusion,"created_at":synthetic_time,"display_title":f"Shadow workflow_dispatch {boundary.strftime('%Y-%m-%dT%H:%M:%SZ')}" if event=="workflow_dispatch" else "Shadow schedule "}
          assert classify([sample("push","completed","success")])=="MISSING"
          assert classify([sample("schedule","completed","success")])=="PRESENT"
          assert classify([sample("schedule","completed","failure")])=="FAILED"
          assert classify([sample("workflow_dispatch","completed","success")])=="PRESENT"
          unrelated=sample("workflow_dispatch","completed","success")
          unrelated["display_title"]="Shadow workflow_dispatch 2020-01-01T00:00:00Z"
          assert classify([unrelated])=="MISSING"
          late_recovery=sample("workflow_dispatch","completed","success")
          late_recovery["created_at"]=(boundary+dt.timedelta(minutes=16)).isoformat().replace("+00:00","Z")
          assert classify([late_recovery])=="PRESENT"
          assert classify([unrelated,late_recovery])=="PRESENT"
          assert classify([sample("push","completed","success"),sample("schedule","completed","failure")])=="FAILED"
          assert classify([sample("schedule","in_progress",None)])=="PRESENT"
          assert classify([sample("schedule","completed","cancelled")])=="FAILED"
          assert classify([sample("workflow_dispatch","completed","failure")])=="FAILED"
          assert classify([sample("workflow_dispatch","in_progress",None)])=="PRESENT"
          assert classify([sample("push","completed","success"),sample("workflow_dispatch","completed","failure")])=="FAILED"
          # Exercise the recovery decision and exact dispatch payload without
          # creating a real GitHub run or interfering with the live schedule.
          def recovery_payload(items):
              if classify(items) == "PRESENT":
                  return None
              return {"ref":"main","inputs":{"cycle_id":boundary.strftime("%Y-%m-%dT%H:%M:%SZ")}}
          assert recovery_payload([sample("push","completed","success")]) == {"ref":"main","inputs":{"cycle_id":boundary.strftime("%Y-%m-%dT%H:%M:%SZ")}}
          assert recovery_payload([sample("schedule","completed","failure")]) is not None
          assert recovery_payload([unrelated]) is not None
          assert recovery_payload([late_recovery]) is None
          assert recovery_payload([sample("schedule","completed","success")]) is None
          assert recovery_payload([sample("schedule","completed","cancelled")]) is not None
          assert recovery_payload([sample("workflow_dispatch","completed","failure")]) is not None
          assert recovery_payload([sample("workflow_dispatch","in_progress",None)]) is None
          print("PASS: watchdog classification and simulated recovery dispatch payload")
          # Selected boundary is always beyond the seven-minute grace period.
          state = classify(runs)
          if state == "PRESENT":
              print("PRESENT: scheduled/recovered shadow cycle exists", boundary.isoformat())
              raise SystemExit(0)
          # Recheck for races and late arrivals before requesting a replacement.
          runs = api("/actions/workflows/kraken-rebuild-shadow.yml/runs?per_page=40")["workflow_runs"]
          state = classify(runs)
          if state == "PRESENT":
              print("PRESENT: cycle appeared on recheck")
              raise SystemExit(0)
          print(state + ": dispatching shadow recovery for",boundary.isoformat())
          api("/actions/workflows/kraken-rebuild-shadow.yml/dispatches", json.dumps({"ref":"main","inputs":{"cycle_id":boundary.strftime("%Y-%m-%dT%H:%M:%SZ")}}).encode())
          print("RECOVERY_DISPATCH_ACCEPTED: acceptance still requires independent verification")
          PY
