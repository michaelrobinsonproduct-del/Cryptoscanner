name: Consolidated Kraken Historical Learning (Manual Research Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: consolidated-kraken-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11adfb2d4355509d1ead698f1a981f322f3e5fbd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact SHA and all offline research tests
        run: |
          test "$(git rev-parse HEAD)" = "11adfb2d4355509d1ead698f1a981f322f3e5fbd"
          test -z "$(git status --porcelain)"
          python -m unittest discover -s research -p 'test_*.py' -v
      - name: Probe real independent Kraken public trade records
        run: |
          mkdir -p research/output
          python research/probe_independent_kraken_trades.py --output research/output/independent_trade_probe.json
      - name: Upload bounded source evidence without repeating verified 9GB archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-independent-trade-source-evidence
          path: research/output/independent_trade_probe.json
          if-no-files-found: error
          retention-days: 7
