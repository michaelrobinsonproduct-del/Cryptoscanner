name: Consolidated Kraken Historical Learning (Manual Research Only)
on:
  workflow_dispatch:
    inputs:
      full_source_download:
        description: 'Download ~10.3 GB of archives (only when new source evidence is required)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: consolidated-kraken-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cedd88cce046b6458a67fcefd36a12fc18be8768
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned code and all offline tests before downloading
        run: |
          test "$(git rev-parse HEAD)" = "cedd88cce046b6458a67fcefd36a12fc18be8768"
          test -z "$(git status --porcelain)"
          python -m compileall -q research
          python -m unittest discover -s research -p 'test_*.py' -v
      - name: One consolidated bounded real-source pipeline (explicit opt-in only)
        if: ${{ inputs.full_source_download == true }}
        run: |
          mkdir -p research/output
          python research/run_consolidated_historical_e2e.py --output research/output/consolidated_historical_report.json --pair 0GEUR
      - name: Upload one report only, never source archives
        if: ${{ success() && inputs.full_source_download == true }}
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-historical-e2e-evidence
          path: research/output/consolidated_historical_report.json
          if-no-files-found: error
          retention-days: 7
