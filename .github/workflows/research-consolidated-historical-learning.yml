name: Consolidated Kraken Historical Learning (Manual Research Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: consolidated-kraken-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 697d1bb99cef31b7c3b6fc783e430f633909059a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned code and all offline tests
        run: |
          test "$(git rev-parse HEAD)" = "697d1bb99cef31b7c3b6fc783e430f633909059a"
          test -z "$(git status --porcelain)"
          python -m unittest discover -s research -p 'test_*.py' -v
      - name: Download real 2026Q2 trade archive once and inspect ZIP safely
        run: |
          mkdir -p research/output
          python research/acquire_kraken_historical_trades.py --output research/output/full_trade_archive_evidence.json
      - name: Upload bounded source evidence, not archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-full-historical-trade-archive-evidence
          path: research/output/full_trade_archive_evidence.json
          if-no-files-found: error
          retention-days: 7
