name: Cryptoscanner quota-free source integration (12-minute)
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: cryptoscanner-quota-free-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate owner code without an AI API or production writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH=cryptoscanner-quota-free-integration
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --silent >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -B "$BRANCH"
          fi
          mkdir -p .integration
          # Do not dirty the worktree before merging source branches.
          STATUS_FILE="$RUNNER_TEMP/integration-status.txt"
          : > "$STATUS_FILE"
          # Only the coordination document may keep the integration branch's version.
          # Source-code conflicts remain fatal and visible.
          git config merge.keep-current.driver true
          printf 'docs/EXECUTION_QUEUE.md merge=keep-current\n' >> .git/info/attributes
          # Merge independently authored source branches into a review-only integration
          # branch. Never silently choose ours/theirs when owners conflict.
          for SOURCE in integration-a-b-c-d-20261103 runtime-readback-integrity-20261104 learning-e-cohort-accounting-20261104; do
            if ! git ls-remote --exit-code --heads origin "$SOURCE" >/dev/null; then
              echo "MISSING SOURCE: $SOURCE" | tee -a "$STATUS_FILE"
              continue
            fi
            git fetch origin "$SOURCE"
            # Coordination docs differ between owner branches; retain the main queue.
            # Never silently resolve conflicts in executable source.
            git -c merge.renormalize=false merge-base HEAD FETCH_HEAD >/dev/null || { echo "UNRELATED SOURCE: $SOURCE" | tee -a "$STATUS_FILE"; continue; }
            if git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "ALREADY INTEGRATED: $SOURCE" | tee -a "$STATUS_FILE"
              continue
            fi
            if git merge --no-ff --no-edit FETCH_HEAD; then
              echo "MERGED: $SOURCE $(git rev-parse FETCH_HEAD)" | tee -a "$STATUS_FILE"
            else
              git diff --name-only --diff-filter=U | tee .integration/conflicts.txt
              git merge --abort
              echo "CONFLICT BLOCKED: $SOURCE" | tee -a "$STATUS_FILE"
              exit 1
            fi
          done
          cp "$STATUS_FILE" .integration/status.txt
          git add .integration/status.txt
          if ! git diff --cached --quiet; then
            git commit -m "integration: record source merge checkpoint"
          fi
          gh auth setup-git
          git push origin HEAD:refs/heads/"$BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          cat .integration/status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Run the integrated Kraken scanner for real, paper-only
        run: |
          set -euo pipefail
          mkdir -p paper_pov/output
          PAPER_REPORT_PATH=paper_pov/output/latest.json python -m paper_pov.scanner
          test -s paper_pov/output/latest.json
          test -s paper_pov/output/candidate-snapshot.json
          test -s paper_pov/output/preselection-universe.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('paper_pov/output/latest.json').read_text())
          snap=json.loads(Path('paper_pov/output/candidate-snapshot.json').read_text())
          universe=json.loads(Path('paper_pov/output/preselection-universe.json').read_text())
          assert report['mode']=='PAPER_ONLY' and report['buy_approved'] is False
          assert snap['receipt_sha256']==universe['receipt_sha256']
          print('INTEGRATED_PAPER_SCAN',report['scan_status'],len(report['watch']),snap['receipt_sha256'])
          PY
      - name: Read actual published single-writer results through existing B delivery adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p paper_pov/output/published-readback
          # This is a read-only consumer of the authoritative main paper pipeline.
          # Do not substitute this isolated scan for a published ledger-backed run.
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow paper-pipeline.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "DELIVERY_ABSTAIN: no successful authoritative main paper run" | tee paper_pov/output/published-readback/status.txt
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "public-paper-results-$RUN_ID" --dir paper_pov/output/published-readback
          test -s paper_pov/output/published-readback/results.json
          (cd paper_pov/output/published-readback && sha256sum -c SHA256SUMS)
          python -m paper_pov.github_delivery_projection \
            --published-result paper_pov/output/published-readback/results.json \
            --expected-run-id "$RUN_ID" \
            --output paper_pov/output/published-readback/delivery.json
          test -s paper_pov/output/published-readback/delivery.json
          echo "READ_ONLY_DELIVERY_PROJECTED_FROM_MAIN_RUN=$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota-free-integrated-paper-${{ github.run_id }}
          path: |
            paper_pov/output/latest.json
            paper_pov/output/candidate-snapshot.json
            paper_pov/output/preselection-universe.json
            paper_pov/output/receipts/
            paper_pov/output/published-readback/
          if-no-files-found: warn
