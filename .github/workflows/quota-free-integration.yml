name: Cryptoscanner A-E completion integration gates
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: cryptoscanner-quota-free-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate owner code without an AI API or production writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH=cryptoscanner-quota-free-integration
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --silent >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -B "$BRANCH"
          fi
          # Rebase the persistent integration work onto the current main source\n          # so completion checks cannot silently use stale production contracts.\n          git fetch origin main\n          if ! git merge-base --is-ancestor origin/main HEAD; then\n            git merge --no-ff --no-edit origin/main || { echo 'MAIN_INTEGRATION_CONFLICT'; exit 1; }\n          fi\n          mkdir -p .integration\n          # Do not dirty the worktree before merging source branches.
          STATUS_FILE="$RUNNER_TEMP/integration-status.txt"
          : > "$STATUS_FILE"
          # Only the coordination document may keep the integration branch's version.
          # Source-code conflicts remain fatal and visible.
          git config merge.keep-current.driver true
          printf 'docs/EXECUTION_QUEUE.md merge=keep-current\n' >> .git/info/attributes
          # Merge independently authored source branches into a review-only integration
          # branch. Never silently choose ours/theirs when owners conflict.
          for SOURCE in integration-a-b-c-d-20261103 runtime-readback-integrity-20261104 learning-e-cohort-accounting-20261104; do
            if ! git ls-remote --exit-code --heads origin "$SOURCE" >/dev/null; then
              echo "MISSING SOURCE: $SOURCE" | tee -a "$STATUS_FILE"
              exit 1
            fi
            git fetch origin "$SOURCE"
            # Coordination docs differ between owner branches; retain the main queue.
            # Never silently resolve conflicts in executable source.
            git -c merge.renormalize=false merge-base HEAD FETCH_HEAD >/dev/null || { echo "UNRELATED SOURCE: $SOURCE" | tee -a "$STATUS_FILE"; exit 1; }
            if git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "ALREADY INTEGRATED: $SOURCE" | tee -a "$STATUS_FILE"
              continue
            fi
            if git merge --no-ff --no-edit FETCH_HEAD; then
              echo "MERGED: $SOURCE $(git rev-parse FETCH_HEAD)" | tee -a "$STATUS_FILE"
            else
              git diff --name-only --diff-filter=U | tee .integration/conflicts.txt
              git merge --abort
              echo "CONFLICT BLOCKED: $SOURCE" | tee -a "$STATUS_FILE"
              exit 1
            fi
          done
          cp "$STATUS_FILE" .integration/status.txt
          git add .integration/status.txt
          if ! git diff --cached --quiet; then
            git commit -m "integration: record source merge checkpoint"
          fi
          gh auth setup-git
          git push origin HEAD:refs/heads/"$BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          cat .integration/status.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all integrated Python sources before running tests
        run: |
          set -euo pipefail
          python -m compileall -q paper_pov
      - name: Execute the existing full paper and integration regression suite
        run: |
          set -euo pipefail
          python -m unittest discover -s paper_pov -p 'test_*.py' -v 2>&1 | tee /tmp/integration-tests.log
      - name: Verify the connected publisher, delivery, ledger, and learning contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          from pathlib import Path
          from paper_pov import results_report, github_delivery_projection
          required = ('paper_pov.results_report', 'paper_pov.github_delivery_projection',
                      'paper_pov.segmented_live_writer', 'paper_pov.candidate_snapshot')
          for name in required:
              importlib.import_module(name)
          publisher = Path('paper_pov/results_report.py').read_text()
          delivery = Path('paper_pov/github_delivery_projection.py').read_text()
          assert '"quote_evidence"' in publisher, 'publisher missing quote evidence schema'
          assert 'project_published_result' in delivery, 'published results not connected to B delivery'
          assert 'project_legacy_published_abstention' in delivery, 'legacy abstention safety missing'
          # Schema existence is only a prerequisite, never proof of end-to-end delivery.\n          print('INTEGRATION_CONTRACTS_PRESENT_NOT_END_TO_END_VERIFIED')
          PY
      - name: Report real integration outcome without creating another writer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .integration
          {
            echo "### A-E integration completion gates"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Integrated head: $(git rev-parse HEAD)"
            echo "Tests and contract gates must pass before review; this job does not deploy or write the paper ledger."
            echo "The authoritative main publisher is unchanged until an explicitly reviewed integration."
          } | tee .integration/completion-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep one review PR and issue 34 updated with the actual integration result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          BRANCH=cryptoscanner-quota-free-integration
          PR_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title 'A-E integrated scanner completion (review only)' --body 'Integration of existing owner code. CI compiles and runs full regression gates. Do not merge until verified published quote-complete delivery and historical learning are functional. No production writer changes.' 2>&1)" || {
              echo "PR_CREATION_UNAVAILABLE: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
              PR_URL=""
            }
          fi
          {
            echo "### A-E completion integration: $JOB_STATUS"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Integrated branch: $BRANCH"
            echo "Review PR: ${PR_URL:-UNAVAILABLE}"
            echo "Publisher/delivery/learning completion is NOT implied by a green job."
          } > /tmp/cryptoscanner-integration-comment.md
          gh issue comment 34 --repo "$GITHUB_REPOSITORY" --body-file /tmp/cryptoscanner-integration-comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cryptoscanner-completion-evidence-${{ github.run_id }}
          path: |
            .integration/status.txt
            .integration/completion-report.md
          if-no-files-found: warn
