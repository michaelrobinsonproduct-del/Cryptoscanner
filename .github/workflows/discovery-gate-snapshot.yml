name: Isolated Kraken Discovery Gate Snapshot
on:
  push:
    branches: [research-discovery-audit-20261014]
    paths:
      - 'research/capture_discovery_tickers.py'
      - 'research/discovery_gate_attribution.py'
      - 'research/shadow_momentum_lane.py'
      - 'research/shadow_ohlc_probe.py'
      - 'research/test_shadow_momentum_lane.py'
      - '.github/workflows/discovery-gate-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture read-only ticker gate diagnostics
        run: |
          python -m py_compile research/capture_discovery_tickers.py research/discovery_gate_attribution.py
          python -m research.capture_discovery_tickers --output discovery-ticker-snapshot.json
      - name: Validate shadow lane and compare snapshot eligibility
        run: |
          python -m py_compile research/shadow_momentum_lane.py research/test_shadow_momentum_lane.py
          python -m research.test_shadow_momentum_lane
          python -m research.shadow_momentum_lane discovery-ticker-snapshot.json --output discovery-shadow-lane.json
      - name: Probe at most 12 shadow OHLC pairs
        run: |
          python -m py_compile research/shadow_ohlc_probe.py
          python -m research.shadow_ohlc_probe discovery-ticker-snapshot.json --output discovery-shadow-ohlc.json
      - name: Upload isolated snapshot
        uses: actions/upload-artifact@v4
        with:
          name: discovery-gate-snapshot
          path: |
            discovery-ticker-snapshot.json
            discovery-shadow-lane.json
            discovery-shadow-ohlc.json
          retention-days: 3
