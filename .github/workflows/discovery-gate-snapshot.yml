name: Isolated Kraken Discovery Gate Snapshot
on:
  push:
    branches: [research-discovery-audit-20261014]
    paths:
      - 'research/capture_discovery_tickers.py'
      - 'research/discovery_gate_attribution.py'
      - '.github/workflows/discovery-gate-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture read-only ticker gate diagnostics
        run: |
          python -m py_compile research/capture_discovery_tickers.py research/discovery_gate_attribution.py
          python -m research.capture_discovery_tickers --output discovery-ticker-snapshot.json
      - name: Upload isolated snapshot
        uses: actions/upload-artifact@v4
        with:
          name: discovery-gate-snapshot
          path: discovery-ticker-snapshot.json
          retention-days: 3
