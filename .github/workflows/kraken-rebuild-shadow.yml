name: Kraken Rebuild Shadow Scan
# GitHub-only scan verification run — regression verification
on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'UTC 15-minute cycle being recovered (YYYY-MM-DDTHH:MM:SSZ)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'rebuild_v2/**'
      - '.github/workflows/kraken-rebuild-shadow.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: kraken-rebuild-shadow
  cancel-in-progress: false
jobs:
  shadow-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Establish scan cycle identity
        env:
          REQUESTED_CYCLE_ID: ${{ inputs.cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, os
          now=dt.datetime.now(dt.timezone.utc)
          supplied=os.environ.get("REQUESTED_CYCLE_ID","").strip()
          if supplied:
              parsed=dt.datetime.strptime(supplied,"%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.timezone.utc)
              if int(parsed.timestamp())%900 or parsed>now or (now-parsed).total_seconds()>3600:
                  raise ValueError("Recovery cycle must be aligned, not future, and at most 60 minutes old")
              cycle=supplied
          else:
              epoch=int(now.timestamp())
              boundary=epoch-(epoch%900)
              cycle=dt.datetime.fromtimestamp(boundary,dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(os.environ["GITHUB_ENV"],"a") as env:
              env.write(f"SCAN_CYCLE_ID={cycle}\n")
          print("SCAN_CYCLE_ID",cycle)
          PY
      - name: Restore persistent history from dedicated branch
        run: |
          mkdir -p rebuild_v2/output
          set -euo pipefail
          if git fetch origin refs/heads/rebuild-history:refs/remotes/origin/rebuild-history; then
            git show origin/rebuild-history:history.sqlite3 > rebuild_v2/output/history.sqlite3
            test -s rebuild_v2/output/history.sqlite3
          else
            echo "HISTORY_BRANCH_MISSING: refusing to initialize empty history" >&2
            exit 1
          fi
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          db=sqlite3.connect("rebuild_v2/output/history.sqlite3")
          result=db.execute("PRAGMA integrity_check").fetchone()[0]
          assert result=="ok",f"history database corrupt: {result}"
          counts={t:db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0] for t in ("runs","observations","outcomes")}
          Path("rebuild_v2/output/history_baseline.json").write_text(json.dumps(counts))
          print("RESTORED_HISTORY",counts)
          PY
      - name: Restore previous authoritative scan for deterioration checks
        shell: bash
        run: |
          if git show origin/rebuild-history:latest.json > rebuild_v2/output/previous.json 2>/dev/null; then
            if python -c 'import json; r=json.load(open("rebuild_v2/output/previous.json")); assert isinstance(r.get("watch"),list) and r.get("completed_at"); print("PREVIOUS_WATCH_RESTORED",len(r["watch"]))'; then
              echo "PREVIOUS_WATCH_VALID"
            else
              rm -f rebuild_v2/output/previous.json
              echo "PREVIOUS_WATCH_INVALID: ignoring malformed prior report; preserving historical database"
            fi
          else
            rm -f rebuild_v2/output/previous.json
            echo "NO_PREVIOUS_WATCH: all candidates remain unverified"
          fi
      - name: Restore validated historical research model
        shell: bash
        run: |
          if git show origin/rebuild-history:historical_model.json > rebuild_v2/output/historical_model.json 2>/dev/null; then
            python - <<'PY'
          import json
          model=json.load(open("rebuild_v2/output/historical_model.json"))
          assert model["schema_version"]==1 and model["holdout_rows"]>=100
          print("HISTORICAL_MODEL_LOADED",model["approved_rules"])
          PY
          else
            rm -f rebuild_v2/output/historical_model.json
            echo "HISTORICAL_MODEL_PENDING: scans continue but historical bonuses disabled"
          fi
      - name: Restore validated interaction model
        shell: bash
        run: |
          if git show origin/rebuild-history:interaction_model.json > rebuild_v2/output/interaction_model.json 2>/dev/null; then
            python -c 'import json; m=json.load(open("rebuild_v2/output/interaction_model.json")); assert m["schema_version"]==2; print("INTERACTION_MODEL_LOADED",len(m["approved_rules"]))'
          else
            rm -f rebuild_v2/output/interaction_model.json
            echo "INTERACTION_MODEL_PENDING: historical bonuses disabled"
          fi
      - name: Check schedule continuity
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt,json
          from pathlib import Path
          p=Path("rebuild_v2/output/history_baseline.json")
          baseline=json.loads(p.read_text())
          import sqlite3
          db=sqlite3.connect("rebuild_v2/output/history.sqlite3")
          latest=db.execute("SELECT MAX(created_at) FROM runs").fetchone()[0]
          age=(dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(latest)).total_seconds() if latest else None
          status={"previous_scan_age_seconds":round(age) if age is not None else None,"missed_15m_intervals":max(0,int(age//900)-1) if age is not None else None,"schedule_warning":age is None or age>2100}
          Path("rebuild_v2/output/schedule_health.json").write_text(json.dumps(status))
          print("SCHEDULE_HEALTH",json.dumps(status))
          PY
      - name: Unit tests
        run: python -m unittest discover -s rebuild_v2 -p 'test_*.py'
      - name: Run independent shadow scanner with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if python rebuild_v2/scanner.py; then
              exit 0
            fi
            echo "SCAN_ATTEMPT_FAILED attempt=$attempt" >&2
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 15
          done
      - name: Evaluate paper-only entry hypotheses
        run: python rebuild_v2/paper_entries.py
      - name: Validate paper-only boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("rebuild_v2/output/paper_entries.json").read_text())
          r=json.loads(Path("rebuild_v2/output/latest.json").read_text())
          assert p["mode"]=="PAPER_ONLY" and p["real_trade_approvals"]==0
          assert p["scan_completed_at"]==r["completed_at"]
          assert all(c["entry_approved"] is False and c["real_trade_approved"] is False for c in p["candidates"])
          print("PAPER_BOUNDARY_VERIFIED")
          PY
      - name: Audit historical dataset coverage
        run: python rebuild_v2/data_audit.py
      - name: Evaluate prospective paper-entry outcomes
        run: python rebuild_v2/paper_validation.py
      - name: Check paper validation report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("rebuild_v2/output/paper_validation.json").read_text())
          assert r["mode"]=="PAPER_ONLY" and r["validated"] is False
          assert r["status"]=="INSUFFICIENT_FORWARD_DATA"
          assert all(v["pair_days"]>=0 for v in r["metrics"].values())
          print("PROSPECTIVE_VALIDATION_GUARD_PASSED")
          PY
      - name: Validate persisted report before publication
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from rebuild_v2.scanner import NON_TARGET_BASES
          report = json.loads(Path("rebuild_v2/output/latest.json").read_text())
          assert report["engine"] == "rebuild-shadow-1.0", "outdated scanner engine"
          assert report["health"] == "COMPLETE", "incomplete scan"
          assert report["scanned"] == report["universe"] and report["failures"] == 0, "missing market coverage"
          assert report.get("persistence_health") == "COMPLETE", "persistence failed"
          research = report.get("historical_research") or {}
          assert research.get("interaction_model_loaded") is True, "validated interaction model not loaded"
          assert research.get("status") == "VALIDATED_INTERACTIONS", "historical interaction model invalid"
          assert isinstance(research.get("approved_rules"),list), "historical rules missing"
          continuity = report.get("continuity_research") or {}
          assert isinstance(continuity.get("compared"),int) and isinstance(continuity.get("downgraded"),int)
          assert 0 <= continuity["downgraded"] <= continuity["compared"] <= len(report["watch"])
          assert all(c.get("entry_approved") is False and c.get("requires_fresh_revalidation") is True for c in report["watch"])
          assert all(c.get("continuity_state") in ("NEW_OR_UNVERIFIED","MONITOR_ONLY","DOWNGRADED_PRICE_OR_LIQUIDITY") for c in report["watch"])
          prospective = research.get("prospective_trade_research") or {}
          assert prospective.get("mode") == "OBSERVE_ONLY", "trade research not shadow-only"
          assert prospective.get("model_loaded") is True, "historical simple model missing"
          assert prospective.get("score_adjustment_applied") == 0, "unapproved trade research changed scores"
          assert prospective.get("candidates_evaluated",0) + prospective.get("feature_failures",0) <= 12, "invalid research evaluation count"
          hist = report.get("history_diagnostics") or {}
          assert hist.get("history_available") is True, "history unavailable"
          assert hist.get("runs",0) >= 1 and hist.get("observations",0) >= len(report["watch"]), "missing history observations"
          assert isinstance(hist.get("outcomes"),int) and hist["outcomes"] >= 0, "outcome diagnostics missing"
          baseline = json.loads(Path("rebuild_v2/output/history_baseline.json").read_text())
          for field in ("runs","observations","outcomes"):
              assert hist[field] >= baseline[field], f"history regression: {field}"
          import os,sqlite3
          con=sqlite3.connect("rebuild_v2/output/history.sqlite3")
          cycle=os.environ["SCAN_CYCLE_ID"]
          recorded=con.execute("SELECT run_id FROM scan_cycles WHERE cycle_id=?",(cycle,)).fetchone()
          assert recorded is not None, f"cycle missing from durable ledger: {cycle}"
          duplicate=con.execute("SELECT COUNT(*) FROM scan_cycles WHERE cycle_id=?",(cycle,)).fetchone()[0]
          assert duplicate==1, "duplicate cycle ledger entries"
          assert hist["runs"] >= baseline["runs"] + (0 if recorded[0] != report.get("started_at") else 1), "new cycle history not recorded"
          age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(report["completed_at"])).total_seconds()
          assert 0 <= age < 900, "stale report"
          for candidate in report["watch"]:
              pair = candidate["pair"]
              assert not any(pair.startswith(base + "ZUSD") or pair == base + "USD" for base in NON_TARGET_BASES), f"non-target market: {pair}"
              assert candidate["move24_pct"] > 0, f"non-positive momentum: {pair}"
          print(f"ACCEPTED engine={report['engine']} scanned={report['scanned']} watches={len(report['watch'])} age_seconds={age:.0f}")
          PY
      - name: Write consolidated acceptance report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          p=Path("rebuild_v2/output/latest.json")
          status={"generated_at":dt.datetime.now(dt.timezone.utc).isoformat(),"source":"kraken-rebuild-shadow","acceptance":"FAILED","checks":{}}
          schedule=None
          if p.exists():
              try:
                  r=json.loads(p.read_text())
                  h=r.get("history_diagnostics") or {}
                  baseline_path=Path("rebuild_v2/output/history_baseline.json")
                  baseline=json.loads(baseline_path.read_text()) if baseline_path.exists() else None
                  schedule_path=Path("rebuild_v2/output/schedule_health.json")
                  schedule=json.loads(schedule_path.read_text()) if schedule_path.exists() else None
                  import os,sqlite3
                  con=sqlite3.connect("rebuild_v2/output/history.sqlite3")
                  cycle_row=con.execute("SELECT run_id FROM scan_cycles WHERE cycle_id=?",(os.environ["SCAN_CYCLE_ID"],)).fetchone()
                  cycle_valid=cycle_row is not None and con.execute("SELECT COUNT(*) FROM runs WHERE id=?",(cycle_row[0],)).fetchone()[0]==1
                  checks={
                      "engine_v1":r.get("engine")=="rebuild-shadow-1.0",
                      "market_scan_complete":r.get("health")=="COMPLETE" and r.get("scanned")==r.get("universe") and r.get("failures")==0,
                      "history_persisted":r.get("persistence_health")=="COMPLETE" and h.get("history_available") is True and h.get("runs",0)>0,
                      "current_observations_saved":h.get("observations",0)>=len(r.get("watch",[])),
                      "outcome_diagnostics_present":isinstance(h.get("outcomes"),int),
                      "historical_research_status_present":isinstance(r.get("historical_research"),dict),
                      "historical_interaction_model_loaded":r.get("historical_research",{}).get("interaction_model_loaded") is True and r.get("historical_research",{}).get("status")=="VALIDATED_INTERACTIONS",
                      "non_actionable_shadow":r.get("recommendation")=="NO VERIFIED BUYS",
                      "history_continuity":baseline is not None and all(h.get(k,0)>=baseline[k] for k in ("runs","observations","outcomes")),
                      "cycle_persisted_or_retry":baseline is not None and cycle_valid and h.get("runs",0)>=baseline["runs"],
                  }
                  status.update(checks=checks,engine=r.get("engine"),completed_at=r.get("completed_at"),history=h,history_baseline=baseline,schedule_health=schedule)
                  status["acceptance"]="PASSED" if all(checks.values()) else "FAILED"
              except Exception as e:
                  status["error"]=str(e)
          else:
              status["error"]="latest.json missing"
          if schedule:
              status["reliability"]={"last_gap_seconds":schedule.get("previous_scan_age_seconds"),"missed_15m_intervals":schedule.get("missed_15m_intervals"),"schedule_warning":schedule.get("schedule_warning"),"rolling_24h":r.get("reliability_scorecard",{}).get("24h"),"rolling_7d":r.get("reliability_scorecard",{}).get("168h")}
          status["delivery"]={"shadow_notifications":"NOT_CONFIGURED","production_push_email":"NOT_VERIFIED_BY_THIS_WORKFLOW"}
          Path("rebuild_v2/output/acceptance.json").write_text(json.dumps(status,indent=2)+"\n")
          print(json.dumps(status))
          PY
      - name: Save history and report to dedicated branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          status=json.loads(Path("rebuild_v2/output/acceptance.json").read_text())
          assert status["acceptance"]=="PASSED","acceptance report did not pass"
          db=sqlite3.connect("rebuild_v2/output/history.sqlite3")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok","history integrity failure before publish"
          PY
          cp rebuild_v2/output/history.sqlite3 /tmp/kraken-history.sqlite3
          cp rebuild_v2/output/latest.json /tmp/kraken-latest.json
          cp rebuild_v2/output/acceptance.json /tmp/kraken-acceptance.json
          cp rebuild_v2/output/schedule_health.json /tmp/kraken-schedule-health.json
          cp rebuild_v2/output/paper_validation.json /tmp/kraken-paper-validation.json
          cp rebuild_v2/output/data_audit.json /tmp/kraken-data-audit.json
          cp rebuild_v2/output/paper_entries.json /tmp/kraken-paper-entries.json
          if git show-ref --verify --quiet refs/remotes/origin/rebuild-history; then
            git checkout -B rebuild-history origin/rebuild-history
          else
            git checkout --orphan rebuild-history
            git rm -rf --ignore-unmatch . >/dev/null || true
          fi
          cp /tmp/kraken-history.sqlite3 history.sqlite3
          cp /tmp/kraken-latest.json latest.json
          # Publish a conservative, machine-readable delivery summary.
          # Research watches must never be presented as approved trades.
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/kraken-latest.json").read_text())
          watches=report.get("watch",[])
          assert isinstance(watches,list)
          assert all(w.get("entry_approved") is False for w in watches)
          summary={
              "completed_at":report["completed_at"],
              "health":report["health"],
              "scanned":report["scanned"],
              "universe":report["universe"],
              "recommendation":report["recommendation"],
              "approved_buys":[],
              "research_only":True,
              "watch_count":len(watches),
              "top_research_watches":[{"pair":w["pair"],"score":w.get("score"),"move24_pct":w.get("move24_pct"),"signal_state":w.get("signal_state")} for w in watches[:5]],
              "delivery_status":"PUBLISHED_TO_GITHUB_ONLY"
          }
          assert summary["recommendation"]=="NO VERIFIED BUYS"
          Path("summary.json").write_text(json.dumps(summary,indent=2)+"\\n")
          PY
          cp /tmp/kraken-acceptance.json acceptance.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          for filename in ("latest.json","acceptance.json"):
              p=Path(filename)
              data=json.loads(p.read_text())
              data["scan_cycle_id"]=os.environ["SCAN_CYCLE_ID"]
              data["github_run_id"]=os.environ["GITHUB_RUN_ID"]
              p.write_text(json.dumps(data,indent=2)+"\n")
          PY
          cp /tmp/kraken-schedule-health.json schedule_health.json
          cp /tmp/kraken-paper-validation.json paper_validation.json
          cp /tmp/kraken-data-audit.json data_audit.json
          cp /tmp/kraken-paper-entries.json paper_entries.json
          git add summary.json history.sqlite3 latest.json acceptance.json schedule_health.json paper_validation.json data_audit.json paper_entries.json
          git -c user.name='kraken-rebuild-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Shadow scan history ${GITHUB_RUN_ID}" || true
          git push origin HEAD:refs/heads/rebuild-history
          # Verify the exact consumer-facing paths after the remote branch updates.
          git fetch origin +refs/heads/rebuild-history:refs/remotes/origin/rebuild-history
          python - <<'PY'
          import json,subprocess,os
          def remote(name):
              return json.loads(subprocess.check_output(["git","show","origin/rebuild-history:"+name],text=True))
          latest=remote("latest.json")
          summary=remote("summary.json")
          assert summary["research_only"] is True and summary["approved_buys"]==[], "summary incorrectly actionable"
          assert summary["completed_at"]==latest["completed_at"], "summary stale or mismatched"
          assert summary["scanned"]==latest["scanned"] and summary["universe"]==latest["universe"], "summary coverage mismatch"
          assert summary["watch_count"]==len(latest["watch"]), "summary watch count mismatch"
          assert summary["delivery_status"]=="PUBLISHED_TO_GITHUB_ONLY", "summary overstates delivery"
          acceptance=remote("acceptance.json")
          assert acceptance["acceptance"]=="PASSED", "remote acceptance not passed"
          assert latest["completed_at"]==acceptance["completed_at"], "remote result/acceptance mismatch"
          assert latest["scan_cycle_id"]==acceptance["scan_cycle_id"]==os.environ["SCAN_CYCLE_ID"], "remote cycle mismatch"
          assert latest["github_run_id"]==acceptance["github_run_id"]==os.environ["GITHUB_RUN_ID"], "remote run mismatch"
          assert all(acceptance.get("checks",{}).values()) and acceptance.get("checks"), "remote acceptance checks incomplete"
          db_bytes=subprocess.check_output(["git","show","origin/rebuild-history:history.sqlite3"])
          import sqlite3,tempfile
          with tempfile.NamedTemporaryFile(suffix=".sqlite3") as temp:
              temp.write(db_bytes)
              temp.flush()
              with sqlite3.connect(temp.name) as db:
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok", "remote SQLite corrupt"
                  cycle=db.execute("SELECT run_id FROM scan_cycles WHERE cycle_id=?",(os.environ["SCAN_CYCLE_ID"],)).fetchone()
                  assert cycle is not None, "remote cycle ledger missing"
                  assert db.execute("SELECT COUNT(*) FROM runs WHERE id=?",(cycle[0],)).fetchone()[0]==1, "remote ledger run missing"
                  assert db.execute("SELECT COUNT(*) FROM runs").fetchone()[0]==acceptance["history"]["runs"], "remote historical run count mismatch"
          print("REMOTE_SQLITE_CYCLE_LEDGER_VERIFIED",os.environ["SCAN_CYCLE_ID"])
          assert latest["health"]=="COMPLETE" and latest["failures"]==0, "remote result incomplete"
          assert latest["historical_research"]["prospective_trade_research"]["score_adjustment_applied"]==0
          print("REMOTE_RESULT_RETRIEVAL_VERIFIED",json.dumps({"run_id":os.environ["GITHUB_RUN_ID"],"completed_at":latest["completed_at"],"scanned":latest["scanned"],"watch_count":len(latest["watch"]),"acceptance":acceptance["acceptance"]}))
          PY
      - name: Verify authoritative persisted scan independently
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,datetime as dt
          from pathlib import Path
          latest=json.loads(Path("rebuild_v2/output/latest.json").read_text())
          acceptance=json.loads(Path("rebuild_v2/output/acceptance.json").read_text())
          completed=dt.datetime.fromisoformat(latest["completed_at"].replace("Z","+00:00"))
          age=(dt.datetime.now(dt.timezone.utc)-completed).total_seconds()
          assert 0<=age<900,"scan report stale"
          assert latest["health"]=="COMPLETE" and latest["failures"]==0
          assert latest["scanned"]==latest["universe"]
          assert acceptance["acceptance"]=="PASSED" and all(acceptance["checks"].values())
          assert acceptance["completed_at"]==latest["completed_at"]
          print(json.dumps({"verified":True,"source":"independent-github-persistence","scanned":latest["scanned"],"universe":latest["universe"],"age_seconds":round(age),"actionable":False}))
          PY
      - name: Retain independent recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-shadow-${{ github.run_id }}
          path: |
            rebuild_v2/output/latest.json
            rebuild_v2/output/paper_entries.json
            rebuild_v2/output/paper_validation.json
            rebuild_v2/output/data_audit.json
            rebuild_v2/output/acceptance.json
            rebuild_v2/output/schedule_health.json
            rebuild_v2/output/history.sqlite3
          if-no-files-found: warn
          retention-days: 30

# Manual fresh shadow scan triggered via GitHub push 2026-10-10T11:34-04:00
