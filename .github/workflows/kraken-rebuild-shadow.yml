name: Kraken Rebuild Shadow Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: kraken-rebuild-shadow
  cancel-in-progress: false
jobs:
  shadow-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s rebuild_v2 -p 'test_*.py'
      - name: Validate durable storage credentials\n        env:\n          SUPABASE_URL: ${{ secrets.KRAKEN_REBUILD_SUPABASE_URL }}\n          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KRAKEN_REBUILD_SUPABASE_SERVICE_ROLE_KEY }}\n        run: |\n          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing durable storage configuration"; exit 1; }\n      - name: Run independent shadow scanner
        env:
          SUPABASE_URL: ${{ secrets.KRAKEN_REBUILD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KRAKEN_REBUILD_SUPABASE_SERVICE_ROLE_KEY }}
        run: python rebuild_v2/scanner.py
      - name: Retain scan report and local history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-shadow-${{ github.run_id }}
          path: |
            rebuild_v2/output/latest.json
            rebuild_v2/output/history.sqlite3
          if-no-files-found: warn
          retention-days: 30
