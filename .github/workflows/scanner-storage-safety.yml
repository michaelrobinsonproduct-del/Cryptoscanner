name: Scanner Storage Safety CI
on:
  push:
    branches:
      - repair-batches-17a-20-20261021
    paths:
      - 'simple_scanner/storage_safety.py'
      - 'simple_scanner/dex.py'
      - 'simple_scanner/scan.py'
      - 'tests/test_kraken_freshness.py'
      - 'tests/test_shadow_learning_guards.py'
      - 'simple_scanner/offline_replay.py'
      - 'tests/test_offline_replay.py'
      - 'simple_scanner/offline_scoring_comparison.py'
      - 'tests/test_offline_scoring_comparison.py'
      - 'tests/test_execution_contract.py'
      - 'tests/test_execution_acceptance_fixtures.py'
      - 'tests/test_rollback_rehearsal.py'
      - 'tests/test_batch22_delivery_recovery.py'
      - 'simple_scanner/manual_requests.py'
      - 'docs/batch21_release_readiness.md'
      - 'simple_scanner/execute_once.py'
      - 'simple_scanner/dex_guard.py'
      - 'tests/test_dex_reliability.py'
      - 'simple_scanner/external_backup.py'
      - 'tests/test_storage_safety.py'
      - 'tests/test_storage_inventory_edge_cases.py'
      - 'tests/test_storage_inventory_edge_cases.py'
      - 'tests/test_external_backup.py'
      - '.github/workflows/scanner-storage-safety.yml'
  pull_request:
    paths:
      - 'simple_scanner/storage_safety.py'
      - 'simple_scanner/external_backup.py'
      - 'tests/test_storage_safety.py'
      - 'tests/test_external_backup.py'
      - '.github/workflows/scanner-storage-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backup modules
        run: python -m py_compile simple_scanner/storage_safety.py simple_scanner/external_backup.py
      - name: Run backup and restore regression tests
        run: python -W error -m unittest discover -s tests -p 'test_*backup.py' -v
      - name: Run storage safety regression tests
        run: python -W error -m unittest discover -s tests -p 'test_storage_safety.py' -v

      - name: Run SQLite inventory edge cases
        run: python -W error -m unittest discover -s tests -p 'test_storage_inventory_edge_cases.py' -v

      - name: Run DEX freshness and circuit tests
        run: python -W error -m unittest discover -s tests -p 'test_dex_reliability.py' -v

      - name: Run Kraken freshness regression tests
        run: python -W error -m unittest discover -s tests -p 'test_kraken_freshness.py' -v

      - name: Run shadow learning guard tests
        run: python -W error -m unittest discover -s tests -p 'test_shadow_learning_guards.py' -v

      - name: Run offline replay feasibility and holdout tests
        run: python -W error -m unittest discover -s tests -p 'test_offline_replay.py' -v

      - name: Run independent offline scoring comparison tests
        run: python -W error -m unittest discover -s tests -p 'test_offline_scoring_comparison.py' -v

      - name: Run shared execution contract tests
        run: python -W error -m unittest discover -s tests -p 'test_execution_contract.py' -v

      - name: Run fixture end-to-end execution acceptance tests
        run: python -W error -m unittest discover -s tests -p 'test_execution_acceptance_fixtures.py' -v

      - name: Run isolated rollback rehearsal tests
        run: python -W error -m unittest discover -s tests -p 'test_rollback_rehearsal.py' -v

      - name: Run offline manual delivery and recovery acceptance
        run: python -W error -m unittest discover -s tests -p 'test_batch22_delivery_recovery.py' -v
