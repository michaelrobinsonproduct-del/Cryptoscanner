name: Legacy OHLC paired replay (read only)
on:
  pull_request:
    paths:
      - 'paper_pov/legacy_shadow.py'
      - 'paper_pov/legacy_ohlc_replay.py'
      - '.github/workflows/legacy-ohlc-paired-replay.yml'
permissions:
  contents: read
jobs:
  paired-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: git fetch --no-tags --depth=1 origin b271b90a2cae9e5307600070ce7d0e510fe68996
      - run: python -m unittest paper_pov.test_legacy_shadow -v
      - run: python -m paper_pov.legacy_ohlc_replay
