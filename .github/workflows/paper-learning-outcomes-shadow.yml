name: Independent PAPER sampled-outcome research (read only)
on:
  pull_request:
    paths:
      - 'paper_pov/learning_outcomes.py'
      - 'paper_pov/test_learning_outcomes.py'
      - '.github/workflows/paper-learning-outcomes-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-learning-shadow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sampled-outcome-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source and all offline tests
        run: |
          set -euo pipefail
          echo "LEARNING_EXACT_SOURCE_SHA=$(git rev-parse HEAD)"
          python -m unittest discover -s paper_pov -p 'test_*.py' -v
      - name: Fetch and verify immutable public PAPER ledger without writing
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=4096 origin refs/heads/paper-proof-ledger:refs/remotes/origin/paper-proof-ledger
          BASE="$(git rev-parse refs/remotes/origin/paper-proof-ledger)"
          echo "LEARNING_REMOTE_LEDGER_COMMIT=$BASE"
          CHECKPOINT="$(git show "${BASE}:paper-segment-manifest.json" | python -c 'import json,sys;print(json.load(sys.stdin)["checkpoint"]["git_commit"])')"
          git cat-file -e "${CHECKPOINT}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$CHECKPOINT"
          python -m paper_pov.segmented_repository export-git \
            --repository . --commit "$BASE" --output /tmp/paper-learning-ledger.json --full-replay
          mkdir -p paper_pov/learning-evidence
          python -m paper_pov.learning_outcomes \
            --ledger /tmp/paper-learning-ledger.json > paper_pov/learning-evidence/evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path("paper_pov/learning-evidence/evaluation.json").read_bytes())
          assert evidence["mode"]=="READ_ONLY_OFFLINE_LEARNING"
          assert evidence["source_generation"]>=20
          assert evidence["held_out_lift"] is None
          assert evidence["production_applied"] is False
          assert evidence["coverage"]["scope"]=="SAMPLED_CLIENT_OBSERVED_QUOTES_NOT_EXCHANGE_COMPLETE"
          print("PAPER_LEARNING_READ_ONLY_VERIFIED",
                evidence["source_generation"], evidence["source_ledger_sha256"],
                json.dumps(evidence["coverage"]["by_horizon"],sort_keys=True))
          PY
          (cd paper_pov/learning-evidence && sha256sum evaluation.json > SHA256SUMS)
          test "$(git rev-parse refs/remotes/origin/paper-proof-ledger)" = "$BASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-learning-shadow-${{ github.run_id }}
          path: |
            paper_pov/learning-evidence/evaluation.json
            paper_pov/learning-evidence/SHA256SUMS
          retention-days: 90
          if-no-files-found: warn
