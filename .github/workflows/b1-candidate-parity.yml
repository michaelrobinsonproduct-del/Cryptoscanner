name: B1 isolated candidate parity acceptance
on:
  pull_request:
    paths:
      - 'scanner/src/candidate-contract.ts'
      - 'scanner/src/candidate-contract.test.ts'
      - 'scanner/src/candidate-cycle.ts'
      - 'scanner/src/candidate-cycle.test.ts'
      - 'scanner/src/shadow-artifacts.ts'
      - 'scanner/src/shadow-artifacts.test.ts'
      - 'scanner/src/shadow-evaluation.ts'
      - 'scanner/src/shadow-evaluation.test.ts'
      - 'scanner/src/cycle-http.ts'
      - 'scanner/src/cycle-http.test.ts'
      - 'scanner/src/paper-receipt.ts'
      - 'scanner/src/paper-receipt.test.ts'
      - 'scanner/src/cycle-coverage.test.ts'
      - 'scanner/src/cycle-runner.ts'
      - 'scanner/src/cycle-runner.test.ts'
      - 'scanner/src/server.ts'
      - '.github/workflows/b1-candidate-parity.yml'
      - 'paper_pov/github_sealed_bundle_readback.py'
      - 'paper_pov/test_github_sealed_bundle_readback.py'
      - 'paper_pov/github_delivery_projection.py'
      - 'paper_pov/test_github_delivery_projection.py'
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Focused B1 candidate and native-entry parity regression
        run: bun test scanner/src/shadow-evaluation.test.ts scanner/src/shadow-artifacts.test.ts scanner/src/cycle-runner.test.ts scanner/src/cycle-http.test.ts scanner/src/paper-receipt.test.ts
      - name: Read-only GitHub artifact transport and checksum acceptance
        run: python -m unittest paper_pov.test_github_sealed_bundle_readback paper_pov.test_github_delivery_projection -v
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

  downloaded-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select genuine successful main paper run and downloadable results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b-delivery
          gh api "repos/$REPO/actions/workflows/paper-pipeline.yml/runs?branch=main&status=success&per_page=20" > /tmp/b-delivery/runs.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          runs=json.loads(Path("/tmp/b-delivery/runs.json").read_text()).get("workflow_runs",[])
          for run in runs:
              if run.get("event") not in ("schedule","workflow_dispatch") or run.get("conclusion")!="success":
                  continue
              raw=subprocess.check_output(["gh","api",f"repos/{os.environ['REPO']}/actions/runs/{run['id']}/artifacts"],timeout=30)
              artifacts=json.loads(raw).get("artifacts",[])
              matches=[a for a in artifacts if a.get("name")==f"public-paper-results-{run['id']}" and not a.get("expired")]
              if len(matches)!=1:
                  continue
              Path("/tmp/b-delivery/identity.json").write_text(json.dumps({"run_id":str(run["id"]),"source_sha":run["head_sha"],"event":run["event"],"artifact_id":matches[0]["id"]}))
              print("SELECTED_AUTHENTIC_MAIN_RESULT",run["id"],run["event"],run["head_sha"])
              break
          else:
              raise SystemExit("NO_SUCCESSFUL_MAIN_RESULTS_ARTIFACT: visible delivery failure")
          PY
          ARTIFACT="$(python -c 'import json;print(json.load(open("/tmp/b-delivery/identity.json"))["artifact_id"])')"
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$ARTIFACT/zip" > /tmp/b-delivery/published.zip
      - name: Download existing D recovered-ledger evidence independently
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows/runtime-readback-integrity.yml/runs?status=success&per_page=20" > /tmp/b-delivery/d-runs.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          runs=json.loads(Path("/tmp/b-delivery/d-runs.json").read_text()).get("workflow_runs",[])
          for run in runs:
              if run.get("conclusion")!="success" or run.get("head_branch")!="runtime-readback-integrity-20261104":
                  continue
              raw=subprocess.check_output(["gh","api",f"repos/{os.environ['REPO']}/actions/runs/{run['id']}/artifacts"],timeout=30)
              matches=[a for a in json.loads(raw).get("artifacts",[]) if a.get("name")=="d2-real-writer-recovery-report"
                  and a.get("expired") is False and a.get("workflow_run",{}).get("id")==run["id"]]
              if len(matches)==1 and str(matches[0].get("digest","")).startswith("sha256:"):
                  Path("/tmp/b-delivery/d-meta.json").write_text(json.dumps(matches[0]))
                  print("SELECTED_D_RECOVERY",run["id"],matches[0]["id"])
                  break
          else:
              raise SystemExit("NO_VERIFIED_D_RECOVERY_ARTIFACT")
          PY
          D_ARTIFACT="$(python -c 'import json;print(json.load(open("/tmp/b-delivery/d-meta.json"))["id"])')"
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$D_ARTIFACT/zip" > /tmp/b-delivery/d-recovery.zip
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path("/tmp/b-delivery/d-meta.json").read_text())
          if hashlib.sha256(Path("/tmp/b-delivery/d-recovery.zip").read_bytes()).hexdigest()!=m["digest"].removeprefix("sha256:"):
              raise SystemExit("D_RECOVERY_ZIP_SHA_MISMATCH")
          PY
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          with zipfile.ZipFile("/tmp/b-delivery/d-recovery.zip") as z:
              names=z.namelist()
              if names!=["recovery.json"]:
                  raise SystemExit("D_RECOVERY_ARCHIVE_LAYOUT_MISMATCH")
              raw=z.read("recovery.json")
              if len(raw)>100000:
                  raise SystemExit("D_RECOVERY_REPORT_OVERSIZED")
              if raw.endswith(bytes((92,110))):
                  raw=raw[:-2]+bytes((10,))
              obj=json.loads(raw)
              if obj.get("remote_downloaded") is not True or obj.get("production_applied") is not False:
                  raise SystemExit("D_RECOVERY_REPORT_NOT_READ_ONLY")
              Path("/tmp/b-delivery/writer.json").write_text(json.dumps(obj))
          PY
      - name: Authenticate independent A2 snapshot and build separate read-only cohort
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/13281329000" > /tmp/b-delivery/a2-meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("/tmp/b-delivery/a2-meta.json").read_text())
          if (m.get("id")!=13281329000 or m.get("expired") is not False
              or m.get("workflow_run",{}).get("id")!=41743237429
              or m.get("workflow_run",{}).get("head_sha")!="9af09e21d9f0c132e7630ed60b508ef2286c0fb0"
              or m.get("digest")!="sha256:f331501461593cc1600d6043cb304a243e396145d29c9d322d3a159b512fb68e"):
              raise SystemExit("A2_AUTHENTICATED_METADATA_MISMATCH")
          PY
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/13281329000/zip" > /tmp/b-delivery/a2.zip
          echo 'f331501461593cc1600d6043cb304a243e396145d29c9d322d3a159b512fb68e  /tmp/b-delivery/a2.zip' | sha256sum --check --status
          python - <<'PY'
          import hashlib,io,json,zipfile
          from pathlib import Path
          with zipfile.ZipFile("/tmp/b-delivery/a2.zip") as outer:
              transports=[n for n in outer.namelist() if n.endswith("transport.zip")]
              exports=[n for n in outer.namelist() if n.endswith("verified-snapshot.json")]
              if len(transports)!=1 or len(exports)!=1:
                  raise SystemExit("A2_TRANSPORT_LAYOUT_MISMATCH")
              with zipfile.ZipFile(io.BytesIO(outer.read(transports[0]))) as inner:
                  names=inner.namelist()
                  receipts=[n for n in names if n.startswith("receipts/") and n.endswith(".json")]
                  if len(names)!=3 or len(receipts)!=1 or "latest.json" not in names or "verified-snapshot.json" not in names:
                      raise SystemExit("A2_RECEIPT_LAYOUT_MISMATCH")
                  receipt=inner.read(receipts[0])
                  if receipt!=inner.read("latest.json"):
                      raise SystemExit("A2_RECEIPT_MISMATCH")
                  verified=json.loads(inner.read("verified-snapshot.json"))
                  exported=json.loads(outer.read(exports[0]))
                  if verified.get("receipt_sha256")!=hashlib.sha256(receipt).hexdigest():
                      raise SystemExit("A2_RECEIPT_HASH_MISMATCH")
                  for key in ("as_of","scan_status","eligible_pairs","observed_markets","abstention_counts","watch","receipt_sha256"):
                      if verified.get(key)!=exported.get(key):
                          raise SystemExit("A2_EXPORT_MISMATCH_"+key)
                  delivery={"schema":"a2_published_watch_delivery_v1",
                      "source":"kraken_public_rest_client_observed",
                      "single_writer_ledger_verified":False,"exchange_event_freshness_verified":False,
                      "production_applied":False,"buy_approved":False,
                      "client_quote_freshness_verified":True,
                      "receipt_sha256":verified["receipt_sha256"],"as_of":verified["as_of"],
                      "scan_status":verified["scan_status"],"watch":verified["watch"],
                      "watch_count":len(verified["watch"]),
                      "eligible_pairs":verified["eligible_pairs"],
                      "observed_markets":verified["observed_markets"]}
                  Path("/tmp/b-delivery/a2-delivery.json").write_text(json.dumps(delivery))
          PY
      - name: Discover existing E read-only learning handoff without inventing evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts?per_page=100" > /tmp/b-delivery/e-artifacts.json
          python - <<'PY'
          import json,os,subprocess,zipfile,io
          from pathlib import Path
          from paper_pov.github_delivery_projection import _learning_evidence
          artifacts=json.loads(Path("/tmp/b-delivery/e-artifacts.json").read_text()).get("artifacts",[])
          # Only E's explicitly named handoff artifact can qualify; no synthetic labels.
          eligible=[a for a in artifacts if a.get("name")=="e-historical-learning-handoff"
                    and a.get("expired") is False]
          status={"status":"LEARNING_HANDOFF_UNAVAILABLE","reason":"NO_PUBLISHED_E_HANDOFF"}
          for a in eligible:
              try:
                  raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",
                      f"repos/{os.environ['REPO']}/actions/artifacts/{a['id']}/zip"],timeout=45)
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      if z.namelist()!=["learning-handoff.json"]:
                          raise ValueError("E handoff archive layout")
                      data=z.read("learning-handoff.json")
                      if len(data)>500000:
                          raise ValueError("E handoff oversized")
                  handoff=json.loads(data)
                  _learning_evidence(handoff)
                  Path("/tmp/b-delivery/e-handoff.json").write_text(json.dumps(handoff))
                  status={"status":"E_READ_ONLY_HANDOFF_CONSUMED","artifact_id":a["id"],
                          "workflow_run_id":a.get("workflow_run",{}).get("id")}
                  break
              except (ValueError,KeyError,zipfile.BadZipFile,subprocess.CalledProcessError) as exc:
                  status={"status":"LEARNING_HANDOFF_UNAVAILABLE","reason":type(exc).__name__}
          Path("/tmp/b-delivery/e-status.json").write_text(json.dumps(status))
          print("E_HANDOFF_DISCOVERY",status)
          PY
      - name: Consume actual downloaded manual or scheduled result through B shared adapter
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          from paper_pov.manual_schedule_contract import load_verified_artifact
          identity=json.loads(Path("/tmp/b-delivery/identity.json").read_text())
          published=load_verified_artifact(Path("/tmp/b-delivery/published.zip"))
          if str(published.get("run_id"))!=identity["run_id"] or published.get("source_sha")!=identity["source_sha"] or published.get("github_event")!=identity["event"]:
              raise SystemExit("GITHUB_METADATA_RESULT_IDENTITY_MISMATCH")
          writer=json.loads(Path("/tmp/b-delivery/writer.json").read_text())
          from paper_pov.github_delivery_projection import _writer_evidence
          writer_projection=_writer_evidence(writer)
          a2=json.loads(Path("/tmp/b-delivery/a2-delivery.json").read_text())
          from paper_pov.github_delivery_projection import _a2_evidence, _learning_evidence
          a2_projection=_a2_evidence(a2)
          e_path=Path("/tmp/b-delivery/e-handoff.json")
          learning_projection=_learning_evidence(json.loads(e_path.read_text())) if e_path.exists() else None
          if "quote_evidence" not in published:
              Path("/tmp/b-delivery/delivery.json").write_text(json.dumps({
                  "schema":"paper_delivery_abstention_v1","status":"ABSTAIN_PUBLISHED_QUOTE_EVIDENCE_MISSING",
                  "source_run_id":identity["run_id"],"source_sha":identity["source_sha"],
                  "github_event":identity["event"],"live_watch":[],"live_watch_authorized":False,
                  "production_applied":False,"single_writer_read_only":True,
                  "writer_recovery":writer_projection,
                  "a2_receipt_cohort":a2_projection,"learning":learning_projection,
                  "writer_reconciliation_status":writer_projection["reconciliation_status"]},sort_keys=True)+"\n")
              print("PUBLISHED_LEGACY_QUOTE_EVIDENCE_ABSTENTION",identity["run_id"])
          else:
              cmd=[sys.executable,"-m","paper_pov.github_delivery_projection",
                  "--published-artifact","/tmp/b-delivery/published.zip",
                  "--writer-readback","/tmp/b-delivery/writer.json",
                  "--a2-delivery","/tmp/b-delivery/a2-delivery.json",
                  "--expected-run-id",identity["run_id"],"--expected-source-sha",identity["source_sha"],
                  "--output","/tmp/b-delivery/delivery.json"]
              if e_path.exists():
                  cmd.extend(["--learning-handoff",str(e_path)])
              subprocess.run(cmd,check=True)
              projected=json.loads(Path("/tmp/b-delivery/delivery.json").read_text())
              assert projected["live_watch_authorized"] is False and projected["single_writer_read_only"] is True
              print("AUTHENTIC_DOWNLOADED_DELIVERY",projected["source_run_id"],projected["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b-authenticated-downloaded-delivery
          path: |
            /tmp/b-delivery/identity.json
            /tmp/b-delivery/writer.json
            /tmp/b-delivery/a2-delivery.json
            /tmp/b-delivery/e-status.json
            /tmp/b-delivery/delivery.json
          if-no-files-found: error
          retention-days: 7
