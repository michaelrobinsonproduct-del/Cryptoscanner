name: Kraken AI Engineering Agent (PR only)
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  engineer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Copilot credential for personal repository
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::Set repository Actions secret COPILOT_GITHUB_TOKEN with a fine-grained PAT authorized for Copilot Requests. GitHub Models retired July 2026."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: simplified-scanner-recovery-20261011
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baseline regression suite
        run: |
          python -m compileall -q simple_scanner
          python -m unittest discover -s simple_scanner -p 'test_*.py' -v
      - name: Install GitHub Copilot coding agent
        run: npm install -g @github/copilot
      - name: Diagnose, implement, and test bounded repair
        run: |
          copilot -p 'You are the engineering agent for this Kraken early-breakout research scanner. Inspect simple_scanner/ and its tests and the scheduled workflow in .github/workflows/. Identify ONE demonstrable correctness/reliability defect that materially affects full-universe discovery, freshness, persistence, or unbiased evaluation. Modify code and add a regression test. Run python -m unittest discover -s simple_scanner -p "test_*.py" -v and python -m compileall -q simple_scanner. Never alter production deployment, secrets, trading approvals, or historical data. Do not fabricate live data. If no justified improvement exists, make no change. End with a short description and test result.' -s --allow-tool='shell(python:*)' --allow-tool='shell(git:*)'
      - name: Final deterministic acceptance
        run: |
          python -m compileall -q simple_scanner
          python -m unittest discover -s simple_scanner -p 'test_*.py' -v
          git diff --check
          if git diff --name-only | grep -Ev '^(simple_scanner/|\.github/workflows/kraken-recovery-schedule\.yml)' ; then
            echo "::error::Agent edited out-of-scope paths"; exit 1
          fi
      - name: Create isolated review PR only when code changed
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "NO_CHANGE"; exit 0; fi
          branch="agent/kraken-repair-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add simple_scanner
          git diff --cached --check
          git commit -m "Agent: verified scanner repair"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base simplified-scanner-recovery-20261011 --head "$branch" --title "Agent: verified scanner repair ${GITHUB_RUN_ID}" --body "Automated coding-agent repair. Offline regression suite and compilation passed. Review before merging. No production deployment or buy approval."
