name: Role B one-shot paper storage capacity acceptance (read-only)
on:
  pull_request:
    paths:
      - 'paper_eval/capacity.py'
      - 'paper_pov/ledger.py'
      - 'paper_pov/segmented_storage.py'
      - 'paper_pov/segmented_repository.py'
      - 'paper_pov/git_ledger_fetch.py'
      - 'paper_eval/test_capacity.py'
      - '.github/workflows/paper-capacity-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-capacity-readonly
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact-source tests without writes
        run: |
          set -euo pipefail
          echo "PAPER_CAPACITY_SOURCE_SHA=$(git rev-parse HEAD)"
          python -m unittest discover -s paper_eval -p 'test_*.py' -v
          python -m unittest discover -s paper_pov -p 'test_*.py' -v
      - name: Independently size genuine public Git ledger
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=4096 origin refs/heads/paper-proof-ledger:refs/remotes/origin/paper-proof-ledger
          LEDGER_COMMIT="$(git rev-parse refs/remotes/origin/paper-proof-ledger)"
          echo "$LEDGER_COMMIT" > /tmp/paper-capacity-base.sha
          CHECKPOINT="$(git show "${LEDGER_COMMIT}:paper-segment-manifest.json" | python -c 'import json,sys;print(json.load(sys.stdin)["checkpoint"]["git_commit"])')"
          git cat-file -e "${CHECKPOINT}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$CHECKPOINT"
          python -m paper_pov.segmented_repository export-git \
            --repository . --commit "$LEDGER_COMMIT" \
            --output /tmp/paper-capacity-ledger.json --full-replay
          mkdir -p paper_eval/output
          python -m paper_eval.capacity \
            --ledger /tmp/paper-capacity-ledger.json \
            --ledger-commit "$LEDGER_COMMIT" \
            --output paper_eval/output/storage-capacity.json
          (cd paper_eval/output && sha256sum storage-capacity.json > STORAGE-SHA256SUMS)
          echo "PAPER_CAPACITY_LEDGER_COMMIT=$LEDGER_COMMIT"
      - name: Stage a real current scan from the authenticated base without pushing
        run: |
          set -euo pipefail
          python -m paper_pov.scanner
          python -m paper_pov.segmented_live_writer stage \
            --repository . --base "$(cat /tmp/paper-capacity-base.sha)" \
            --report paper_pov/output/latest.json --source-sha "$(git rev-parse HEAD)" \
            --staged /tmp/paper-capacity-staged --next-ledger /tmp/paper-capacity-next.json \
            --scoreboard /tmp/paper-capacity-score.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from paper_pov import ledger, segmented_storage as storage, segmented_repository as repo
          from paper_pov.retention_acceptance import verify_transition
          before=json.loads(Path("/tmp/paper-capacity-ledger.json").read_text())
          after=json.loads(Path("/tmp/paper-capacity-next.json").read_text())
          report=json.loads(Path("paper_pov/output/latest.json").read_text())
          source=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          proof=verify_transition(before,after,report,source)
          staged,manifest=repo.read_state("/tmp/paper-capacity-staged",full_replay=False)
          assert staged==after and manifest["head"]["ledger_sha256"]==after["sha256"]
          assert before["generation"]+1==after["generation"]
          assert len(ledger.canonical(after))<=storage.MAX_RAW_BYTES
          assert repo.active_storage_bytes("/tmp/paper-capacity-staged")<=repo.MAX_ACTIVE_TREE_BYTES
          print("REAL_CAPACITY_RECOVERY_STAGE_OK",json.dumps(dict(proof,
                before_bytes=len(ledger.canonical(before)),after_bytes=len(ledger.canonical(after)),
                packed_bytes=Path("/tmp/paper-capacity-staged",repo.SNAPSHOT).stat().st_size,
                ledger_sha256=after["sha256"]),sort_keys=True))
          PY
      - name: Preserve checksum-sealed capacity evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper-readonly-capacity-${{ github.run_id }}
          path: |
            paper_eval/output/storage-capacity.json
            paper_eval/output/STORAGE-SHA256SUMS
          retention-days: 90
          if-no-files-found: error
