name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
  shadow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run one challenger cycle against production control
        run: bun run evaluation/shadow-cycle.ts
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-result
          path: evaluation/out/*.json
          retention-days: 30
