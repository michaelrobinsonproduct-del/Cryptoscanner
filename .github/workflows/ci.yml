name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run validate
      - run: bun run live-smoke
  shadow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run one challenger cycle against production control
        run: bun run evaluation/shadow-cycle.ts
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-result
          path: evaluation/out/*.json
          retention-days: 30
