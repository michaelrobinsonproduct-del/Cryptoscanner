name: Kraken Historical Backfill
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0'
  push:
    branches: [main]
    paths:
      - 'historical/backfill.py'
      - 'historical/compact.py'
      - '.github/workflows/kraken-historical-backfill.yml'
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Show revision
        run: git rev-parse HEAD
      - name: Run historical reconstruction
        run: python historical/backfill.py
      - name: Build compact training dataset
        run: python historical/compact.py
      - name: Upload compact historical dataset
        uses: actions/upload-artifact@v4
        with:
          name: kraken-historical-derived
          path: historical/output/
          retention-days: 30
          compression-level: 9
