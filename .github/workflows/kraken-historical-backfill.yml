name: Kraken Historical Backfill
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/kraken-historical-backfill.yml'
      - 'historical/backfill.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kraken-historical-backfill.yml'
      - 'historical/backfill.py'
      - 'historical/test_backfill_contract.py'
jobs:
  backfill:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Show revision
        run: git rev-parse HEAD
      - name: Compile historical Python scripts
        run: python -m py_compile historical/backfill.py historical/compact.py historical/verify_manifest.py historical/test_backfill_contract.py historical/test_gap_equivalence.py historical/test_dedupe_equivalence.py historical/test_compact_integration.py historical/verify_moves.py historical/test_verify_moves.py
      - name: Test historical signal contract
        run: |
          python historical/test_backfill_contract.py
          python -O historical/test_backfill_contract.py
      - name: Test optimized historical continuity in normal and optimized modes
        run: |
          python historical/test_gap_equivalence.py
          python -O historical/test_gap_equivalence.py
      - name: Test production candle deduplication against 100 reference scenarios
        run: python historical/test_dedupe_equivalence.py
      - name: Test synthetic historical compaction
        run: python historical/test_compact_integration.py
      - name: Test move-artifact validator on 200 cases
        run: python historical/test_verify_moves.py
      - name: Run historical reconstruction
        run: python historical/backfill.py
      - name: Build compact training dataset
        run: python historical/compact.py
      - name: Verify compact historical artifact integrity
        run: python historical/verify_manifest.py
      - name: Verify all reconstructed move episodes before publication
        run: python historical/verify_moves.py
      - name: Upload compact historical dataset
        uses: actions/upload-artifact@v4
        with:
          name: kraken-historical-derived
          path: historical/output/
          retention-days: 90
          compression-level: 9

  market-wide-q2-replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    concurrency:
      group: market-wide-q2-replay-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify historical contracts and calculate source cohort identity
        id: identity
        run: |
          python historical/test_backfill_contract.py
          python -m unittest paper_pov.test_market_wide_learning -v
          key=$(sha256sum historical/backfill.py historical/kraken_q3_48h_shadow.py paper_pov/market_wide_learning.py paper_pov/frozen_historical_shadow.py paper_pov/heldout_outcome_adapter.py | sha256sum | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Reuse completed exact-source Q2 cohort instead of redownloading
        id: reuse
        env:
          COHORT_KEY: ${{ steps.identity.outputs.key }}
        run: |
          set -euo pipefail
          name="market-wide-q2-$COHORT_KEY"
          # The first Q2 replay was started before unrelated scorer/continuity fixes.
          # Reuse it only if the extraction implementation matches exactly.
          first=44220694310
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$first" --jq '.status + ":" + (.conclusion // "")')" = "completed:success" ]; then
            git fetch --no-tags --depth=1 origin 8b701967fed44336df210fb971642ffff209e241
            if python - <<'PY'
          import ast,subprocess
          from pathlib import Path
          ref="8b701967fed44336df210fb971642ffff209e241"
          whole=("historical/backfill.py","historical/kraken_q3_48h_shadow.py","paper_pov/frozen_historical_shadow.py","paper_pov/heldout_outcome_adapter.py","paper_pov/shadow_learning_evidence.py")
          for p in whole:
              assert Path(p).read_bytes()==subprocess.check_output(["git","show",ref+":"+p]),p
          p="paper_pov/market_wide_learning.py"
          names={"run_archive_market_cohorts","build_market_cohort","describe_observed_crossings","crossing_summary"}
          def extraction(source):
              return {n.name:ast.dump(n,include_attributes=False) for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name in names}
          assert extraction(Path(p).read_text())==extraction(subprocess.check_output(["git","show",ref+":"+p]).decode())
          PY
            then
              artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$first/artifacts" --jq '.artifacts[] | select(.expired==false and (.name | startswith("market-wide-q2-"))) | .name' | head -n 1)
              if [ -n "$artifact" ]; then
                mkdir -p historical/output
                gh run download "$first" -n "$artifact" -D historical/output
                (cd historical/output && sha256sum -c Q2-MARKET-WIDE-SHA256SUMS)
                echo "reuse=true" >> "$GITHUB_OUTPUT"
                echo "Q2_REUSABLE_COHORT_RUN=$first"
                exit 0
              fi
            fi
          fi
          while read -r branch run; do
            if [ "$branch" != "$PR_BRANCH" ]; then continue; fi
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status + ":" + (.conclusion // "")')
            if [ "$status" = "completed:success" ]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "Q2_REUSABLE_COHORT_RUN=$run"
              exit 0
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" --paginate --jq '.artifacts[] | select(.expired==false) | [.workflow_run.head_branch,.workflow_run.id] | @tsv')
          echo "reuse=false" >> "$GITHUB_OUTPUT"
      - name: Rebuild market-wide Q2 cohort from the pinned official archive
        if: steps.reuse.outputs.reuse == 'false'
        run: |
          python -m historical.backfill --market-wide-only
          cd historical/output
          sha256sum q2-market-wide-cohorts.jsonl.gz q2-market-wide-summary.json > Q2-MARKET-WIDE-SHA256SUMS
      - name: Retain reusable Q2 cohort without retaining raw archive
        if: steps.reuse.outputs.reuse == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: market-wide-q2-${{ steps.identity.outputs.key }}
          path: |
            historical/output/q2-market-wide-cohorts.jsonl.gz
            historical/output/q2-market-wide-summary.json
            historical/output/Q2-MARKET-WIDE-SHA256SUMS
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
