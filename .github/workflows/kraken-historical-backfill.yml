name: Kraken Historical Backfill
on:
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Show revision
        run: git rev-parse HEAD
      - name: Run historical backfill
        run: python historical/backfill.py
