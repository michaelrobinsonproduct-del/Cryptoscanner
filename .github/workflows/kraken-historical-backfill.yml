name: Kraken Historical Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kraken-historical-backfill.yml'
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Show revision
        run: git rev-parse HEAD
      - name: Compile historical Python scripts
        run: python -m py_compile historical/backfill.py historical/compact.py historical/verify_manifest.py historical/test_backfill_contract.py historical/test_gap_equivalence.py historical/test_dedupe_equivalence.py historical/test_compact_integration.py
      - name: Test historical signal contract
        run: |
          python historical/test_backfill_contract.py
          python -O historical/test_backfill_contract.py
      - name: Test optimized historical continuity in normal and optimized modes
        run: |
          python historical/test_gap_equivalence.py
          python -O historical/test_gap_equivalence.py
      - name: Test production candle deduplication against 100 reference scenarios
        run: python historical/test_dedupe_equivalence.py
      - name: Test synthetic historical compaction
        run: python historical/test_compact_integration.py
      - name: Run historical reconstruction
        run: python historical/backfill.py
      - name: Build compact training dataset
        run: python historical/compact.py
      - name: Verify compact historical artifact integrity
        run: python historical/verify_manifest.py
      - name: Upload compact historical dataset
        uses: actions/upload-artifact@v4
        with:
          name: kraken-historical-derived
          path: historical/output/
          retention-days: 90
          compression-level: 9
