name: Research Kraken bounded prospective source probe (no production writes)
on:
  pull_request:
    paths:
      - 'research/kraken_prospective_provenance.py'
      - 'research/test_kraken_prospective_provenance.py'
      - 'research/kraken_prospective_batch.py'
      - 'research/test_kraken_prospective_batch.py'
      - '.github/workflows/research-kraken-prospective-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert immutable exact-head source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "KRAKEN_PROSPECTIVE_EXACT_SHA=$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline adversarial tests
        run: |
          set -euo pipefail
          python -m unittest research.test_kraken_prospective_provenance research.test_kraken_prospective_batch -v
      - name: One bounded public Kraken source capture
        run: |
          set -euo pipefail
          python -m research.kraken_prospective_provenance --pair XBTUSD --output /tmp/kraken-prospective-evidence.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/kraken-prospective-evidence.json'))
          assert p['capture_mode']=='PROSPECTIVE_TLS_KRAKEN_PUBLIC_GET'
          assert p['authenticated_first_entry_episodes']==0 and p['held_out_lift'] is None
          print('KRAKEN_SOURCE_CAPTURE_RECEIPT',p['depth_receipt']['sha256'],p['trades_receipt']['sha256'])
          print('KRAKEN_QUOTE_FRESHNESS',p['quote_event_fresh_le600s'])
          print('KRAKEN_TRADE_FRESHNESS',p['trade_event_fresh_le600s'])
          PY
      - name: Bounded four-market raw receipt pilot (not continuous coverage)
        run: |
          set -euo pipefail
          python -m research.kraken_prospective_batch --pairs XBTUSD,ETHUSD,SOLUSD,XRPUSD --output-dir /tmp/kraken-batch-evidence
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/kraken-batch-evidence')
          m=json.loads((root/'manifest.json').read_text())
          assert m['pairs_requested']==4
          assert m['pairs_eligible']>=1, 'No fresh source-authenticated market: do not claim acquisition success'
          assert m['pairs_eligible']+m['pairs_stale']+m['pairs_invalid']+m['pairs_budget_skipped']==4
          assert m['certified_first_entry_episodes']==0 and m['held_out_lift'] is None and not m['production_applied']
          for entry in m['entries']:
              for item in entry['raw']:
                  assert hashlib.sha256((root/item['file']).read_bytes()).hexdigest()==item['sha256']
          print('KRAKEN_BATCH_COVERAGE',json.dumps({k:m[k] for k in ('pairs_requested','pairs_eligible','pairs_stale','pairs_invalid','pairs_budget_skipped')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-prospective-evidence-${{ github.run_id }}
          path: |
            /tmp/kraken-prospective-evidence.json
            /tmp/kraken-batch-evidence/
          if-no-files-found: ignore
          retention-days: 14
