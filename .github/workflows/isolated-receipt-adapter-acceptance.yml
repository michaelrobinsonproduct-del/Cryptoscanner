name: Isolated receipt adapter acceptance
on:
  push:
    branches:
      - batch/read-only-receipt-gate-20261103
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  receipt-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: michaelrobinsonproduct-del/Cryptoscanner
          ref: owner-a-a2-quote-freshness-20261103
          path: a2-source
          persist-credentials: false
      - name: Verify source and run all adapter tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest tools.test_scan_receipt_gate tools.test_c_integration_receipt_bridge tools.test_a2_verified_snapshot_bridge tools.test_raw_scanner_receipt_adapter tools.test_verified_paper_handoff -v
      - name: Download actual published A2 transport artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/actual-a2
          gh run download 41745901223 -R michaelrobinsonproduct-del/Cryptoscanner -n a2-live-consumer-evidence -D /tmp/actual-a2
          test -s /tmp/actual-a2/a2-verified-transport.zip
          test -s /tmp/actual-a2/verified-snapshot.json
      - name: Execute adapter against authenticated A2 ZIP at capture-time and current-time
        env:
          PYTHONPATH: a2-source:.
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, subprocess, sys, zipfile
          from pathlib import Path
          from paper_pov.a2_artifact_consumer import read_artifact_zip
          from tools.a2_verified_snapshot_bridge import assess_verified_a2
          transport=Path("/tmp/actual-a2/a2-verified-transport.zip")
          with zipfile.ZipFile(transport) as archive:
              report=json.loads(archive.read("latest.json"))
          captured=dt.datetime.fromisoformat(report["as_of"].replace("Z","+00:00"))
          capture_verified=read_artifact_zip(transport, now=captured+dt.timedelta(seconds=15))
          capture_verdict=assess_verified_a2(capture_verified)
          assert capture_verdict["accepted"], capture_verdict
          assert capture_verdict["live_watch_certified"] is False
          assert capture_verdict["receipt_sha256"]==capture_verified["receipt_sha256"]
          exported=json.loads(Path("/tmp/actual-a2/verified-snapshot.json").read_bytes())
          assert exported["receipt_sha256"]==capture_verified["receipt_sha256"]
          assert exported["watch"]==capture_verified["watch"]
          # Execute the actual CLI at wall-clock read time. It must accept only
          # while the source receipt and every quote remain within 10 minutes.
          proc=subprocess.run([sys.executable,"-m","tools.a2_verified_snapshot_bridge","--a2-zip",str(transport)],capture_output=True,text=True)
          wall_age=(dt.datetime.now(dt.timezone.utc)-captured).total_seconds()
          if wall_age <= 600:
              assert proc.returncode==0, proc.stdout+proc.stderr
              wall=json.loads(proc.stdout)
              assert wall["accepted"] and wall["live_watch_certified"] is False
          else:
              assert proc.returncode==1, "expired real A2 artifact unexpectedly accepted"
              assert json.loads(proc.stdout)["accepted"] is False
          print("A2_REAL_ARTIFACT_ADAPTER_VERIFIED",json.dumps({
              "receipt_sha256":capture_verified["receipt_sha256"],
              "watch_count":capture_verdict["paper_watch_count"],
              "eligible_pairs":capture_verified["eligible_pairs"],
              "observed_markets":capture_verified["observed_markets"],
              "capture_time_accepted":True,
              "wall_clock_age_seconds":round(wall_age,2),
              "wall_clock_result":"ACCEPTED" if wall_age<=600 else "ABSTAINED_STALE",
              "live_watch_certified":False,
              "production_applied":False
          },sort_keys=True))
          PY
      - name: Consume independently published real Kraken two-member scanner receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a1-raw-scanner
          gh run download 41745901270 -R michaelrobinsonproduct-del/Cryptoscanner -n a1-a2-live-paper-evidence -D /tmp/a1-raw-scanner
          python - <<'PY'
          import datetime as dt, json, zipfile
          from pathlib import Path
          from tools.a2_verified_snapshot_bridge import read_scanner_receipt_zip, write_verified_handoff
          root=Path("/tmp/a1-raw-scanner")
          receipts=list(root.glob("receipts/*.json"))
          assert len(receipts)==1
          archive=root/"raw-transport.zip"
          with zipfile.ZipFile(archive,"w",compression=zipfile.ZIP_DEFLATED) as out:
              out.write(root/"latest.json","latest.json")
              out.write(receipts[0],"receipts/"+receipts[0].name)
          original=json.loads((root/"latest.json").read_bytes())
          captured=dt.datetime.fromisoformat(original["as_of"].replace("Z","+00:00"))
          verified=read_scanner_receipt_zip(archive,now=captured+dt.timedelta(seconds=15))
          handoff=write_verified_handoff(verified,root/"paper-candidate-handoff.json")
          persisted=json.loads((root/"paper-candidate-handoff.json").read_bytes())
          assert handoff==persisted
          assert len(persisted["watch"])==1
          assert persisted["eligible_pairs"]==605 and persisted["observed_markets"]==602
          assert persisted["live_watch_certified"] is False and persisted["production_applied"] is False
          try:
              read_scanner_receipt_zip(archive,now=captured+dt.timedelta(seconds=601))
          except ValueError:
              pass
          else:
              raise AssertionError("expired source unexpectedly accepted")
          print("REAL_A1_VERIFIED_PAPER_HANDOFF",json.dumps({
              "receipt_sha256":handoff["receipt_sha256"],
              "watch_count":len(handoff["watch"]),
              "eligible_pairs":handoff["eligible_pairs"],
              "observed_markets":handoff["observed_markets"],
              "paper_only":True,
              "source_expiry_abstained":True,
              "production_applied":False
          },sort_keys=True))
          PY
      - name: Publish independently verified read-only candidate handoff
        uses: actions/upload-artifact@v4
        with:
          name: verified-paper-candidate-handoff
          path: /tmp/a1-raw-scanner/paper-candidate-handoff.json
          if-no-files-found: error
          retention-days: 7
      - name: Confirm fail-closed CLI exit on invalid report
        run: |
          set -euo pipefail
          printf '%s\\n' '{"scan_status":"WATCH","watch":[]}' > /tmp/invalid-a2.json
          if PYTHONPATH=a2-source:. python -m tools.a2_verified_snapshot_bridge --a2-zip /tmp/invalid-a2.json; then
            echo "FAIL: invalid A2 receipt accepted"
            exit 1
          fi
